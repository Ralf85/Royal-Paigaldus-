<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #0d0f13; color: #e2e8f0; -webkit-text-size-adjust: 100%; }
  header { background: #13161c; border-bottom: 0.5px solid rgba(255,255,255,0.07); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 17px; font-weight: 800; letter-spacing: 0.2px; }

  .alapealkiri { font-size: 12px; color: #8b93a1; margin-top: 2px; }

  .btn.kuld:hover { background: #d8b95e; }

  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  .eelvaate-riba { background: #3b2f0b; color: #fcd34d; font-size: 13px; padding: 9px 16px; text-align: center; }

  /* Saldo */

  .saldo-silt { font-size: 12px; color: #a99a6e; text-transform: uppercase; letter-spacing: 0.8px; }

  .saldo-all { font-size: 12px; color: #8b93a1; margin-top: 6px; line-height: 1.5; }
  .hoiatus { background: #3b2f0b; border: 0.5px solid #7a5d0f; color: #fcd34d; border-radius: 10px; padding: 10px 13px; font-size: 13px; margin-bottom: 12px; line-height: 1.45; }
  .statid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { background: #13161c; border: 0.5px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 12px; }

  .kaart { background: #13161c; border: 0.5px solid rgba(255,255,255,0.07); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .kaart-hdr { padding: 12px 15px; border-bottom: 0.5px solid rgba(255,255,255,0.06); font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .kaart-sisu { padding: 14px 15px; }
  .arve-rida { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 13px; color: #b6bdc9; border-bottom: 0.5px solid rgba(255,255,255,0.04); }

  .tabid { display: flex; gap: 2px; margin-bottom: 12px; overflow-x: auto; border-bottom: 0.5px solid rgba(255,255,255,0.07); }

  /* Vormid */
  input, select, textarea { background: #0d0f13; border: 0.5px solid #2b3039; border-radius: 8px; padding: 10px 11px; color: #e2e8f0; font-size: 16px; font-family: inherit; width: 100%; outline: none; }

  .teade { display: none; border-radius: 8px; padding: 9px 13px; font-size: 13px; margin-bottom: 12px; }
  .teade.viga { display: block; background: #7f1d1d; color: #fca5a5; }

  .modaal.avatud { display: flex; }

  .pin { text-align: center; font-size: 22px; letter-spacing: 8px; padding: 14px; margin-bottom: 12px; }

  #suurpilt { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 99; align-items: center; justify-content: center; padding: 16px; }
  #suurpilt img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
  #suurpilt button { position: absolute; top: 14px; right: 14px; width: 42px; height: 42px; border: none; border-radius: 50%; background: rgba(255,255,255,0.16); color: #fff; font-size: 20px; cursor: pointer; }
</style>

<script src="/failid.js"></script>
<script>
// ── Sisselogimine ────────────────────────────────────────────────
// Leht töötab kahes rollis:
//   admin  — Royal Paigalduse admin (olemasolev adminToken); saab kõike muuta
//   naaber — logib siin lehel oma PIN-iga (remontToken); ainult vaatab
var token = '';
var roll = null;
var eelvaade = false;   // admin vaatab lehte naabri pilguga
var A = null;           // viimati laetud andmed
var aktiivneTab = 'tood';

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function raha(n) {
  return (Number(n) || 0).toLocaleString('et-EE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}
function arv(n) {
  return (Number(n) || 0).toLocaleString('et-EE', { maximumFractionDigits: 2 });
}
function loeArv(v) {
  var s = String(v == null ? '' : v).trim().replace(/\s/g, '').replace(',', '.');
  return s === '' ? NaN : parseFloat(s);
}
function kp(s) {
  var o = String(s || '').split('-');
  return o.length === 3 ? o[2] + '.' + o[1] + '.' + o[0] : String(s || '');
}
var PAEVAD = ['pühapäev', 'esmaspäev', 'teisipäev', 'kolmapäev', 'neljapäev', 'reede', 'laupäev'];
function kpPikk(s) {
  var d = new Date(s + 'T12:00:00');
  return isNaN(d) ? kp(s) : PAEVAD[d.getDay()] + ', ' + kp(s);
}
function tana() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function saabMuuta() { return roll === 'admin' && !eelvaade; }

async function api(tee, seaded) {
  seaded = seaded || {};
  seaded.headers = Object.assign({ 'x-session-token': token }, seaded.headers || {});
  if (seaded.body && !(seaded.body instanceof FormData)) seaded.headers['Content-Type'] = 'application/json';
  try {
    var r = await fetch('/api/remont' + tee, seaded);
    return await r.json();
  } catch (e) {
    return { ok: false, veateade: 'Ühenduse viga — proovi uuesti' };
  }
}

function teade(id, tekst, korras) {
  var el = document.getElementById(id);
  el.className = 'teade' + (tekst ? (korras ? ' korras' : ' viga') : '');
  el.textContent = tekst || '';
}
function ava(id) { document.getElementById(id).classList.add('avatud'); }
function sulge(id) { document.getElementById(id).classList.remove('avatud'); }
function suurPilt(url) {
  document.getElementById('suurpiltImg').src = url;
  document.getElementById('suurpilt').style.display = 'flex';
}
Array.prototype.forEach.call(document.querySelectorAll('.modaal'), function (m) {
  m.addEventListener('click', function (e) { if (e.target === m) m.classList.remove('avatud'); });
});

async function alusta() {
  // Proovime järjest: admini võti, siis naabri võti.
  var voimalikud = [];
  try {
    voimalikud = [localStorage.getItem('adminToken'), localStorage.getItem('remontToken')].filter(Boolean);
  } catch (e) {}
  for (var i = 0; i < voimalikud.length; i++) {
    token = voimalikud[i];
    var s = await api('/sessioon');
    if (s.ok && s.roll) { roll = s.roll; return laadi(); }
  }
  token = '';
  naitaLogin();
}

function naitaLogin() {
  document.getElementById('appVaade').style.display = 'none';
  document.getElementById('loginVaade').style.display = 'block';
  document.getElementById('pinSisend').focus();
}
document.getElementById('pinSisend').addEventListener('keydown', function (e) { if (e.key === 'Enter') logiSisse(); });

async function logiSisse() {
  var pin = document.getElementById('pinSisend').value.trim();
  if (!pin) return teade('loginTeade', 'Sisesta PIN-kood');
  var r = await api('/login', { method: 'POST', body: JSON.stringify({ pin: pin }) });
  if (!r.ok) return teade('loginTeade', r.veateade || 'Vale PIN-kood');
  token = r.token;
  roll = 'naaber';
  try { localStorage.setItem('remontToken', token); } catch (e) {}
  document.getElementById('pinSisend').value = '';
  teade('loginTeade', '');
  laadi();
}

async function logiValja() {
  await api('/logout', { method: 'POST' });
  try { localStorage.removeItem('remontToken'); } catch (e) {}
  token = ''; roll = null;
  naitaLogin();
}

function lylitaEelvaade() {
  eelvaade = !eelvaade;
  if (eelvaade && aktiivneTab === 'seaded') aktiivneTab = 'tood';
  joonista();
  window.scrollTo(0, 0);
}

async function laadi() {
  var r = await api('/andmed');
  if (!r.ok) {
    if (!A) { roll = null; naitaLogin(); }
    return;
  }
  A = r;
  roll = r.roll;
  document.getElementById('loginVaade').style.display = 'none';
  document.getElementById('appVaade').style.display = 'block';
  joonista();
}

// ── Joonistamine ─────────────────────────────────────────────────
function joonista() {
  var s = A.seaded;
  document.title = s.projekti_nimi;
  document.getElementById('pealkiri').textContent = s.projekti_nimi;
  document.getElementById('alapealkiri').textContent = s.minu_nimi + ' ja ' + s.naabri_nimi + ' · töö ' + raha(s.tunnihind) + '/h';
  document.getElementById('eelvaateRiba').style.display = eelvaade ? 'block' : 'none';
  document.getElementById('eelvaateTekst').textContent = 'Nii näeb seda lehte ' + s.naabri_nimi;

  var nupud = '<button class="btn" onclick="laeExcel()">⬇ Excel</button>';
  if (roll === 'admin' && !eelvaade) {
    nupud += '<button class="btn" onclick="lylitaEelvaade()">👁 ' + esc(s.naabri_nimi) + ' vaade</button>'
      + '<a class="btn" href="/admin">← Admin</a>';
  }
  if (roll === 'naaber') nupud += '<button class="btn" onclick="logiValja()">Logi välja</button>';
  document.getElementById('paiseNupud').innerHTML = nupud;

  joonistaYlevaade();

  var tabid = [['tood', 'Tööd'], ['kulud', 'Materjalid'], ['maksed', 'Maksed'], ['osad', 'Jaotus']];
  if (saabMuuta()) tabid.push(['seaded', 'Seaded']);
  document.getElementById('tabid').innerHTML = tabid.map(function (t) {
    return '<button class="tab' + (t[0] === aktiivneTab ? ' aktiivne' : '') + '" onclick="valiTab(\'' + t[0] + '\')">' + t[1] + '</button>';
  }).join('');
  ['tood', 'kulud', 'maksed', 'osad', 'seaded'].forEach(function (t) {
    document.getElementById('paneel-' + t).className = 'paneel' + (t === aktiivneTab ? ' aktiivne' : '');
  });
  joonistaTood();
  joonistaKulud();
  joonistaMaksed();
  joonistaOsad();
  if (saabMuuta()) joonistaSeaded();
}

function valiTab(t) { aktiivneTab = t; joonista(); }

function joonistaYlevaade() {
  var s = A.seaded, k = A.kokku;
  var silt, klass = '';
  if (Math.abs(k.saldo) < 0.005) { silt = 'Arved on tasa'; klass = ' null'; }
  else if (k.saldo > 0) silt = s.naabri_nimi + ' tasuda';
  else silt = s.minu_nimi + ' tasuda (' + s.naabri_nimi + ' on rohkem maksnud)';

  var html = '<div class="saldo"><div class="saldo-silt">' + esc(silt) + '</div>'
    + '<div class="saldo-summa' + klass + '">' + raha(Math.abs(k.saldo)) + '</div>'
    + '<div class="saldo-all">Töö ja materjalid kokku, juba tasutud summad maha arvatud. Hinnad on käibemaksuta.</div></div>';

  if (k.maaramata_toid) {
    html += '<div class="hoiatus">⚠ ' + k.maaramata_toid + ' töökirjel on jaotus veel määramata — need pole summades sees.'
      + (saabMuuta() ? ' Ava „Tööd" ja vali neile tööosa.' : '') + '</div>';
  }

  html += '<div class="statid">'
    + '<div class="stat"><div class="stat-silt">Töö</div><div class="stat-arv">' + raha(k.naabri_too) + '</div>'
    + '<div class="stat-all">' + esc(s.naabri_nimi) + ' osa ' + arv(k.naabri_tunnid) + ' h / kokku ' + arv(k.tunnid) + ' h</div></div>'
    + '<div class="stat"><div class="stat-silt">Materjalid</div><div class="stat-arv">' + raha(k.naabri_materjal) + '</div>'
    + '<div class="stat-all">' + esc(s.naabri_nimi) + ' osa / kokku ' + raha(k.materjal) + '</div></div>'
    + '<div class="stat"><div class="stat-silt">Tasutud</div><div class="stat-arv">' + raha(k.makstud_naabrilt) + '</div>'
    + '<div class="stat-all">' + esc(s.naabri_nimi) + ' → ' + esc(s.minu_nimi) + '</div></div>'
    + '</div>';

  html += '<div class="kaart"><div class="kaart-hdr">Kuidas summa kujuneb</div><div class="kaart-sisu">'
    + '<div class="arve-rida"><span>' + esc(s.naabri_nimi) + ' osa tööst (' + arv(k.naabri_tunnid) + ' h × ' + raha(s.tunnihind) + ')</span><b>' + raha(k.naabri_too) + '</b></div>'
    + '<div class="arve-rida"><span>+ ' + esc(s.naabri_nimi) + ' osa materjalidest, mille ostis ' + esc(s.minu_nimi) + '</span><b>' + raha(k.minu_ostudest_naabri_osa) + '</b></div>';
  if (k.naabri_ostudest_minu_osa) {
    html += '<div class="arve-rida"><span>− ' + esc(s.minu_nimi) + ' osa materjalidest, mille ostis ' + esc(s.naabri_nimi) + '</span><b>−' + raha(k.naabri_ostudest_minu_osa) + '</b></div>';
  }
  html += '<div class="arve-rida"><span>− ' + esc(s.naabri_nimi) + ' on juba tasunud</span><b>−' + raha(k.makstud_naabrilt) + '</b></div>';
  if (k.makstud_naabrile) {
    html += '<div class="arve-rida"><span>+ ' + esc(s.minu_nimi) + ' on tagasi maksnud</span><b>' + raha(k.makstud_naabrile) + '</b></div>';
  }
  html += '<div class="arve-rida kokku"><span>' + esc(silt) + '</span><b>' + raha(Math.abs(k.saldo)) + '</b></div>'
    + '</div></div>';

}

// Jaotuse riba: vasakul minu osa (hall), paremal naabri osa (kuldne).
function ribaHtml(naabriProtsent, minuTekst, naabriTekst) {
  var s = A.seaded;
  var n = Math.max(0, Math.min(100, Number(naabriProtsent) || 0));
  return '<div class="riba"><i style="margin-left:' + (100 - n) + '%;width:' + n + '%"></i></div>'
    + '<div class="riba-silt"><span>' + esc(s.minu_nimi) + ' ' + arv(100 - n) + '%' + (minuTekst ? ' · ' + minuTekst : '') + '</span>'
    + '<span class="n">' + esc(s.naabri_nimi) + ' ' + arv(n) + '%' + (naabriTekst ? ' · ' + naabriTekst : '') + '</span></div>';
}

function joonistaTood() {
  var s = A.seaded;

    html += '<div class="vihje">Töötajad panevad tunnid kirja tavalise töökirjena ettevõtte <b>' + esc(A.ettevote_nimi || '') + '</b> alla ja valivad objektiks tööosa. '

var osaId = null;
function osaValikud(valitud, tyhiTekst) {
  return '<option value="">' + esc(tyhiTekst) + '</option>' + A.osad.filter(function (o) {
    return o.aktiivne || String(o.id) === String(valitud);
  }).map(function (o) {
    return '<option value="' + o.id + '"' + (String(o.id) === String(valitud) ? ' selected' : '') + '>' + esc(o.nimi)
      + (o.naabri_protsent === null ? '' : ' (' + esc(A.seaded.naabri_nimi) + ' ' + arv(o.naabri_protsent) + '%)') + '</option>';
  }).join('');
}
function uusOsa() {
  osaId = null;
  document.getElementById('osaPealkiri').textContent = 'Lisa tööosa';
  document.getElementById('osaNimi').value = '';
  document.getElementById('osaProtsent').value = '50';
  document.getElementById('osaAktiivneVali').style.display = 'none';
  avaOsa();
}
function muudaOsa(id) {
  var o = A.osad.find(function (x) { return x.id === id; });
  if (!o) return;
  osaId = id;
  document.getElementById('osaPealkiri').textContent = 'Muuda tööosa';
  document.getElementById('osaNimi').value = o.nimi;
  document.getElementById('osaProtsent').value = o.naabri_protsent === null ? '' : String(o.naabri_protsent).replace('.', ',');
  document.getElementById('osaAktiivne').checked = !!o.aktiivne;
  document.getElementById('osaAktiivneVali').style.display = 'block';
  avaOsa();
}
function avaOsa() {
  document.getElementById('osaProtsentSilt').textContent = A.seaded.naabri_nimi + ' osa %';
  teade('osaTeade', '');
  osaArvuta();
  ava('osaModaal');
}
function osaArvuta() {
  var p = loeArv(document.getElementById('osaProtsent').value);
  var korras = isFinite(p) && p >= 0 && p <= 100;
  document.getElementById('osaArvutus').innerHTML = korras
    ? '<span>' + esc(A.seaded.minu_nimi) + ' <b>' + arv(100 - p) + '%</b></span><span>' + esc(A.seaded.naabri_nimi) + ' <b>' + arv(p) + '%</b></span>'
    : '<span>Sisesta protsent vahemikus 0–100</span>';
}
async function salvestaOsa() {
  var keha = {
    nimi: document.getElementById('osaNimi').value,
    naabri_protsent: document.getElementById('osaProtsent').value,
    aktiivne: osaId ? document.getElementById('osaAktiivne').checked : true
  };
  var nupp = document.getElementById('osaSalvesta');
  nupp.disabled = true;
  var r = osaId
    ? await api('/osad/' + osaId, { method: 'PUT', body: JSON.stringify(keha) })
    : await api('/osad', { method: 'POST', body: JSON.stringify(keha) });
  nupp.disabled = false;
  if (!r.ok) return teade('osaTeade', r.veateade || 'Salvestamine ebaõnnestus');
  sulge('osaModaal');
  laadi();
}

// ── Töökirje jaotus ──────────────────────────────────────────────
var tooId = null;
function muudaTood(id) {
  var t = A.tood.find(function (x) { return x.id === id; });
  if (!t) return;
  tooId = id;
  document.getElementById('tooInfo').textContent = kp(t.kuupaev) + ' · ' + t.tootaja + ' · ' + arv(t.tunnid) + ' h' + (t.kommentaar ? ' · ' + t.kommentaar : '');
  document.getElementById('tooOsa').innerHTML = osaValikud(t.objekt_id, '— tööosa valimata —');
  document.getElementById('tooProtsentSilt').textContent = A.seaded.naabri_nimi + ' osa % (ainult sellel kirjel)';
  document.getElementById('tooProtsent').value = t.oma_jaotus ? String(t.naabri_protsent).replace('.', ',') : '';
  teade('tooTeade', '');
  tooArvuta();
  ava('tooModaal');
}
function tooArvuta() {
  var t = A.tood.find(function (x) { return x.id === tooId; });
  if (!t) return;
  var s = A.seaded;
  var sisend = document.getElementById('tooProtsent').value.trim();
  var p;
  if (sisend === '') {
    var o = A.osad.find(function (x) { return String(x.id) === document.getElementById('tooOsa').value; });
    p = o && o.naabri_protsent !== null ? o.naabri_protsent : null;
  } else {
    p = loeArv(sisend);
    if (!isFinite(p) || p < 0 || p > 100) p = NaN;
  }
  var el = document.getElementById('tooArvutus');
  if (p === null) el.innerHTML = '<span>Jaotus on määramata — vali tööosa või sisesta protsent.</span>';
  else if (isNaN(p)) el.innerHTML = '<span>Sisesta protsent vahemikus 0–100</span>';
  else {
    var nt = t.tunnid * p / 100;
    el.innerHTML = '<span>' + esc(s.minu_nimi) + ' <b>' + arv(t.tunnid - nt) + ' h</b></span>'
      + '<span>' + esc(s.naabri_nimi) + ' <b>' + arv(nt) + ' h = ' + raha(nt * s.tunnihind) + '</b></span>';
  }
}
async function salvestaToo() {
  var nupp = document.getElementById('tooSalvesta');
  nupp.disabled = true;
  var r = await api('/tood/' + tooId + '/jaotus', { method: 'PUT', body: JSON.stringify({
    objekt_id: document.getElementById('tooOsa').value || null,
    naabri_protsent: document.getElementById('tooProtsent').value
  }) });
  nupp.disabled = false;
  if (!r.ok) return teade('tooTeade', r.veateade || 'Salvestamine ebaõnnestus');
  sulge('tooModaal');
  laadi();
}

// ── Materjalid ───────────────────────────────────────────────────
var kuluId = null, kuluMaksjaV = 'mina', kuluJaotusV = 'protsent';
function kuluMaksjaJoonista() {
  var s = A.seaded;
  document.getElementById('kuluMaksja').innerHTML =
    '<button type="button" class="' + (kuluMaksjaV === 'mina' ? 'sees' : '') + '" onclick="kuluMaksjaVali(\'mina\')">' + esc(s.minu_nimi) + '</button>'
    + '<button type="button" class="' + (kuluMaksjaV === 'naaber' ? 'sees' : '') + '" onclick="kuluMaksjaVali(\'naaber\')">' + esc(s.naabri_nimi) + '</button>';
}
function kuluMaksjaVali(v) { kuluMaksjaV = v; kuluMaksjaJoonista(); }
function kuluJaotus(v) {
  kuluJaotusV = v;
  document.getElementById('kuluJaotusProtsent').className = v === 'protsent' ? 'sees' : '';
  document.getElementById('kuluJaotusSumma').className = v === 'summa' ? 'sees' : '';
  document.getElementById('kuluProtsentVali').style.display = v === 'protsent' ? 'block' : 'none';
  document.getElementById('kuluNaabriSummaVali').style.display = v === 'summa' ? 'block' : 'none';
  kuluArvuta();
}
function kuluOsaValitud() {
  var o = A.osad.find(function (x) { return String(x.id) === document.getElementById('kuluOsa').value; });
  if (o && o.naabri_protsent !== null) {
    kuluJaotus('protsent');
    document.getElementById('kuluProtsent').value = String(o.naabri_protsent).replace('.', ',');
  }
  kuluArvuta();
}
// Tagastab naabri osa eurodes või null, kui sisend pole korras.
function kuluNaabriOsa() {
  var summa = loeArv(document.getElementById('kuluSumma').value);
  if (!isFinite(summa) || summa <= 0) return null;
  if (kuluJaotusV === 'summa') {
    var n = loeArv(document.getElementById('kuluNaabriSumma').value);
    return isFinite(n) && n >= 0 && n <= summa + 0.001 ? n : null;
  }
  var p = loeArv(document.getElementById('kuluProtsent').value);
  return isFinite(p) && p >= 0 && p <= 100 ? Math.round(summa * p) / 100 : null;
}
function kuluArvuta() {
  var s = A.seaded;
  var summa = loeArv(document.getElementById('kuluSumma').value);
  var n = kuluNaabriOsa();
  document.getElementById('kuluArvutus').innerHTML = n === null
    ? '<span>Sisesta summa ja jaotus</span>'
    : '<span>' + esc(s.minu_nimi) + ' <b>' + raha(summa - n) + '</b></span><span>' + esc(s.naabri_nimi) + ' <b>' + raha(n) + '</b></span>';
}
function avaKulu() {
  document.getElementById('kuluProtsentSilt').textContent = A.seaded.naabri_nimi + ' osa %';
  document.getElementById('kuluNaabriSummaSilt').textContent = A.seaded.naabri_nimi + ' osa (€)';
  document.getElementById('kuluFoto').value = '';
  teade('kuluTeade', '');
  kuluMaksjaJoonista();
  kuluJaotus(kuluJaotusV);
  ava('kuluModaal');
}
function uusKulu() {
  kuluId = null; kuluMaksjaV = 'mina'; kuluJaotusV = 'protsent';
  document.getElementById('kuluPealkiri').textContent = 'Lisa tšekk';
  document.getElementById('kuluKuupaev').value = tana();
  document.getElementById('kuluSumma').value = '';
  document.getElementById('kuluKirjeldus').value = '';
  document.getElementById('kuluOsa').innerHTML = osaValikud('', '— ei ole seotud tööosaga —');
  document.getElementById('kuluProtsent').value = '50';
  document.getElementById('kuluNaabriSumma').value = '';
  document.getElementById('kuluFotoVihje').textContent = 'Pildista tšekk kohe — nii näeb ka ' + A.seaded.naabri_nimi + ', mille eest ta maksab.';
  avaKulu();
}
function muudaKulu(id) {
  var k = A.kulud.find(function (x) { return x.id === id; });
  if (!k) return;
  kuluId = id; kuluMaksjaV = k.maksja; kuluJaotusV = k.jaotus;
  document.getElementById('kuluPealkiri').textContent = 'Muuda tšekki';
  document.getElementById('kuluKuupaev').value = k.kuupaev;
  document.getElementById('kuluSumma').value = k.summa.toFixed(2).replace('.', ',');
  document.getElementById('kuluKirjeldus').value = k.kirjeldus;
  document.getElementById('kuluOsa').innerHTML = osaValikud(k.objekt_id || '', '— ei ole seotud tööosaga —');
  document.getElementById('kuluProtsent').value = k.naabri_protsent === null ? '' : String(k.naabri_protsent).replace('.', ',');
  document.getElementById('kuluNaabriSumma').value = k.naabri_summa.toFixed(2).replace('.', ',');
  document.getElementById('kuluFotoVihje').textContent = k.foto_url ? 'Foto on olemas. Vali uus ainult siis, kui tahad selle asendada.' : 'Foto puudub — lisa see siit.';
  avaKulu();
}

// Telefonipilt tehakse enne saatmist väiksemaks (kuni 1600 px, JPEG 80%) — kiirem üleslaadimine.
function vahendaPilt(fail) {
  return new Promise(function (valmis) {
    if (!fail.type || fail.type.indexOf('image/') !== 0) return valmis(fail);
    var url = URL.createObjectURL(fail);
    var img = new Image();
    img.onload = function () {
      URL.revokeObjectURL(url);
      var suurim = 1600, w = img.naturalWidth, h = img.naturalHeight;
      if (!w || !h) return valmis(fail);
      var k = Math.min(1, suurim / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function (blob) {
        valmis(blob && blob.size < fail.size ? new File([blob], 'tsekk.jpg', { type: 'image/jpeg' }) : fail);
      }, 'image/jpeg', 0.8);
    };
    img.onerror = function () { URL.revokeObjectURL(url); valmis(fail); };
    img.src = url;
  });
}

async function salvestaKulu() {
  if (kuluNaabriOsa() === null) return teade('kuluTeade', 'Kontrolli summat ja jaotust');
  var fd = new FormData();
  fd.append('kuupaev', document.getElementById('kuluKuupaev').value);
  fd.append('summa', document.getElementById('kuluSumma').value);
  fd.append('kirjeldus', document.getElementById('kuluKirjeldus').value);
  fd.append('maksja', kuluMaksjaV);
  fd.append('jaotus', kuluJaotusV);
  fd.append('naabri_protsent', document.getElementById('kuluProtsent').value);
  fd.append('naabri_summa', document.getElementById('kuluNaabriSumma').value);
  fd.append('objekt_id', document.getElementById('kuluOsa').value);
  var nupp = document.getElementById('kuluSalvesta');
  nupp.disabled = true; nupp.textContent = 'Salvestan...';
  var fail = document.getElementById('kuluFoto').files[0];
  if (fail) fd.append('foto', await vahendaPilt(fail));
  var r = await api(kuluId ? '/kulud/' + kuluId + '/uuenda' : '/kulud', { method: 'POST', body: fd });
  nupp.disabled = false; nupp.textContent = 'Salvesta';
  if (!r.ok) return teade('kuluTeade', r.veateade || 'Salvestamine ebaõnnestus');
  sulge('kuluModaal');
  laadi();
}
async function kustutaKulu(id) {
  var k = A.kulud.find(function (x) { return x.id === id; });
  if (!k || !confirm('Kustutan tšeki „' + k.kirjeldus + '" (' + raha(k.summa) + ')?')) return;
  var r = await api('/kulud/' + id, { method: 'DELETE' });
  if (!r.ok) alert(r.veateade || 'Kustutamine ebaõnnestus');
  laadi();
}

// ── Maksed ───────────────────────────────────────────────────────
var makseSuundV = 'naabrilt';
function makseSuundJoonista() {
  var s = A.seaded;
  document.getElementById('makseSuund').innerHTML =
    '<button type="button" class="' + (makseSuundV === 'naabrilt' ? 'sees' : '') + '" onclick="makseSuundVali(\'naabrilt\')">' + esc(s.naabri_nimi) + ' → ' + esc(s.minu_nimi) + '</button>'
    + '<button type="button" class="' + (makseSuundV === 'naabrile' ? 'sees' : '') + '" onclick="makseSuundVali(\'naabrile\')">' + esc(s.minu_nimi) + ' → ' + esc(s.naabri_nimi) + '</button>';
}
function makseSuundVali(v) { makseSuundV = v; makseSuundJoonista(); }
function uusMakse() {
  makseSuundV = 'naabrilt';
  makseSuundJoonista();
  document.getElementById('makseKuupaev').value = tana();
  document.getElementById('makseSumma').value = '';
  document.getElementById('makseKommentaar').value = '';
  teade('makseTeade', '');
  ava('makseModaal');
}
async function salvestaMakse() {
  var nupp = document.getElementById('makseSalvesta');
  nupp.disabled = true;
  var r = await api('/maksed', { method: 'POST', body: JSON.stringify({
    kuupaev: document.getElementById('makseKuupaev').value,
    summa: document.getElementById('makseSumma').value,
    suund: makseSuundV,
    kommentaar: document.getElementById('makseKommentaar').value
  }) });
  nupp.disabled = false;
  if (!r.ok) return teade('makseTeade', r.veateade || 'Salvestamine ebaõnnestus');
  sulge('makseModaal');
  laadi();
}
async function kustutaMakse(id) {
  var m = A.maksed.find(function (x) { return x.id === id; });
  if (!m || !confirm('Kustutan makse ' + raha(m.summa) + ' (' + kp(m.kuupaev) + ')?')) return;
  var r = await api('/maksed/' + id, { method: 'DELETE' });
  if (!r.ok) alert(r.veateade || 'Kustutamine ebaõnnestus');
  laadi();
}

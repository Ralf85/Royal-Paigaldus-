<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Paigaldus — Sisselogimine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d0f13; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .kast { background: #1e293b; border-radius: 16px; padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
    .logo-ring { width: 40px; height: 40px; background: linear-gradient(135deg, #c9a84c, #f0d080); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .logo-tekst { font-size: 14px; font-weight: 700; color: #c9a84c; }
    .logo-sub { font-size: 11px; color: #555; }
    h2 { font-size: 18px; margin-bottom: 4px; }
    .alapealkirjad { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    input { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px 16px; font-size: 20px; color: #f1f5f9; letter-spacing: 6px; text-align: center; outline: none; }
    input:focus { border-color: #c9a84c; }
    .numbriklahvistik { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
    .klahv { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px; font-size: 20px; color: #e2e8f0; cursor: pointer; text-align: center; transition: all 0.15s; user-select: none; }
    .klahv:hover { background: #1e3a5f; border-color: #c9a84c; }
    .klahv:active { transform: scale(0.95); }
    .klahv.kustuta { font-size: 16px; color: #ef4444; }
    .klahv.kinnita { background: #c9a84c; border-color: #c9a84c; color: #0d0f13; font-size: 22px; font-weight: 700; }
    .klahv.kinnita:hover { background: #e0b84e; }
    .veateade { background: #7f1d1d; color: #fca5a5; border-radius: 8px; padding: 12px; font-size: 14px; margin-top: 12px; display: none; }
    .admin-nupp { width: 100%; background: transparent; border: 1px solid #334155; color: #64748b; border-radius: 8px; padding: 11px; font-size: 13px; cursor: pointer; margin-top: 12px; }
    .admin-nupp:hover { border-color: #64748b; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="kast">
    <div class="logo">
      <div class="logo-ring">👑</div>
      <div>
        <div class="logo-tekst">ROYAL PAIGALDUS</div>
        <div class="logo-sub">Tööpäevik</div>
      </div>
    </div>
    <h2>Tere tulemast!</h2>
    <p class="alapealkirjad">Sisesta oma PIN-kood</p>
    <label>PIN-kood</label>
    <input type="password" id="pin" maxlength="6" placeholder="••••" autocomplete="off" readonly>
    <div class="numbriklahvistik">
      <div class="klahv" onclick="lisaNumber('1')">1</div>
      <div class="klahv" onclick="lisaNumber('2')">2</div>
      <div class="klahv" onclick="lisaNumber('3')">3</div>
      <div class="klahv" onclick="lisaNumber('4')">4</div>
      <div class="klahv" onclick="lisaNumber('5')">5</div>
      <div class="klahv" onclick="lisaNumber('6')">6</div>
      <div class="klahv" onclick="lisaNumber('7')">7</div>
      <div class="klahv" onclick="lisaNumber('8')">8</div>
      <div class="klahv" onclick="lisaNumber('9')">9</div>
      <div class="klahv kustuta" onclick="kustutaViimane()">⌫</div>
      <div class="klahv" onclick="lisaNumber('0')">0</div>
      <div class="klahv kinnita" onclick="logi()">✓</div>
    </div>
    <div class="veateade" id="viga"></div>
    <button class="admin-nupp" onclick="window.location='/admin-login'">🔐 Admin sisenemine</button>
  </div>
  <script>
    function lisaNumber(n) {
      const p = document.getElementById('pin');
      if (p.value.length < 6) p.value += n;
    }
    function kustutaViimane() {
      const p = document.getElementById('pin');
      p.value = p.value.slice(0, -1);
    }
    async function logi() {
      const pin = document.getElementById('pin').value;
      if (!pin) return;
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin })
      }).then(r => r.json());
      if (r.ok) {
        localStorage.setItem('workerToken', r.token);
        window.location = '/tootaja';
      } else {
        document.getElementById('viga').style.display = 'block';
        document.getElementById('viga').textContent = r.veateade;
        document.getElementById('pin').value = '';
      }
    }
    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') lisaNumber(e.key);
      if (e.key === 'Backspace') kustutaViimane();
      if (e.key === 'Enter') logi();
    });
  </script>
</body>
</html>

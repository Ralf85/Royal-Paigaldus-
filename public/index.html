<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Paigaldus — Sisselogimine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(ellipse 80% 60% at 50% 38%, #1a1710 0%, #0a0a0c 58%, #060607 100%);
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Taust: hero, keskele suur "elav" 3D logo ─────────────────────── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
    }
    .hero-hoovus {
      position: absolute;
      width: min(70vw, 640px);
      height: min(70vw, 640px);
      background: radial-gradient(circle, rgba(201,168,76,0.16) 0%, rgba(201,168,76,0) 70%);
      pointer-events: none;
      filter: blur(4px);
    }
    .logo-lava { perspective: 950px; position: relative; z-index: 1; }
    .logo-plaat {
      position: relative;
      width: min(72vw, 460px);
      filter:
        drop-shadow(0.6px 0.6px 0 #6b4f1a)
        drop-shadow(1.2px 1.2px 0 #654a19)
        drop-shadow(1.8px 1.8px 0 #5f4518)
        drop-shadow(2.4px 2.4px 0 #594017)
        drop-shadow(3px 3px 0 #533c16)
        drop-shadow(3.6px 3.6px 0 #4d3714)
        drop-shadow(4.2px 4.2px 0 #473313)
        drop-shadow(4.8px 4.8px 0 #412e12)
        drop-shadow(5.4px 5.4px 0 #3b2a11)
        drop-shadow(6px 6px 0 #35260f)
        drop-shadow(0 30px 50px rgba(0,0,0,0.55))
        drop-shadow(0 0 34px rgba(201,168,76,0.18));
      animation: hoju 12s ease-in-out infinite;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .logo-img { width: 100%; height: auto; display: block; }
    .logo-laige {
      position: absolute; inset: 0;
      background: linear-gradient(115deg, transparent 40%, rgba(255,250,230,0.95) 50%, transparent 60%);
      background-size: 300% 300%;
      background-position: -140% -140%;
      -webkit-mask-image: url('/logos/royal-paigaldus-gold.svg');
      -webkit-mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-image: url('/logos/royal-paigaldus-gold.svg');
      mask-size: contain;
      mask-repeat: no-repeat;
      mask-position: center;
      mix-blend-mode: overlay;
      pointer-events: none;
      opacity: 0;
      animation: laigesweep 8s ease-in-out infinite;
    }
    @keyframes laigesweep {
      0%, 42% { background-position: -140% -140%; opacity: 0; }
      50%     { opacity: 1; }
      60%, 100% { background-position: 140% 140%; opacity: 0; }
    }
    @keyframes hoju {
      0%   { transform: rotateX(14deg) rotateY(-20deg) translateY(0px) translateZ(0px); }
      20%  { transform: rotateX(-4deg) rotateY(-6deg) translateY(-18px) translateZ(40px); }
      40%  { transform: rotateX(-16deg) rotateY(14deg) translateY(6px) translateZ(-10px); }
      60%  { transform: rotateX(4deg) rotateY(22deg) translateY(14px) translateZ(30px); }
      80%  { transform: rotateX(10deg) rotateY(-4deg) translateY(-10px) translateZ(-20px); }
      100% { transform: rotateX(14deg) rotateY(-20deg) translateY(0px) translateZ(0px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-plaat { animation: none; transform: rotateX(4deg) rotateY(-6deg); }
      .logo-laige { animation: none; opacity: 0; }
    }
    .hero-alltekst {
      margin-top: 28px;
      color: #6b6f78;
      font-size: 13px;
      letter-spacing: 0.02em;
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .hero-vihje {
      margin-top: 10px;
      color: #4b4f57;
      font-size: 12px;
      position: relative;
      z-index: 1;
      text-align: center;
      line-height: 1.6;
    }
    .hero-vihje a { color: #8a7a4a; text-decoration: none; }
    .hero-vihje a:hover { color: #c9a84c; text-decoration: underline; }

    /* ── Logi sisse nupp, paremal üleval ───────────────────────────────── */
    .signin-nupp {
      position: fixed;
      top: 24px;
      right: 24px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(201,168,76,0.4);
      color: #e8d9ac;
      padding: 12px 26px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: border-color .2s, background .2s, transform .15s;
      z-index: 10;
    }
    .signin-nupp:hover { border-color: #c9a84c; background: rgba(201,168,76,0.1); }
    .signin-nupp:active { transform: scale(0.97); }

    .ylanupud { position: fixed; top: 24px; right: 24px; display: flex; gap: 10px; z-index: 10; }
    .ylanupud .signin-nupp { position: static; }
    .kontakt-nupp {
      background: transparent;
      border: 1px solid rgba(148,163,184,0.3);
      color: #94a3b8;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: border-color .2s, color .2s;
      position: relative;
    }
    .kontakt-nupp:hover { border-color: #c9a84c; color: #e8d9ac; }
    .kontakt-paneel {
      position: absolute; top: calc(100% + 10px); right: 0;
      background: #1e293b;
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 12px;
      padding: 16px 20px;
      min-width: 220px;
      font-size: 13px;
      color: #cbd5e1;
      text-align: left;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      opacity: 0; visibility: hidden; transform: translateY(-6px);
      transition: opacity .18s, transform .18s, visibility .18s;
    }
    .kontakt-nupp.avatud .kontakt-paneel { opacity: 1; visibility: visible; transform: translateY(0); }
    .kontakt-paneel a { display: block; color: #e8d9ac; text-decoration: none; margin-top: 6px; font-weight: 600; }
    .kontakt-paneel a:hover { color: #c9a84c; text-decoration: underline; }
    .kontakt-paneel .silt { color: #64748b; font-size: 11px; margin-top: 12px; }
    .kontakt-paneel .silt:first-child { margin-top: 0; }

    /* ── Modaal, kus on PIN-koodi moodul ───────────────────────────────── */
    .kate {
      position: fixed; inset: 0;
      background: rgba(5,5,7,0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity .22s ease;
      z-index: 50;
    }
    .kate.avatud { opacity: 1; pointer-events: all; }
    .kast {
      background: #1e293b;
      border: 1px solid rgba(201,168,76,0.18);
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      transform: translateY(14px) scale(0.97);
      opacity: 0;
      transition: transform .22s ease, opacity .22s ease;
      position: relative;
    }
    .kate.avatud .kast { transform: translateY(0) scale(1); opacity: 1; }
    .kast-sulge {
      position: absolute; top: 14px; right: 14px;
      background: none; border: none; color: #64748b;
      font-size: 20px; line-height: 1; cursor: pointer; padding: 4px;
    }
    .kast-sulge:hover { color: #94a3b8; }

    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
    .logo img { height: 30px; width: auto; }
    .logo-sub { font-size: 11px; color: #555; }
    h2 { font-size: 18px; margin-bottom: 4px; }
    .alapealkirjad { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    input { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px 16px; font-size: 20px; color: #f1f5f9; letter-spacing: 6px; text-align: center; outline: none; }
    input:focus { border-color: #c9a84c; }
    .numbriklahvistik { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
    .klahv { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px; font-size: 20px; color: #e2e8f0; cursor: pointer; text-align: center; transition: all 0.15s; user-select: none; }
    .klahv:hover { background: #1e3a5f; border-color: #c9a84c; }
    .klahv:active { transform: scale(0.95); }
    .klahv.kustuta { font-size: 16px; color: #ef4444; }
    .klahv.kinnita { background: #c9a84c; border-color: #c9a84c; color: #0d0f13; font-size: 22px; font-weight: 700; }
    .klahv.kinnita:hover { background: #e0b84e; }
    .veateade { background: #7f1d1d; color: #fca5a5; border-radius: 8px; padding: 12px; font-size: 14px; margin-top: 12px; display: none; }
    .admin-nupp { width: 100%; background: transparent; border: 1px solid #334155; color: #64748b; border-radius: 8px; padding: 11px; font-size: 13px; cursor: pointer; margin-top: 12px; }
    .admin-nupp:hover { border-color: #64748b; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="ylanupud">
    <button class="kontakt-nupp" id="kontaktNupp" onclick="event.stopPropagation();lylitaKontakt()">
      Kontakt
      <div class="kontakt-paneel">
        <div class="silt">Telefon</div>
        <a href="tel:+37258586475">+372 5858 6475</a>
        <div class="silt">E-post</div>
        <a href="mailto:ralf.rogov@gmail.com">ralf.rogov@gmail.com</a>
      </div>
    </button>
    <button class="signin-nupp" onclick="avaKast()">Logi sisse</button>
  </div>

  <div class="hero">
    <div class="hero-hoovus"></div>
    <div class="logo-lava">
      <div class="logo-plaat">
        <img class="logo-img" src="/logos/royal-paigaldus-gold.svg" alt="Royal Paigaldus">
        <div class="logo-laige"></div>
      </div>
    </div>
    <div class="hero-alltekst">Tööpäevik</div>
  </div>

  <!-- Väli, mida brauser kasutab Face ID/passkey automaatseks pakkumiseks ("Conditional UI") —
       see peab jääma modaalist SÕLTUMATUKS ja alati DOM-is nähtavaks (mitte display:none sees),
       et fookus juba lehe laadimisel töötaks, enne kui kasutaja "Logi sisse" nupule vajutab. -->
  <input type="text" id="webauthnCondInput" autocomplete="username webauthn" inputmode="none"
    style="position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:0;border:none;padding:0;margin:0;pointer-events:none">

  <div class="kate" id="kate" onclick="if(event.target===this)suletaKast()">
    <div class="kast">
      <button class="kast-sulge" onclick="suletaKast()" aria-label="Sulge">✕</button>
      <div class="logo">
        <img src="/logos/royal-paigaldus-gold.svg" alt="Royal Paigaldus">
        <div class="logo-sub" style="margin-left:2px">Tööpäevik</div>
      </div>
      <h2>Tere tulemast!</h2>
      <p class="alapealkirjad">Sisesta oma PIN-kood</p>
      <p style="color:#4b5568;font-size:11px;margin:-16px 0 20px">Ligipääs ainult Royal Paigalduse töötajatele.</p>
      <label>PIN-kood</label>
      <input type="password" id="pin" maxlength="6" placeholder="••••" autocomplete="off" readonly>
      <div class="numbriklahvistik">
        <div class="klahv" onclick="lisaNumber('1')">1</div>
        <div class="klahv" onclick="lisaNumber('2')">2</div>
        <div class="klahv" onclick="lisaNumber('3')">3</div>
        <div class="klahv" onclick="lisaNumber('4')">4</div>
        <div class="klahv" onclick="lisaNumber('5')">5</div>
        <div class="klahv" onclick="lisaNumber('6')">6</div>
        <div class="klahv" onclick="lisaNumber('7')">7</div>
        <div class="klahv" onclick="lisaNumber('8')">8</div>
        <div class="klahv" onclick="lisaNumber('9')">9</div>
        <div class="klahv kustuta" onclick="kustutaViimane()">⌫</div>
        <div class="klahv" onclick="lisaNumber('0')">0</div>
        <div class="klahv kinnita" onclick="logi()">✓</div>
      </div>
      <div class="veateade" id="viga"></div>
      <button class="admin-nupp" id="faceIdNupp" style="display:none;border-color:#c9a84c;color:#c9a84c;margin-top:8px" onclick="logiFaceId()">🔐 Logi sisse Face ID / sõrmejäljega</button>
      <button class="admin-nupp" onclick="window.location='/admin-login'">🔐 Admin sisenemine</button>
    </div>
  </div>

  <script>
    // Modaali ava/sulge
    function avaKast() {
      document.getElementById('kontaktNupp').classList.remove('avatud');
      document.getElementById('kate').classList.add('avatud');
      setTimeout(() => document.getElementById('pin').focus(), 200);
    }
    function suletaKast() {
      document.getElementById('kate').classList.remove('avatud');
    }
    function lylitaKontakt() {
      document.getElementById('kontaktNupp').classList.toggle('avatud');
    }
    document.addEventListener('click', () => {
      document.getElementById('kontaktNupp').classList.remove('avatud');
    });
    // Kui Face ID automaatne pakkumine käivitub ja õnnestub, tahame modaali ka kohe avada,
    // et kasutaja näeks selgelt, mis toimub (vt saadaFaceIdVastus allpool).

    // Base64url <-> ArrayBuffer teisendused (WebAuthn kasutab base64url kodeeringut)
    function base64urlToBuffer(base64url) {
      const padding = '='.repeat((4 - (base64url.length % 4)) % 4);
      const base64 = (base64url + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(base64);
      const buf = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
      return buf.buffer;
    }
    function bufferToBase64url(buffer) {
      const bytes = new Uint8Array(buffer);
      let str = '';
      for (let i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
      return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    if (window.PublicKeyCredential) {
      document.getElementById('faceIdNupp').style.display = 'block';
    }

    // Ühine osa: WebAuthn vastuse teisendamine ja serverisse saatmine (kasutab nii nupu-
    // vajutus kui ka automaatse pakkumise voog).
    async function saadaFaceIdVastus(valjakutseId, kinnitus) {
      const vigaEl = document.getElementById('viga');
      const vastus = {
        id: kinnitus.id,
        rawId: bufferToBase64url(kinnitus.rawId),
        type: kinnitus.type,
        response: {
          clientDataJSON: bufferToBase64url(kinnitus.response.clientDataJSON),
          authenticatorData: bufferToBase64url(kinnitus.response.authenticatorData),
          signature: bufferToBase64url(kinnitus.response.signature),
          userHandle: kinnitus.response.userHandle ? bufferToBase64url(kinnitus.response.userHandle) : undefined
        },
        clientExtensionResults: kinnitus.getClientExtensionResults()
      };
      const r = await fetch('/api/webauthn/login-verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ valjakutseId, response: vastus })
      }).then(r => r.json());
      if (r.ok) {
        localStorage.setItem('workerToken', r.token);
        window.location = '/tootaja';
      } else {
        avaKast();
        vigaEl.style.display = 'block';
        vigaEl.textContent = r.veateade || 'Face ID sisselogimine ebaõnnestus';
      }
    }

    // Käsitsi nupu-vajutus (varuvariant, kui automaatne pakkumine ei toimi antud seadmel/brauseris).
    var kaimasolevKontroller = null;
    async function logiFaceId() {
      const vigaEl = document.getElementById('viga');
      vigaEl.style.display = 'none';
      if (kaimasolevKontroller) kaimasolevKontroller.abort();
      try {
        const optR = await fetch('/api/webauthn/login-options').then(r => r.json());
        if (!optR.ok) throw new Error(optR.veateade || 'Viga');
        const options = optR.options;
        options.challenge = base64urlToBuffer(options.challenge);
        if (options.allowCredentials) {
          options.allowCredentials = options.allowCredentials.map(c => ({ ...c, id: base64urlToBuffer(c.id) }));
        }
        const kinnitus = await navigator.credentials.get({ publicKey: options });
        await saadaFaceIdVastus(optR.valjakutseId, kinnitus);
      } catch (e) {
        // Kasutaja tühistas (nt vajutas "Cancel") — ei näita seda veana
        if (e.name !== 'NotAllowedError' && e.name !== 'AbortError') {
          vigaEl.style.display = 'block';
          vigaEl.textContent = 'Face ID sisselogimine ebaõnnestus. Kasuta PIN-koodi.';
        }
      }
    }

    // Automaatne pakkumine ("Conditional UI") — käivitub kohe lehe laadimisel, ilma et
    // kasutaja peaks eraldi nuppu vajutama. Telefon näitab Face ID/passkey kiirvalikut
    // ise, tavaliselt klaviatuuri kohal, ja üks puudutus (Face ID) piisab sisselogimiseks.
    async function algataAutomaatnePakkumine() {
      try {
        if (!window.PublicKeyCredential || !PublicKeyCredential.isConditionalMediationAvailable) return;
        const toetatud = await PublicKeyCredential.isConditionalMediationAvailable();
        if (!toetatud) return;
        const sisend = document.getElementById('webauthnCondInput');
        if (sisend) sisend.focus({ preventScroll: true });
        const optR = await fetch('/api/webauthn/login-options').then(r => r.json());
        if (!optR.ok) return;
        const options = optR.options;
        options.challenge = base64urlToBuffer(options.challenge);
        if (options.allowCredentials) {
          options.allowCredentials = options.allowCredentials.map(c => ({ ...c, id: base64urlToBuffer(c.id) }));
        }
        kaimasolevKontroller = new AbortController();
        const kinnitus = await navigator.credentials.get({
          publicKey: options,
          mediation: 'conditional',
          signal: kaimasolevKontroller.signal
        });
        await saadaFaceIdVastus(optR.valjakutseId, kinnitus);
      } catch (e) {
        // Vaikimisi ei tehta midagi — kasutaja saab ikka PIN-koodi või nuppu kasutada.
      }
    }
    algataAutomaatnePakkumine();

    function lisaNumber(n) {
      const p = document.getElementById('pin');
      if (p.value.length < 6) p.value += n;
    }
    function kustutaViimane() {
      const p = document.getElementById('pin');
      p.value = p.value.slice(0, -1);
    }
    async function logi() {
      const pin = document.getElementById('pin').value;
      if (!pin) return;
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin })
      }).then(r => r.json());
      if (r.ok) {
        localStorage.setItem('workerToken', r.token);
        window.location = '/tootaja';
      } else {
        document.getElementById('viga').style.display = 'block';
        document.getElementById('viga').textContent = r.veateade;
        document.getElementById('pin').value = '';
      }
    }
    document.addEventListener('keydown', e => {
      const kateAvatud = document.getElementById('kate').classList.contains('avatud');
      if (e.key === 'Escape' && kateAvatud) { suletaKast(); return; }
      if (!kateAvatud) { if (e.key >= '0' && e.key <= '9') avaKast(); return; }
      if (e.key >= '0' && e.key <= '9') lisaNumber(e.key);
      if (e.key === 'Backspace') kustutaViimane();
      if (e.key === 'Enter') logi();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merekohviku graafik</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; transition: background 0.3s, color 0.3s; }
    body.tume { background: #0d0f13; color: #e2e8f0; }
    body.hele { background: #f4f5f7; color: #1a1a2e; }
    body.roosa { background: #fdf2f8; color: #831843; }
    body.sinine { background: #eff6ff; color: #1e3a8a; }

    .topbar { padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    body.tume .topbar { background: #13161c; border-bottom: 0.5px solid rgba(255,255,255,0.07); }
    body.hele .topbar { background: #ffffff; border-bottom: 0.5px solid rgba(0,0,0,0.08); box-shadow: 0 1px 8px rgba(0,0,0,0.06); }
    body.roosa .topbar { background: #fff0f7; border-bottom: 0.5px solid rgba(236,72,153,0.15); }
    body.sinine .topbar { background: #f0f7ff; border-bottom: 0.5px solid rgba(59,130,246,0.15); }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 32px; height: 32px; background: linear-gradient(135deg, #065f46, #4ade80); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .brand-name { font-size: 13px; font-weight: 700; color: #4ade80; }
    .brand-sub { font-size: 10px; opacity: 0.4; }
    .logout-btn { font-size: 11px; background: none; border-radius: 6px; padding: 5px 10px; cursor: pointer; transition: all 0.15s; }
    body.tume .logout-btn { color: #444; border: 0.5px solid #2a2a2a; }
    body.hele .logout-btn { color: #888; border: 0.5px solid #ddd; }
    body.roosa .logout-btn { color: #f472b6; border: 0.5px solid rgba(244,114,182,0.3); }
    body.sinine .logout-btn { color: #60a5fa; border: 0.5px solid rgba(96,165,250,0.3); }
    .logout-btn:hover { border-color: #ef4444; color: #ef4444; }

    .teema-valik { display: flex; gap: 6px; align-items: center; }
    .teema-nupp { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform 0.15s; }
    .teema-nupp:hover { transform: scale(1.2); }
    .teema-nupp.ak { border-color: #4ade80; transform: scale(1.1); }
    .teema-nupp.t-tume { background: #0d0f13; border-color: #252830; }
    .teema-nupp.t-hele { background: #f4f5f7; border-color: #ddd; }
    .teema-nupp.t-roosa { background: #fce7f3; border-color: #f9a8d4; }
    .teema-nupp.t-sinine { background: #dbeafe; border-color: #93c5fd; }

    /* Layout */
    .leht { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }
    .kuu-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .kuu-nav-nupp { border-radius: 8px; font-size: 18px; cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; border: none; }
    body.tume .kuu-nav-nupp { background: #1e2128; border: 0.5px solid #252830; color: #aaa; }
    body.hele .kuu-nav-nupp { background: #ffffff; border: 0.5px solid #ddd; color: #555; }
    body.roosa .kuu-nav-nupp { background: #fff0f7; border: 0.5px solid rgba(236,72,153,0.2); color: #f472b6; }
    body.sinine .kuu-nav-nupp { background: #f0f7ff; border: 0.5px solid rgba(59,130,246,0.2); color: #60a5fa; }
    .kuu-nav-nupp:hover { border-color: #4ade80 !important; color: #4ade80; }
    .kuu-nimi { font-size: 18px; font-weight: 700; }

    /* Põhipaigutus: vasak + parem */
    .graafik-layout { display: grid; grid-template-columns: 180px 1fr; gap: 16px; align-items: start; }

    /* Vasak: töötajad */
    .tootajad-paneel { border-radius: 12px; overflow: hidden; position: sticky; top: 72px; }
    body.tume .tootajad-paneel { background: #13161c; border: 0.5px solid rgba(255,255,255,0.06); }
    body.hele .tootajad-paneel { background: #fff; border: 0.5px solid rgba(0,0,0,0.08); box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
    body.roosa .tootajad-paneel { background: #fff0f7; border: 0.5px solid rgba(236,72,153,0.12); }
    body.sinine .tootajad-paneel { background: #f0f7ff; border: 0.5px solid rgba(59,130,246,0.12); }
    .tootajad-hdr { padding: 10px 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.4; border-bottom: 0.5px solid rgba(128,128,128,0.15); }
    .tootaja-kaart { padding: 10px 12px; border-bottom: 0.5px solid rgba(128,128,128,0.08); cursor: grab; user-select: none; display: flex; align-items: center; gap: 8px; transition: background 0.15s; }
    .tootaja-kaart:last-child { border-bottom: none; }
    .tootaja-kaart:hover { background: rgba(74,222,128,0.08); }
    .tootaja-kaart:active { cursor: grabbing; }
    .tootaja-kaart.lohistatakse { opacity: 0.4; }
    .tootaja-avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #0d0f13; flex-shrink: 0; }
    .tootaja-info { min-width: 0; }
    .tootaja-nimi { font-size: 12px; font-weight: 600; }
    .tootaja-tunnid { font-size: 10px; opacity: 0.4; margin-top: 1px; }

    /* Default kellaaeg */
    .default-paneel { border-radius: 12px; overflow: hidden; margin-top: 10px; }
    body.tume .default-paneel { background: #13161c; border: 0.5px solid rgba(255,255,255,0.06); }
    body.hele .default-paneel { background: #fff; border: 0.5px solid rgba(0,0,0,0.08); }
    body.roosa .default-paneel { background: #fff0f7; border: 0.5px solid rgba(236,72,153,0.12); }
    body.sinine .default-paneel { background: #f0f7ff; border: 0.5px solid rgba(59,130,246,0.12); }
    .default-hdr { padding: 8px 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.4; border-bottom: 0.5px solid rgba(128,128,128,0.15); display: flex; justify-content: space-between; align-items: center; }
    .default-muuda-nupp { font-size: 10px; color: #4ade80; background: none; border: none; cursor: pointer; opacity: 1; }
    .default-rida { padding: 6px 12px; font-size: 11px; display: flex; justify-content: space-between; border-bottom: 0.5px solid rgba(128,128,128,0.06); }
    .default-rida:last-child { border-bottom: none; }
    .default-label { opacity: 0.5; }
    .default-aeg { color: #4ade80; font-weight: 600; font-family: monospace; }
    .default-muutmine { padding: 10px 12px; display: none; }
    .default-muutmine input[type="time"] { width: 100%; border-radius: 6px; padding: 5px 8px; font-size: 11px; margin-bottom: 4px; border: 0.5px solid rgba(128,128,128,0.3); }
    body.tume .default-muutmine input { background: #0d0f13; color: #e2e8f0; }
    body.hele .default-muutmine input { background: #f4f5f7; color: #1a1a2e; }
    body.roosa .default-muutmine input { background: #fce7f3; color: #831843; }
    body.sinine .default-muutmine input { background: #dbeafe; color: #1e3a8a; }
    .default-salvesta-nupp { width: 100%; background: #4ade80; color: #0d0f13; border: none; border-radius: 6px; padding: 6px; font-size: 11px; font-weight: 700; cursor: pointer; margin-top: 4px; }

    /* Kalender */
    .kalender-paneel { border-radius: 12px; overflow: hidden; }
    body.tume .kalender-paneel { background: #13161c; border: 0.5px solid rgba(255,255,255,0.06); }
    body.hele .kalender-paneel { background: #fff; border: 0.5px solid rgba(0,0,0,0.08); box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
    body.roosa .kalender-paneel { background: #fff0f7; border: 0.5px solid rgba(236,72,153,0.12); }
    body.sinine .kalender-paneel { background: #f0f7ff; border: 0.5px solid rgba(59,130,246,0.12); }
    .kal-info { padding: 10px 14px; font-size: 11px; opacity: 0.4; border-bottom: 0.5px solid rgba(128,128,128,0.1); display: flex; justify-content: space-between; align-items: center; }
    .lisa-nupp { background: #065f46; border: none; border-radius: 6px; padding: 5px 12px; color: #4ade80; font-size: 11px; font-weight: 600; cursor: pointer; }
    .lisa-nupp:hover { background: #047857; }

    .kal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 8px; }
    .kal-paev-hdr { text-align: center; font-size: 10px; padding: 4px 0; font-weight: 600; opacity: 0.35; }
    .kal-paev { min-height: 80px; border-radius: 6px; padding: 5px; transition: all 0.15s; position: relative; }
    body.tume .kal-paev { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); }
    body.hele .kal-paev { background: #f8f9fa; border: 1px solid rgba(0,0,0,0.05); }
    body.roosa .kal-paev { background: rgba(253,242,248,0.6); border: 1px solid rgba(236,72,153,0.08); }
    body.sinine .kal-paev { background: rgba(239,246,255,0.6); border: 1px solid rgba(59,130,246,0.08); }
    .kal-paev.taana { border-color: #c9a84c !important; border-width: 1.5px; }
    .kal-paev.tyyhi { opacity: 0.3; pointer-events: none; }
    .kal-paev.lohistatakse-ule { background: rgba(74,222,128,0.12) !important; border-color: #4ade80 !important; border-style: dashed !important; }
    .kal-paev.lukus { opacity: 0.45; }
    .kal-paev-nr { font-size: 11px; font-weight: 700; opacity: 0.5; margin-bottom: 3px; }
    .kal-paev-nr.taana { color: #c9a84c; opacity: 1; }
    .kal-vahetus { font-size: 9px; border-radius: 3px; padding: 2px 4px; margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center; gap: 2px; cursor: pointer; }
    .kal-vahetus-nimi { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; font-weight: 600; }
    .kal-vahetus-aeg { font-size: 8px; opacity: 0.6; white-space: nowrap; }
    .kal-vahetus-x { opacity: 0.4; flex-shrink: 0; font-size: 9px; }
    .kal-vahetus-x:hover { opacity: 1; color: #ef4444; }
    .worker-varv-0 { background: rgba(74,222,128,0.2); color: #4ade80; }
    .worker-varv-1 { background: rgba(96,165,250,0.2); color: #60a5fa; }
    .worker-varv-2 { background: rgba(251,191,36,0.2); color: #d97706; }
    .worker-varv-3 { background: rgba(248,113,113,0.2); color: #ef4444; }
    .worker-varv-4 { background: rgba(196,181,253,0.2); color: #8b5cf6; }
    .worker-varv-5 { background: rgba(251,146,60,0.2); color: #f97316; }

    /* Legendi */
    .legend { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 8px 8px; }
    .legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; opacity: 0.6; }
    .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

    /* Kokkuvõte */
    .kokkuvote-paneel { border-radius: 12px; overflow: hidden; margin-top: 12px; }
    body.tume .kokkuvote-paneel { background: #13161c; border: 0.5px solid rgba(255,255,255,0.06); }
    body.hele .kokkuvote-paneel { background: #fff; border: 0.5px solid rgba(0,0,0,0.08); }
    body.roosa .kokkuvote-paneel { background: #fff0f7; border: 0.5px solid rgba(236,72,153,0.12); }
    body.sinine .kokkuvote-paneel { background: #f0f7ff; border: 0.5px solid rgba(59,130,246,0.12); }
    .kokkuvote-hdr { padding: 10px 14px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.4; border-bottom: 0.5px solid rgba(128,128,128,0.1); }
    .kokkuvote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 1px; background: rgba(128,128,128,0.1); }
    .kokkuvote-kaart { padding: 10px 14px; }
    body.tume .kokkuvote-kaart { background: #13161c; }
    body.hele .kokkuvote-kaart { background: #fff; }
    body.roosa .kokkuvote-kaart { background: #fff0f7; }
    body.sinine .kokkuvote-kaart { background: #f0f7ff; }
    .kokkuvote-nimi { font-size: 11px; opacity: 0.6; margin-bottom: 3px; }
    .kokkuvote-tunnid { font-size: 20px; font-weight: 700; color: #4ade80; }
    .kokkuvote-info { font-size: 10px; opacity: 0.3; margin-top: 1px; }

    /* Nimekiri */
    .nimekiri-paneel { border-radius: 12px; overflow: hidden; margin-top: 12px; }
    body.tume .nimekiri-paneel { background: #13161c; border: 0.5px solid rgba(255,255,255,0.06); }
    body.hele .nimekiri-paneel { background: #fff; border: 0.5px solid rgba(0,0,0,0.08); }
    body.roosa .nimekiri-paneel { background: #fff0f7; border: 0.5px solid rgba(236,72,153,0.12); }
    body.sinine .nimekiri-paneel { background: #f0f7ff; border: 0.5px solid rgba(59,130,246,0.12); }
    .nimekiri-hdr { padding: 10px 14px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.4; border-bottom: 0.5px solid rgba(128,128,128,0.1); }
    .vahetus-rida { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 0.5px solid rgba(128,128,128,0.07); font-size: 12px; }
    .vahetus-rida:last-child { border-bottom: none; }
    .vahetus-kuupaev { font-weight: 600; min-width: 65px; opacity: 0.7; }
    .vahetus-nimi { flex: 1; }
    .vahetus-aeg { opacity: 0.4; }
    .vahetus-kustuta { background: none; border: none; cursor: pointer; font-size: 13px; padding: 2px 5px; border-radius: 4px; opacity: 0.25; }
    .vahetus-kustuta:hover { color: #ef4444; opacity: 1; background: rgba(239,68,68,0.1); }

    /* Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.avatud { display: flex; }
    .modal-sisu { border-radius: 16px; width: 100%; max-width: 400px; padding: 22px; }
    body.tume .modal-sisu { background: #13161c; }
    body.hele .modal-sisu { background: #ffffff; box-shadow: 0 8px 40px rgba(0,0,0,0.15); }
    body.roosa .modal-sisu { background: #fff0f7; }
    body.sinine .modal-sisu { background: #f0f7ff; }
    .modal-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .modal-pealkiri { font-size: 15px; font-weight: 700; }
    .modal-sulge { background: none; border: none; font-size: 20px; cursor: pointer; opacity: 0.4; }
    .modal-sulge:hover { opacity: 1; }
    .vorm-rida { margin-bottom: 12px; }
    .vorm-silt { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; opacity: 0.45; }
    .vorm-sisend { width: 100%; border-radius: 8px; padding: 8px 11px; font-size: 13px; border: 0.5px solid rgba(128,128,128,0.3); }
    body.tume .vorm-sisend { background: #0d0f13; color: #e2e8f0; }
    body.hele .vorm-sisend { background: #f4f5f7; color: #1a1a2e; }
    body.roosa .vorm-sisend { background: #fce7f3; color: #831843; }
    body.sinine .vorm-sisend { background: #dbeafe; color: #1e3a8a; }
    .vorm-sisend:focus { outline: none; border-color: #4ade80; }
    .vorm-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .salvesta-nupp { width: 100%; background: #4ade80; color: #0d0f13; border: none; border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 4px; }
    .salvesta-nupp:hover { background: #22c55e; }
    .teade { font-size: 12px; margin-top: 8px; display: none; }

    @media (max-width: 640px) {
      .graafik-layout { grid-template-columns: 1fr; }
      .tootajad-paneel { position: static; display: flex; flex-wrap: wrap; }
      .tootaja-kaart { flex: 1; min-width: 100px; }
    }
  </style>
</head>
<body class="tume">
  <div class="topbar">
    <div class="brand">
      <div class="brand-logo">☕</div>
      <div><div class="brand-name">MEREKOHVIK</div><div class="brand-sub">Graafiku haldus</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="teema-valik">
        <button class="teema-nupp t-tume ak" onclick="vahetaTeema('tume')" title="Tume"></button>
        <button class="teema-nupp t-hele" onclick="vahetaTeema('hele')" title="Hele"></button>
        <button class="teema-nupp t-roosa" onclick="vahetaTeema('roosa')" title="Roosa"></button>
        <button class="teema-nupp t-sinine" onclick="vahetaTeema('sinine')" title="Sinine"></button>
      </div>
      <span style="font-size:13px;opacity:0.4" id="adminNimi"></span>
      <button class="logout-btn" onclick="välju()">Välja</button>
    </div>
  </div>

  <!-- Lisa vahetus modal -->
  <div class="modal-overlay" id="lisaModal">
    <div class="modal-sisu">
      <div class="modal-hdr">
        <span class="modal-pealkiri">✏️ Muuda vahetust</span>
        <button class="modal-sulge" onclick="sulgeModal()">✕</button>
      </div>
      <div class="vorm-rida">
        <div class="vorm-silt">Töötaja</div>
        <select id="m-worker" class="vorm-sisend"></select>
      </div>
      <div class="vorm-rida">
        <div class="vorm-silt">Kuupäev</div>
        <input type="date" id="m-kuupaev" class="vorm-sisend">
      </div>
      <div class="vorm-grid2">
        <div class="vorm-rida">
          <div class="vorm-silt">Algus</div>
          <input type="time" id="m-algus" value="11:00" class="vorm-sisend">
        </div>
        <div class="vorm-rida">
          <div class="vorm-silt">Lõpp</div>
          <input type="time" id="m-lopp" value="21:00" class="vorm-sisend">
        </div>
      </div>
      <div class="vorm-rida">
        <div class="vorm-silt">Märkus (vabatahtlik)</div>
        <input type="text" id="m-markus" class="vorm-sisend" placeholder="vabatahtlik">
      </div>
      <button class="salvesta-nupp" onclick="salvestaVahetus()">Salvesta</button>
      <div class="teade" id="m-teade"></div>
    </div>
  </div>

  <div class="leht">
    <!-- Kuu navigatsioon -->
    <div class="kuu-nav">
      <button class="kuu-nav-nupp" onclick="kuuNavig(-1)">‹</button>
      <span class="kuu-nimi" id="kuuNimi"></span>
      <button class="kuu-nav-nupp" onclick="kuuNavig(1)">›</button>
    </div>

    <div class="graafik-layout">
      <!-- Vasak: töötajad + default kellaaeg -->
      <div>
        <div class="tootajad-paneel">
          <div class="tootajad-hdr">👷 Töötajad</div>
          <div id="tootajadNimekiri">
            <div style="padding:12px;font-size:12px;opacity:0.4">Laadimine...</div>
          </div>
        </div>

        <div class="default-paneel">
          <div class="default-hdr">
            <span>⏰ Default aeg</span>
            <button class="default-muuda-nupp" onclick="toggleDefaultMuutmine()">✏️</button>
          </div>
          <div id="default-kuvamine">
            <div class="default-rida"><span class="default-label">E–R</span><span class="default-aeg" id="def-er-tekst">11:00–21:00</span></div>
            <div class="default-rida"><span class="default-label">L</span><span class="default-aeg" id="def-l-tekst">10:00–21:00</span></div>
            <div class="default-rida"><span class="default-label">P</span><span class="default-aeg" id="def-p-tekst">10:00–20:00</span></div>
          </div>
          <div class="default-muutmine" id="default-muutmine">
            <div style="font-size:10px;opacity:0.5;margin-bottom:4px">E–R</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px">
              <input type="time" id="def-er-algus" value="11:00">
              <input type="time" id="def-er-lopp" value="21:00">
            </div>
            <div style="font-size:10px;opacity:0.5;margin-bottom:4px">Laupäev</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px">
              <input type="time" id="def-l-algus" value="10:00">
              <input type="time" id="def-l-lopp" value="21:00">
            </div>
            <div style="font-size:10px;opacity:0.5;margin-bottom:4px">Pühapäev</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px">
              <input type="time" id="def-p-algus" value="10:00">
              <input type="time" id="def-p-lopp" value="20:00">
            </div>
            <button class="default-salvesta-nupp" onclick="salvestaDefault()">Salvesta</button>
          </div>
        </div>
      </div>

      <!-- Parem: kalender -->
      <div>
        <div class="kalender-paneel">
          <div class="kal-info">
            <span>Lohista nimi päeva peale</span>
            <button class="lisa-nupp" onclick="avaModalTyhi()">+ Lisa käsitsi</button>
          </div>
          <div class="legend" id="legend"></div>
          <div class="kal-grid" id="kalGrid">
            <div style="grid-column:1/-1;padding:30px;text-align:center;opacity:0.3;font-size:13px">Laadimine...</div>
          </div>
        </div>

        <!-- Kuu kokkuvõte -->
        <div class="kokkuvote-paneel" id="kokkuvotePaneel" style="display:none">
          <div class="kokkuvote-hdr">📊 Kuu tunnid</div>
          <div class="kokkuvote-grid" id="kokkuvoteGrid"></div>
        </div>

        <!-- Vahetuste nimekiri -->
        <div class="nimekiri-paneel">
          <div class="nimekiri-hdr">Kõik vahetused selles kuus</div>
          <div id="vahetusteNimekiri">
            <div style="padding:16px;text-align:center;opacity:0.3;font-size:13px">Laadimine...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var KUUD = ['Jaanuar','Veebruar','Märts','Aprill','Mai','Juuni','Juuli','August','September','Oktoober','November','Detsember'];
    var KUUD_L = ['jaan','veeb','märts','apr','mai','juu','juul','aug','sept','okt','nov','dets'];
    var TOKEN = localStorage.getItem('graafikAdminToken') || '';
    var aktiivsKuu = new Date();
    var workerid = [];
    var workerVarv = {};
    var lohistatavId = null;
    var lohistatavNimi = null;
    var muudaVahetusId = null;

    // Teema
    var salvestatud = localStorage.getItem('graafikTeema') || 'tume';
    vahetaTeema(salvestatud);

    function vahetaTeema(teema) {
      document.body.className = teema;
      localStorage.setItem('graafikTeema', teema);
      document.querySelectorAll('.teema-nupp').forEach(function(b) { b.classList.remove('ak'); });
      var nupp = document.querySelector('.t-' + teema);
      if (nupp) nupp.classList.add('ak');
    }

    function api(url, opts) {
      opts = opts || {};
      opts.headers = opts.headers || {};
      opts.headers['x-session-token'] = TOKEN;
      opts.headers['Content-Type'] = 'application/json';
      return fetch(url, opts).then(function(r) { return r.json(); });
    }

    // ── DEFAULT KELLAAEG ─────────────────────────────────────────
    function laadiDefault() {
      var d = JSON.parse(localStorage.getItem('graafikDefault') || 'null') || {
        er: { algus: '11:00', lopp: '21:00' },
        l:  { algus: '10:00', lopp: '21:00' },
        p:  { algus: '10:00', lopp: '20:00' }
      };
      document.getElementById('def-er-tekst').textContent = d.er.algus + '–' + d.er.lopp;
      document.getElementById('def-l-tekst').textContent = d.l.algus + '–' + d.l.lopp;
      document.getElementById('def-p-tekst').textContent = d.p.algus + '–' + d.p.lopp;
      document.getElementById('def-er-algus').value = d.er.algus;
      document.getElementById('def-er-lopp').value = d.er.lopp;
      document.getElementById('def-l-algus').value = d.l.algus;
      document.getElementById('def-l-lopp').value = d.l.lopp;
      document.getElementById('def-p-algus').value = d.p.algus;
      document.getElementById('def-p-lopp').value = d.p.lopp;
      return d;
    }

    function toggleDefaultMuutmine() {
      var el = document.getElementById('default-muutmine');
      var kuv = document.getElementById('default-kuvamine');
      var avatud = el.style.display !== 'none';
      el.style.display = avatud ? 'none' : 'block';
      kuv.style.display = avatud ? 'block' : 'none';
    }

    function salvestaDefault() {
      var d = {
        er: { algus: document.getElementById('def-er-algus').value, lopp: document.getElementById('def-er-lopp').value },
        l:  { algus: document.getElementById('def-l-algus').value, lopp: document.getElementById('def-l-lopp').value },
        p:  { algus: document.getElementById('def-p-algus').value, lopp: document.getElementById('def-p-lopp').value }
      };
      localStorage.setItem('graafikDefault', JSON.stringify(d));
      laadiDefault();
      toggleDefaultMuutmine();
    }

    function getDefaultAeg(iso) {
      var d = JSON.parse(localStorage.getItem('graafikDefault') || 'null') || {
        er: { algus: '11:00', lopp: '21:00' },
        l:  { algus: '10:00', lopp: '21:00' },
        p:  { algus: '10:00', lopp: '20:00' }
      };
      var paev = new Date(iso + 'T12:00:00').getDay(); // 0=P, 6=L
      if (paev === 0) return d.p;
      if (paev === 6) return d.l;
      return d.er;
    }

    // ── TÖÖTAJATE NIMEKIRI ────────────────────────────────────────
    function kuvaToötajad(kuuAndmed) {
      var div = document.getElementById('tootajadNimekiri');
      if (!workerid.length) { div.innerHTML = '<div style="padding:12px;font-size:12px;opacity:0.4">Töötajaid pole</div>'; return; }

      var tunniMap = {};
      if (kuuAndmed && kuuAndmed.vahetused) {
        kuuAndmed.vahetused.forEach(function(v) {
          if (!tunniMap[v.worker_id]) tunniMap[v.worker_id] = { tunnid: 0, vahetused: 0 };
          tunniMap[v.worker_id].tunnid += arvutaTunnid(v.algus, v.lopp);
          tunniMap[v.worker_id].vahetused++;
        });
      }

      div.innerHTML = workerid.map(function(w) {
        var info = tunniMap[w.id] || { tunnid: 0, vahetused: 0 };
        var varv = workerVarv[w.id] !== undefined ? workerVarv[w.id] : 0;
        var avatarVarv = ['#4ade80','#60a5fa','#fbbf24','#ef4444','#a78bfa','#f97316'][varv];
        return '<div class="tootaja-kaart" draggable="true"'
          + ' ondragstart="algaLohistamine(event,' + w.id + ',\'' + w.nimi.replace(/'/g,"\\'") + '\')">'
          + '<div class="tootaja-avatar" style="background:' + avatarVarv + '">' + w.nimi[0] + '</div>'
          + '<div class="tootaja-info">'
          + '<div class="tootaja-nimi">' + w.nimi.split(' ')[0] + '</div>'
          + '<div class="tootaja-tunnid">' + (info.tunnid > 0 ? info.tunnid.toFixed(1) + 'h' : 'pole') + '</div>'
          + '</div></div>';
      }).join('');
    }

    function arvutaTunnid(algus, lopp) {
      if (!algus || !lopp) return 0;
      var a = algus.slice(0,5).split(':').map(Number);
      var l = lopp.slice(0,5).split(':').map(Number);
      var min = (l[0]*60+l[1]) - (a[0]*60+a[1]);
      if (min < 0) min += 1440;
      return min / 60;
    }

    // ── LOHISTAMINE ───────────────────────────────────────────────
    function algaLohistamine(event, id, nimi) {
      lohistatavId = id;
      lohistatavNimi = nimi;
      event.dataTransfer.effectAllowed = 'copy';
      event.currentTarget.classList.add('lohistatakse');
      setTimeout(function() { event.currentTarget.classList.remove('lohistatakse'); }, 100);
    }

    function lohitatakseUle(event, iso) {
      event.preventDefault();
      document.querySelectorAll('.kal-paev').forEach(function(r) { r.classList.remove('lohistatakse-ule'); });
      var el = document.getElementById('rakk-' + iso);
      if (el) el.classList.add('lohistatakse-ule');
    }

    function lohitatakseAra(iso) {
      var el = document.getElementById('rakk-' + iso);
      if (el) el.classList.remove('lohistatakse-ule');
    }

    async function kukutatudPaevale(event, iso) {
      event.preventDefault();
      document.querySelectorAll('.kal-paev').forEach(function(r) { r.classList.remove('lohistatakse-ule'); });
      if (!lohistatavId) return;

      var aeg = getDefaultAeg(iso);
      var r = await api('/api/graafik/admin/lisa', {
        method: 'POST',
        body: JSON.stringify({ worker_id: lohistatavId, kuupaev: iso, algus: aeg.algus, lopp: aeg.lopp })
      });
      if (r.ok) {
        laadiKuu();
      } else {
        alert(r.veateade || 'Viga lisamisel');
      }
      lohistatavId = null;
      lohistatavNimi = null;
    }

    // ── KALENDER ─────────────────────────────────────────────────
    async function laadiKuu() {
      var aasta = aktiivsKuu.getFullYear();
      var kuu = aktiivsKuu.getMonth() + 1;
      document.getElementById('kuuNimi').textContent = KUUD[kuu-1] + ' ' + aasta;

      var vastus = await api('/api/graafik/admin/kuu?aasta=' + aasta + '&kuu=' + kuu);
      var vahetused = (vastus && vastus.vahetused) ? vastus.vahetused : [];
      var paevadInfo = (vastus && vastus.paevad) ? vastus.paevad : [];

      var paevadMap = {};
      paevadInfo.forEach(function(p) { paevadMap[p.kuupaev.substring(0,10)] = p; });
      var vahetusedMap = {};
      vahetused.forEach(function(v) {
        var kp = v.kuupaev.substring(0,10);
        if (!vahetusedMap[kp]) vahetusedMap[kp] = [];
        vahetusedMap[kp].push(v);
      });

      var esimene = new Date(aasta, kuu-1, 1);
      var viimane = new Date(aasta, kuu, 0).getDate();
      var algus = esimene.getDay();
      algus = algus === 0 ? 6 : algus - 1;
      var taanaIso = new Date().toISOString().substring(0,10);

      var html = ['E','T','K','N','R','L','P'].map(function(p) {
        return '<div class="kal-paev-hdr">' + p + '</div>';
      }).join('');

      for (var i = 0; i < algus; i++) {
        html += '<div class="kal-paev tyyhi"></div>';
      }

      for (var p = 1; p <= viimane; p++) {
        var iso = aasta + '-' + String(kuu).padStart(2,'0') + '-' + String(p).padStart(2,'0');
        var info = paevadMap[iso];
        var lukus = info && info.lukustatud;
        var onTaana = iso === taanaIso;
        var paevV = vahetusedMap[iso] || [];
        var klassid = 'kal-paev' + (onTaana ? ' taana' : '') + (lukus ? ' lukus' : '');

        html += '<div class="' + klassid + '" id="rakk-' + iso + '"'
          + ' ondragover="lohitatakseUle(event,\'' + iso + '\')"'
          + ' ondragleave="lohitatakseAra(\'' + iso + '\')"'
          + ' ondrop="kukutatudPaevale(event,\'' + iso + '\')"'
          + ' onclick="paevKlick(\'' + iso + '\')">'
          + '<div class="kal-paev-nr' + (onTaana ? ' taana' : '') + '">' + p + (lukus ? ' 🔒' : '') + '</div>'
          + paevV.map(function(v) {
              var varv = workerVarv[v.worker_id] !== undefined ? workerVarv[v.worker_id] : 0;
              var nimi = v.worker_nimi ? v.worker_nimi.split(' ')[0] : '';
              var aeg = v.algus.slice(0,5) + '–' + v.lopp.slice(0,5);
              return '<div class="kal-vahetus worker-varv-' + varv + '" onclick="event.stopPropagation();avaModal(' + v.id + ',' + v.worker_id + ',\'' + v.algus.slice(0,5) + '\',\'' + v.lopp.slice(0,5) + '\',\'' + iso + '\')">'
                + '<span class="kal-vahetus-nimi">' + nimi + '</span>'
                + '<span class="kal-vahetus-aeg">' + aeg + '</span>'
                + '<span class="kal-vahetus-x" onclick="event.stopPropagation();kustutaVahetus(' + v.id + ',\'' + nimi + '\')">✕</span>'
                + '</div>';
            }).join('')
          + '</div>';
      }
      document.getElementById('kalGrid').innerHTML = html;

      // Nimekiri
      if (!vahetused.length) {
        document.getElementById('vahetusteNimekiri').innerHTML = '<div style="padding:16px;text-align:center;opacity:0.3;font-size:13px">Selle kuu vahetusi pole</div>';
      } else {
        var sorted = vahetused.slice().sort(function(a,b) { return a.kuupaev.localeCompare(b.kuupaev); });
        document.getElementById('vahetusteNimekiri').innerHTML = sorted.map(function(v) {
          var d = new Date(v.kuupaev.substring(0,10) + 'T12:00:00');
          var varv = workerVarv[v.worker_id] !== undefined ? workerVarv[v.worker_id] : 0;
          return '<div class="vahetus-rida">'
            + '<div class="vahetus-kuupaev">' + d.getDate() + '. ' + KUUD_L[d.getMonth()] + '</div>'
            + '<div class="legend-dot worker-varv-' + varv + '" style="width:8px;height:8px;border-radius:2px;flex-shrink:0"></div>'
            + '<div class="vahetus-nimi">' + v.worker_nimi + '</div>'
            + '<div class="vahetus-aeg">' + v.algus.slice(0,5) + ' – ' + v.lopp.slice(0,5) + '</div>'
            + '<button class="vahetus-kustuta" onclick="kustutaVahetus(' + v.id + ',\'' + v.worker_nimi.split(' ')[0] + '\')">✕</button>'
            + '</div>';
        }).join('');
      }

      // Kokkuvõte
      var tunniMap = {};
      vahetused.forEach(function(v) {
        if (!tunniMap[v.worker_id]) tunniMap[v.worker_id] = { nimi: v.worker_nimi, tunnid: 0, vahetused: 0 };
        tunniMap[v.worker_id].tunnid += arvutaTunnid(v.algus, v.lopp);
        tunniMap[v.worker_id].vahetused++;
      });
      var kokk = Object.values(tunniMap).sort(function(a,b) { return b.tunnid - a.tunnid; });
      if (kokk.length) {
        document.getElementById('kokkuvoteGrid').innerHTML = kokk.map(function(w) {
          return '<div class="kokkuvote-kaart">'
            + '<div class="kokkuvote-nimi">' + w.nimi.split(' ')[0] + '</div>'
            + '<div class="kokkuvote-tunnid">' + w.tunnid.toFixed(1) + 'h</div>'
            + '<div class="kokkuvote-info">' + w.vahetused + ' vahetust</div>'
            + '</div>';
        }).join('');
        document.getElementById('kokkuvotePaneel').style.display = 'block';
      } else {
        document.getElementById('kokkuvotePaneel').style.display = 'none';
      }

      kuvaToötajad(vastus);
    }

    function kuuNavig(suund) {
      aktiivsKuu = new Date(aktiivsKuu.getFullYear(), aktiivsKuu.getMonth() + suund, 1);
      laadiKuu();
    }

    // ── MODAL ─────────────────────────────────────────────────────
    function avaModalTyhi() {
      muudaVahetusId = null;
      document.getElementById('modal-pealkiri-tekst') && (document.getElementById('modal-pealkiri-tekst').textContent = '+ Lisa vahetus');
      document.getElementById('m-kuupaev').value = new Date().toISOString().split('T')[0];
      var aeg = getDefaultAeg(new Date().toISOString().split('T')[0]);
      document.getElementById('m-algus').value = aeg.algus;
      document.getElementById('m-lopp').value = aeg.lopp;
      document.getElementById('m-markus').value = '';
      document.getElementById('m-teade').style.display = 'none';
      document.getElementById('lisaModal').classList.add('avatud');
    }

    function paevKlick(iso) {
      muudaVahetusId = null;
      document.getElementById('m-kuupaev').value = iso;
      var aeg = getDefaultAeg(iso);
      document.getElementById('m-algus').value = aeg.algus;
      document.getElementById('m-lopp').value = aeg.lopp;
      document.getElementById('m-markus').value = '';
      document.getElementById('m-teade').style.display = 'none';
      document.getElementById('lisaModal').classList.add('avatud');
    }

    function avaModal(id, workerId, algus, lopp, iso) {
      muudaVahetusId = id;
      document.getElementById('m-kuupaev').value = iso;
      document.getElementById('m-algus').value = algus;
      document.getElementById('m-lopp').value = lopp;
      document.getElementById('m-markus').value = '';
      // Vali töötaja
      var sel = document.getElementById('m-worker');
      Array.from(sel.options).forEach(function(o) { o.selected = parseInt(o.value) === workerId; });
      document.getElementById('m-teade').style.display = 'none';
      document.getElementById('lisaModal').classList.add('avatud');
    }

    function sulgeModal() {
      document.getElementById('lisaModal').classList.remove('avatud');
      muudaVahetusId = null;
    }

    async function salvestaVahetus() {
      var worker_id = document.getElementById('m-worker').value;
      var kuupaev = document.getElementById('m-kuupaev').value;
      var algus = document.getElementById('m-algus').value;
      var lopp = document.getElementById('m-lopp').value;
      var markus = document.getElementById('m-markus').value;
      var teade = document.getElementById('m-teade');

      if (!worker_id || !kuupaev || !algus || !lopp) {
        teade.style.display = 'block'; teade.style.color = '#ef4444';
        teade.textContent = 'Täida kõik väljad'; return;
      }

      var keha = { worker_id: worker_id, kuupaev: kuupaev, algus: algus, lopp: lopp };
      if (markus) keha['märkus'] = markus;

      var r;
      if (muudaVahetusId) {
        r = await api('/api/graafik/admin/' + muudaVahetusId, { method: 'PUT', body: JSON.stringify(keha) });
      } else {
        r = await api('/api/graafik/admin/lisa', { method: 'POST', body: JSON.stringify(keha) });
      }

      if (r.ok) {
        sulgeModal();
        laadiKuu();
      } else {
        teade.style.display = 'block'; teade.style.color = '#ef4444';
        teade.textContent = r.veateade || 'Viga salvestamisel';
      }
    }

    async function kustutaVahetus(id, nimi) {
      if (!confirm(nimi + ' vahetuse kustutad?')) return;
      var r = await api('/api/graafik/admin/' + id, { method: 'DELETE' });
      if (r.ok) laadiKuu();
    }

    document.getElementById('lisaModal').addEventListener('click', function(e) {
      if (e.target === this) sulgeModal();
    });

    // ── INIT ──────────────────────────────────────────────────────
    async function init() {
      if (!TOKEN) { window.location = '/graafik-admin-login'; return; }
      var s = await api('/api/auth/sessioon');
      if (!s.sisselogitud || !s.isGraafikAdmin) { window.location = '/graafik-admin-login'; return; }
      document.getElementById('adminNimi').textContent = s.nimi;

      var r = await api('/api/graafik/merekohvik-tootajad');
      if (r && r.tootajad) {
        workerid = r.tootajad;
        var sel = document.getElementById('m-worker');
        var leg = document.getElementById('legend');
        workerid.forEach(function(w, i) {
          workerVarv[w.id] = i % 6;
          var opt = document.createElement('option');
          opt.value = w.id; opt.textContent = w.nimi;
          sel.appendChild(opt);
          leg.innerHTML += '<div class="legend-item"><div class="legend-dot worker-varv-' + (i%6) + '"></div>' + w.nimi.split(' ')[0] + '</div>';
        });
      }

      laadiDefault();
      laadiKuu();
    }

    function välju() {
      localStorage.removeItem('graafikAdminToken');
      window.location = '/graafik-admin-login';
    }

    init();
  </script>
</body>
</html>

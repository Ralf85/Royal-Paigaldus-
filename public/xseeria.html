<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>X-seeria — Tiim</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #0d0f13; color: #e2e8f0; }
  header { background: #13161c; border-bottom: 0.5px solid rgba(255,255,255,0.07); padding: 14px 16px; }
  .hdr-top { display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 17px; }
  header a.exit, header button.exit { color: #c9a84c; font-size: 12px; text-decoration: none; border: 0.5px solid #333; border-radius: 6px; padding: 6px 10px; background: none; font-family: inherit; cursor: pointer; }
  .rada { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888; margin-top: 8px; flex-wrap: wrap; }
  .rada button { background: none; border: none; color: #c9a84c; font-size: 12px; cursor: pointer; padding: 0; }
  #app { padding: 12px; max-width: 640px; margin: 0 auto; }
  .who { font-size: 12px; color: #666; text-align: right; margin-bottom: 6px; }
  .tile { background: #13161c; border: 0.5px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 16px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 14px; }
  .tile:active { background: #1a1d24; }
  .tile .ikoon { font-size: 26px; width: 44px; text-align: center; }
  .tile .info { flex: 1; }
  .tile .nimi { font-size: 16px; font-weight: 700; }
  .tile .sub { font-size: 12px; color: #888; margin-top: 2px; }
  .progress { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #1e2128; color: #aaa; }
  .progress.ok { background: #14532d; color: #86efac; }
  .card { background: #13161c; border: 0.5px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .card .rida1 { display: flex; justify-content: space-between; align-items: baseline; }
  .card .nimi { font-size: 16px; font-weight: 700; }
  .card .staatused { display: flex; gap: 8px; margin-top: 10px; }
  .stbtn { flex: 1; padding: 12px 8px; border-radius: 8px; border: 2px solid #252830; font-size: 13px; font-weight: 600; background: #0d0f13; color: #888; }
  .stbtn.done { background: #16a34a; border-color: #16a34a; color: white; }
  .stbtn.clean { background: #0ea5e9; border-color: #0ea5e9; color: white; }
  .meta { font-size: 11px; color: #666; margin-top: 6px; }
  .empty { text-align: center; color: #666; margin-top: 60px; padding: 0 20px; }
  .empty a { color: #c9a84c; }
  .foto-kaart { background: #13161c; border: 0.5px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .foto-kaart img { width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
  .foto-nupp { display: inline-block; margin-top: 8px; background: #1e2128; border: 0.5px solid #333; color: #ccc; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .summary { background: #13161c; border: 0.5px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; font-size: 13px; display: flex; justify-content: space-between; }
  .rajakaart-suur { display: flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(135deg, #c9a84c, #a6842e); color: #0d0f13; border-radius: 14px; padding: 18px; margin-bottom: 14px; font-size: 18px; font-weight: 800; letter-spacing: 0.5px; text-decoration: none; }
  .rajakaart-suur:active { opacity: 0.85; }
  .sponsor-kaart .nimi { display: flex; align-items: center; gap: 6px; }
  .sponsor-kaart .markused { font-size: 13px; color: #ccc; margin-top: 8px; background: #1a1d24; border-radius: 8px; padding: 8px 10px; }
  .sp-staatused { display: flex; gap: 6px; margin-top: 10px; }
  .sp-stbtn { flex: 1; padding: 10px 4px; border-radius: 8px; border: 2px solid #252830; font-size: 12px; font-weight: 600; background: #0d0f13; color: #888; }
  .sp-stbtn.active { background: #c9a84c; border-color: #c9a84c; color: #0d0f13; }
</style>
</head>
<body>

<header>
  <div class="hdr-top">
    <h1 id="hdr-title">🥏 X-seeria</h1>
    <button class="exit" onclick="tagasi()">← Tagasi</button>
  </div>
  <div class="rada" id="rada"></div>
</header>

<div id="app">
  <div class="who" id="kes"></div>
  <div id="sisu">Laadimine...</div>
</div>

<script>
let token = localStorage.getItem('workerToken');

if (!token) {
  document.getElementById('sisu').innerHTML = '<div class="empty">Sa pole sisse logitud.<br><br>Ava esmalt <a href="/tootaja">Töötaja rakendus</a> ja logi oma PIN-koodiga sisse, seejärel ava see leht uuesti.</div>';
} else {
  algatus();
}

async function algatus() {
  try {
    const r = await fetch('/api/auth/sessioon', { headers: { 'x-session-token': token } });
    const s = await r.json();
    if (!s.sisselogitud || s.isAdmin) {
      document.getElementById('sisu').innerHTML = '<div class="empty">Sisselogimine aegus.<br><br>Ava <a href="/tootaja">Töötaja rakendus</a> ja logi uuesti sisse.</div>';
      return;
    }
    document.getElementById('kes').textContent = 'Tere, ' + s.nimi;
  } catch (e) {}
  naitaVoistlused();
}

async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'x-session-token': token }, opts.headers || {});
  if (!(opts.body instanceof FormData)) opts.headers['Content-Type'] = 'application/json';
  const r = await fetch('/api/xseeria' + path, opts);
  return r.json();
}

function breadcrumb(parts) {
  const box = document.getElementById('rada');
  box.innerHTML = parts.map((p, i) =>
    (i > 0 ? '<span>›</span>' : '') + (p.onclick ? `<button onclick="${p.onclick}">${p.tekst}</button>` : `<span>${p.tekst}</span>`)
  ).join(' ');
}

// "← Tagasi" nupp peab minema üks samm tagasi (mitte kohe töötaja rakendusse) — iga vaade
// registreerib siia, kuhu "Tagasi" peaks minema, kui parasjagu SEE vaade on ekraanil.
let tagasiSamm = null;
function seaTagasiSamm(fn) { tagasiSamm = fn; }
function tagasi() {
  if (typeof tagasiSamm === 'function') tagasiSamm();
  else window.location = '/tootaja';
}

// ── TASE 1: kõik võistlused ──────────────────────────────────
async function naitaVoistlused() {
  seaTagasiSamm(null); // esimene tase — "Tagasi" väljub töötaja rakendusse
  breadcrumb([]);
  const sisu = document.getElementById('sisu');
  const kontroll = await api('/kontroll');
  if (kontroll.ok === false && kontroll.veateade === 'Palun logi sisse') {
    sisu.innerHTML = '<div class="empty">Sisselogimine aegus.<br><br>Ava <a href="/tootaja">Töötaja rakendus</a> ja logi uuesti sisse.</div>';
    return;
  }
  if (kontroll.lubatud === false) {
    sisu.innerHTML = '<div class="empty">Sul pole veel X-seeria ligipääsu.<br>Palu adminil see lubada.</div>';
    return;
  }
  const d = await api('/events');
  if (!d.ok || !d.events.length) {
    sisu.innerHTML = '<div class="empty">Ühtegi võistlust pole veel lisatud.<br>Küsi adminilt.</div>';
    return;
  }
  sisu.innerHTML = d.events.map(e => `
    <div class="tile" onclick="naitaAsukohad(${e.id}, '${escapeAttr(e.nimi)}')">
      <div class="ikoon">🏆</div>
      <div class="info">
        <div class="nimi">${escapeHtml(e.nimi)}</div>
        <div class="sub">${fmtKp(e.kuupaev)}${e.aktiivne ? ' · praegu aktiivne' : ''}</div>
      </div>
    </div>`).join('');
}

// ── TASE 2: pargid (asukohad) otse võistluse all ──────────────
let praeguneEvent = null;

async function naitaAsukohad(eventId, eventNimi) {
  seaTagasiSamm(() => naitaVoistlused());
  breadcrumb([
    { tekst: eventNimi }
  ]);
  praeguneEvent = { id: eventId, nimi: eventNimi };
  const sisu = document.getElementById('sisu');
  sisu.innerHTML = 'Laadimine...';
  const [d, sp, ul, teg] = await Promise.all([
    api('/event/' + eventId + '/asukohad'),
    api('/event/' + eventId + '/sponsorid'),
    api('/event/' + eventId + '/ulesanded'),
    api('/event/' + eventId + '/tegevused')
  ]);
  if (!d.ok) { sisu.innerHTML = '<div class="empty">Viga laadimisel.</div>'; return; }
  const sponsorHtml = (sp && sp.ok && sp.sponsorid.length) ? sponsorKaardid(eventId, sp.sponsorid) : '';
  const ulesandedHtml = (ul && ul.ok && ul.ulesanded.length)
    ? `<div class="tile" onclick="naitaUlesanded(${eventId}, '${escapeAttr(eventNimi)}')">
        <div class="ikoon">✅</div>
        <div class="info">
          <div class="nimi">ÜLESANDED</div>
          <div class="sub">${ul.ulesanded.filter(u => !u.tehtud).length}/${ul.ulesanded.length} tegemata</div>
        </div>
      </div>`
    : '';
  const tegevusedHtml = (teg && teg.ok && teg.tegevused.length)
    ? `<div class="tile" onclick="naitaTegevused(${eventId}, '${escapeAttr(eventNimi)}')">
        <div class="ikoon">🚚</div>
        <div class="info">
          <div class="nimi">TEGEVUSED</div>
          <div class="sub">${teg.tegevused.length} sulle määratud tegevust</div>
        </div>
      </div>`
    : '';
  const rajakaartUrl = d.event && d.event.rajakaart_url;
  const rajakaartHtml = rajakaartUrl
    ? `<a class="rajakaart-suur" href="${escapeAttr(rajakaartUrl)}" target="_blank">🗺️ RAJAKAART</a>`
    : '';
  if (!d.asukohad.length) { sisu.innerHTML = sponsorHtml + ulesandedHtml + tegevusedHtml + rajakaartHtml + '<div class="empty">Parke pole veel lisatud.<br>Küsi adminilt.</div>'; return; }
  sisu.innerHTML = sponsorHtml + ulesandedHtml + tegevusedHtml + rajakaartHtml + d.asukohad.map(a => {
    const valmis = a.korvide_koguarv > 0 && a.paigaldatud_arv === a.korvide_koguarv;
    const vahemik = (a.min_nr && a.max_nr) ? ` (rajad ${a.min_nr}-${a.max_nr})` : '';
    return `
    <div class="tile" onclick="naitaKorvid(${a.id}, '${escapeAttr(a.nimi)}', ${eventId}, '${escapeAttr(eventNimi)}')">
      <div class="ikoon">${a.foto_url ? '🖼️' : '📍'}</div>
      <div class="info">
        <div class="nimi">${escapeHtml(a.nimi)}</div>
        <div class="sub">${a.korvide_koguarv} korvi${vahemik}${a.viskekohtade_arv ? ' · ' + a.viskekohtade_arv + ' viskekohta' : ''}</div>
      </div>
      <div class="progress ${valmis ? 'ok' : ''}">${a.paigaldatud_arv}/${a.korvide_koguarv}</div>
    </div>`;
  }).join('');
}

// ── SPONSORID: "käsklus" kaardid, näidatakse enne rajakaardi nuppu ──
function sponsorKaardid(eventId, sponsorid) {
  return sponsorid.map(s => sponsorKaart(eventId, s)).join('');
}

function sponsorKaart(eventId, s) {
  const staatus = s.staatus || 'ootel';
  const nupp = (val, label) => `<button class="sp-stbtn ${staatus === val ? 'active' : ''}" onclick="muudaSponsorStaatus(${eventId}, ${s.sponsor_id}, '${val}')">${label}</button>`;
  return `
    <div class="card sponsor-kaart">
      <div class="rida1"><div class="nimi">🎁 ${escapeHtml(s.nimi)}</div></div>
      ${s.vastutaja_nimi ? `<div class="meta">👤 Vastutaja: ${escapeHtml(s.vastutaja_nimi)}</div>` : ''}
      ${s.markused ? `<div class="markused">${escapeHtml(s.markused)}</div>` : ''}
      <div class="sp-staatused">
        ${nupp('ootel', '⬜ Ootel')}
        ${nupp('kaes', '📦 Käes')}
        ${nupp('tagastatud', '✅ Tagastatud')}
      </div>
    </div>`;
}

async function muudaSponsorStaatus(eventId, sponsorId, staatus) {
  await api('/event/' + eventId + '/sponsorid/' + sponsorId + '/staatus', { method: 'POST', body: JSON.stringify({ staatus }) });
  if (praeguneEvent && praeguneEvent.id === eventId) naitaAsukohad(eventId, praeguneEvent.nimi);
}

// ── ÜLESANDED: organisatoorne checklist, aga ainult need, kus mina olen vastutaja ──
async function naitaUlesanded(eventId, eventNimi) {
  seaTagasiSamm(() => naitaAsukohad(eventId, eventNimi));
  breadcrumb([
    { tekst: eventNimi, onclick: `naitaAsukohad(${eventId}, '${escapeAttr(eventNimi)}')` },
    { tekst: 'Ülesanded' }
  ]);
  await laadiUlesanded(eventId, eventNimi);
}

async function laadiUlesanded(eventId, eventNimi) {
  const sisu = document.getElementById('sisu');
  sisu.innerHTML = 'Laadimine...';
  const d = await api('/event/' + eventId + '/ulesanded');
  if (!d.ok) { sisu.innerHTML = '<div class="empty">Viga laadimisel.</div>'; return; }
  if (!d.ulesanded.length) { sisu.innerHTML = '<div class="empty">Sulle pole hetkel ühtegi ülesannet määratud.</div>'; return; }
  sisu.innerHTML = d.ulesanded.map(u => ulesandeKaart(eventId, eventNimi, u)).join('');
}

function ulesandeKaart(eventId, eventNimi, u) {
  const tehtud = !!u.tehtud;
  const tahtaeg = u.tahtaeg ? fmtKp(u.tahtaeg) : '';
  return `
    <div class="card">
      <div class="rida1"><div class="nimi" style="${tehtud ? 'text-decoration:line-through;opacity:0.6' : ''}">${escapeHtml(u.tekst)}</div></div>
      ${u.kategooria ? `<div class="meta">🏷️ ${escapeHtml(u.kategooria)}</div>` : ''}
      ${tahtaeg ? `<div class="meta">📅 ${tahtaeg}</div>` : ''}
      <div class="staatused">
        <button class="stbtn ${tehtud ? 'done' : ''}" onclick="lulitaUlesanne(${eventId}, '${escapeAttr(eventNimi)}', ${u.id})">
          ${tehtud ? '✅ Tehtud' : '⬜ Märgi tehtuks'}
        </button>
      </div>
    </div>`;
}

async function lulitaUlesanne(eventId, eventNimi, id) {
  await api('/event/' + eventId + '/ulesanded/' + id + '/toggle', { method: 'POST' });
  await laadiUlesanded(eventId, eventNimi);
}

// ── TEGEVUSED: logistilised ülesanded (kuupäev+kellaaeg, võib olla mitu inimest) ──
async function naitaTegevused(eventId, eventNimi) {
  seaTagasiSamm(() => naitaAsukohad(eventId, eventNimi));
  breadcrumb([
    { tekst: eventNimi, onclick: `naitaAsukohad(${eventId}, '${escapeAttr(eventNimi)}')` },
    { tekst: 'Tegevused' }
  ]);
  const sisu = document.getElementById('sisu');
  sisu.innerHTML = 'Laadimine...';
  const d = await api('/event/' + eventId + '/tegevused');
  if (!d.ok) { sisu.innerHTML = '<div class="empty">Viga laadimisel.</div>'; return; }
  if (!d.tegevused.length) { sisu.innerHTML = '<div class="empty">Sulle pole hetkel ühtegi tegevust määratud.</div>'; return; }
  sisu.innerHTML = d.tegevused.map(t => tegevusKaart(t)).join('');
}

function tegevusKaart(t) {
  const kp = t.kuupaev ? fmtKp(t.kuupaev) : '';
  const kell = t.kellaaeg ? String(t.kellaaeg).slice(0, 5) : '';
  const inimesed = (t.inimesed || []).map(p => escapeHtml(p.nimi)).join(', ');
  return `
    <div class="card">
      <div class="rida1"><div class="nimi">🚚 ${escapeHtml(t.tegevus)}</div></div>
      ${(kp || kell) ? `<div class="meta">📅 ${kp}${kell ? ' kell ' + kell : ''}</div>` : ''}
      ${inimesed ? `<div class="meta">👷 ${inimesed}</div>` : ''}
    </div>`;
}

// ── TASE 3: korvid (üksikud, + rajakaart) ───────────────────────
let praeguneAsukoht = null;

async function naitaKorvid(asukohtId, asukohtNimi, eventId, eventNimi) {
  seaTagasiSamm(() => naitaAsukohad(eventId, eventNimi));
  breadcrumb([
    { tekst: eventNimi, onclick: `naitaAsukohad(${eventId}, '${escapeAttr(eventNimi)}')` },
    { tekst: asukohtNimi }
  ]);
  praeguneAsukoht = { id: asukohtId, eventId, eventNimi };
  await laadiKorvid();
}

let praegusedKorvidAndmed = null;
let naidatudPildid = new Set();

async function laadiKorvid() {
  const sisu = document.getElementById('sisu');
  sisu.innerHTML = 'Laadimine...';
  const d = await api('/asukoht/' + praeguneAsukoht.id + '/korvid');
  if (!d.ok) { sisu.innerHTML = '<div class="empty">Viga laadimisel.</div>'; return; }
  praegusedKorvidAndmed = d;
  joonistaKorvid();
}

function joonistaKorvid() {
  const d = praegusedKorvidAndmed;
  const sisu = document.getElementById('sisu');
  const a = d.asukoht;
  const tehtud = d.korvid.filter(k => k.paigaldus_staatus === 'tehtud').length;
  const puhas = d.korvid.filter(k => k.puhastus_staatus === 'tehtud').length;

  let html = `<div class="summary"><b>${escapeHtml(a.nimi)}</b><span>${tehtud}/${d.korvid.length} paigaldatud · ${puhas}/${d.korvid.length} puhas</span></div>`;

  html += d.korvid.map(k => kaart(k)).join('');
  sisu.innerHTML = html || '<div class="empty">Korve pole.</div>';
}

function lulitaPilt(korvId) {
  if (naidatudPildid.has(korvId)) naidatudPildid.delete(korvId);
  else naidatudPildid.add(korvId);
  joonistaKorvid();
}

function kaart(k) {
  const done = k.paigaldus_staatus === 'tehtud';
  const clean = k.puhastus_staatus === 'tehtud';
  const piltNaidatud = naidatudPildid.has(k.id);
  return `
    <div class="card">
      <div class="rida1"><div class="nimi">Rada nr ${escapeHtml(k.number)}</div></div>
      ${k.foto_url ? `
        <button class="foto-nupp" style="margin-top:8px" onclick="lulitaPilt(${k.id})">🖼️ ${piltNaidatud ? 'Peida pilt' : 'Näita pilti'}</button>
        ${piltNaidatud ? `<a href="${k.foto_url}" target="_blank"><img src="${k.foto_url}" alt="Rajakaart nr ${escapeHtml(k.number)}" style="width:100%;border-radius:8px;margin-top:8px;display:block"></a>` : ''}
      ` : ''}
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <label class="foto-nupp" style="margin:0">📷 ${k.foto_url ? 'Vaheta pilt' : 'Lisa pilt'}
          <input type="file" accept="image/*" style="display:none" onchange="laeUlesRajakaart(${k.id}, this)">
        </label>
        ${k.foto_url ? `<button class="foto-nupp" style="border:0.5px solid #333;color:#f87171;background:#1e2128" onclick="kustutaRajakaart(${k.id})">🗑 Kustuta pilt</button>` : ''}
      </div>
      <div class="staatused">
        <button class="stbtn ${done ? 'done' : ''}" onclick="toggleKorv(${k.id}, 'paigaldatud', ${done})">
          ${done ? '✅ Paigaldatud' : '⬜ Märgi paigaldatuks'}
        </button>
        <button class="stbtn ${clean ? 'clean' : ''}" onclick="toggleKorv(${k.id}, 'puhas', ${clean})">
          ${clean ? '🧹 Puhas' : '⬜ Märgi puhtaks'}
        </button>
      </div>
      ${done ? `<div class="meta">Paigaldas: ${escapeHtml(k.paigaldas_nimi || '')} ${fmtAeg(k.paigaldatud_kell)}</div>` : ''}
      ${clean ? `<div class="meta">Puhastas: ${escapeHtml(k.puhastas_nimi || '')} ${fmtAeg(k.puhastatud_kell)}</div>` : ''}
    </div>`;
}

async function toggleKorv(id, tuup, praeguOn) {
  const tee = tuup === 'paigaldatud'
    ? (praeguOn ? '/korvid/' + id + '/paigaldus-tagasi' : '/korvid/' + id + '/paigaldatud')
    : (praeguOn ? '/korvid/' + id + '/puhastus-tagasi' : '/korvid/' + id + '/puhas');
  await api(tee, { method: 'POST' });
  laadiKorvid();
}

function tihendaPilt(file, maxKylg, kvaliteet) {
  maxKylg = maxKylg || 1600; kvaliteet = kvaliteet || 0.8;
  return new Promise((resolve) => {
    if (!file.type || !file.type.startsWith('image/')) return resolve(file);
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxKylg || height > maxKylg) {
        if (width > height) { height = Math.round(height * maxKylg / width); width = maxKylg; }
        else { width = Math.round(width * maxKylg / height); height = maxKylg; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => { URL.revokeObjectURL(url); resolve(blob || file); }, 'image/jpeg', kvaliteet);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

async function laeUlesRajakaart(korvId, input) {
  const file = input.files[0];
  if (!file) return;
  const label = input.closest('label');
  const algneTekst = label ? label.innerHTML : '';
  if (label) label.innerHTML = '⏳ Laen üles...';
  try {
    const compressed = await tihendaPilt(file);
    const fd = new FormData();
    fd.append('foto', compressed, 'rajakaart.jpg');
    const controller = new AbortController();
    const ajapiirang = setTimeout(() => controller.abort(), 25000);
    try {
      await api('/korvid/' + korvId + '/rajakaart', { method: 'POST', body: fd, signal: controller.signal });
    } finally {
      clearTimeout(ajapiirang);
    }
  } catch (e) {
    alert('Pildi üleslaadimine ebaõnnestus. Proovi uuesti (kontrolli internetiühendust).');
  }
  laadiKorvid();
}

async function kustutaRajakaart(korvId) {
  if (!confirm('Kustutada selle raja pilt?')) return;
  await api('/korvid/' + korvId + '/rajakaart', { method: 'DELETE' });
  laadiKorvid();
}

function fmtAeg(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('et-EE') + ' ' + d.toLocaleTimeString('et-EE', { hour: '2-digit', minute: '2-digit' });
}

function fmtKp(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('et-EE');
}

function escapeHtml(s) {
  return (s || '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/'/g, "\\'");
}

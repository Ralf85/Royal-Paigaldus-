<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>X-seeria — Tiim</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #0d0f13; color: #e2e8f0; }
  header { background: #13161c; border-bottom: 0.5px solid rgba(255,255,255,0.07); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 18px; }
  header a { color: #c9a84c; font-size: 12px; text-decoration: none; border: 0.5px solid #333; border-radius: 6px; padding: 6px 10px; }
  #app { padding: 12px; max-width: 640px; margin: 0 auto; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin: 12px 4px; }
  .topbar .who { font-size: 13px; color: #888; }
  .refresh { background: none; border: 1px solid #c9a84c; color: #c9a84c; border-radius: 8px; padding: 8px 14px; font-size: 14px; }
  .summary { background: #13161c; border: 0.5px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; font-size: 14px; display: flex; justify-content: space-between; }
  .card { background: #13161c; border: 0.5px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .card .rida1 { display: flex; justify-content: space-between; align-items: baseline; }
  .card .nimi { font-size: 17px; font-weight: 700; }
  .card .arv { font-size: 14px; color: #888; }
  .card .staatused { display: flex; gap: 8px; margin-top: 10px; }
  .stbtn { flex: 1; padding: 12px 8px; border-radius: 8px; border: 2px solid #252830; font-size: 14px; font-weight: 600; background: #0d0f13; color: #888; }
  .stbtn.done { background: #16a34a; border-color: #16a34a; color: white; }
  .stbtn.clean { background: #0ea5e9; border-color: #0ea5e9; color: white; }
  .meta { font-size: 12px; color: #666; margin-top: 6px; }
  .empty { text-align: center; color: #666; margin-top: 60px; padding: 0 20px; }
  .empty a { color: #c9a84c; }
</style>
</head>
<body>

<header>
  <h1>🥏 X-seeria</h1>
  <a href="/">← Tagasi</a>
</header>

<div id="app">
  <div class="topbar">
    <div class="who" id="kes"></div>
    <button class="refresh" onclick="laadi()">↻ Värskenda</button>
  </div>
  <div id="sisu">Laadimine...</div>
</div>

<script>
let token = localStorage.getItem('workerToken');

if (!token) {
  document.getElementById('sisu').innerHTML = '<div class="empty">Sa pole sisse logitud.<br><br>Ava esmalt <a href="/tootaja">Töötaja rakendus</a> ja logi oma PIN-koodiga sisse, seejärel ava see leht uuesti.</div>';
} else {
  algatus();
}

async function algatus() {
  try {
    const r = await fetch('/api/auth/sessioon', { headers: { 'x-session-token': token } });
    const s = await r.json();
    if (!s.sisselogitud || s.isAdmin) {
      document.getElementById('sisu').innerHTML = '<div class="empty">Sisselogimine aegus.<br><br>Ava <a href="/tootaja">Töötaja rakendus</a> ja logi uuesti sisse.</div>';
      return;
    }
    document.getElementById('kes').textContent = 'Tere, ' + s.nimi;
  } catch (e) {}
  laadi();
  setInterval(() => { if (token) laadi(); }, 30000);
}

async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json', 'x-session-token': token }, opts.headers || {});
  const r = await fetch('/api/xseeria' + path, opts);
  return r.json();
}

async function laadi() {
  const sisu = document.getElementById('sisu');
  const kontroll = await api('/kontroll');
  if (kontroll.ok === false && kontroll.veateade === 'Palun logi sisse') {
    sisu.innerHTML = '<div class="empty">Sisselogimine aegus.<br><br>Ava <a href="/tootaja">Töötaja rakendus</a> ja logi uuesti sisse.</div>';
    return;
  }
  if (kontroll.lubatud === false) {
    sisu.innerHTML = '<div class="empty">Sul pole veel X-seeria ligipääsu.<br>Palu adminil see lubada.</div>';
    return;
  }
  const d = await api('/aktiivne');
  if (!d.ok) { sisu.innerHTML = '<div class="empty">Viga andmete laadimisel.</div>'; return; }
  if (!d.event) { sisu.innerHTML = '<div class="empty">Hetkel pole aktiivset üritust.<br>Küsi adminilt.</div>'; return; }
  const tehtud = d.asukohad.filter(a => a.paigaldus_staatus === 'tehtud').length;
  const puhas = d.asukohad.filter(a => a.puhastus_staatus === 'tehtud').length;
  let html = `<div class="summary"><b>${escapeHtml(d.event.nimi)}</b><span>${tehtud}/${d.asukohad.length} paigaldatud · ${puhas}/${d.asukohad.length} puhas</span></div>`;
  html += d.asukohad.map(a => kaart(a)).join('');
  sisu.innerHTML = html || '<div class="empty">Asukohti pole veel lisatud.</div>';
}

function kaart(a) {
  const done = a.paigaldus_staatus === 'tehtud';
  const clean = a.puhastus_staatus === 'tehtud';
  const arvTekst = a.korvide_arv + ' korvi' + (a.viskekohtade_arv ? ' · ' + a.viskekohtade_arv + ' viskekohta' : '');
  return `
    <div class="card">
      <div class="rida1">
        <div class="nimi">${escapeHtml(a.nimi)}</div>
        <div class="arv">${arvTekst}</div>
      </div>
      ${a.markused ? `<div class="meta">📝 ${escapeHtml(a.markused)}</div>` : ''}
      <div class="staatused">
        <button class="stbtn ${done ? 'done' : ''}" onclick="toggle(${a.id}, 'paigaldatud', ${done})">
          ${done ? '✅ Paigaldatud' : '⬜ Märgi paigaldatuks'}
        </button>
        <button class="stbtn ${clean ? 'clean' : ''}" onclick="toggle(${a.id}, 'puhas', ${clean})">
          ${clean ? '🧹 Puhas' : '⬜ Märgi puhtaks'}
        </button>
      </div>
      ${done ? `<div class="meta">Paigaldas: ${escapeHtml(a.paigaldas_nimi || '')} ${fmtAeg(a.paigaldatud_kell)}</div>` : ''}
      ${clean ? `<div class="meta">Puhastas: ${escapeHtml(a.puhastas_nimi || '')} ${fmtAeg(a.puhastatud_kell)}</div>` : ''}
    </div>`;
}

async function toggle(id, tuup, praeguOn) {
  const tee = tuup === 'paigaldatud'
    ? (praeguOn ? '/asukohad/' + id + '/paigaldus-tagasi' : '/asukohad/' + id + '/paigaldatud')
    : (praeguOn ? '/asukohad/' + id + '/puhastus-tagasi' : '/asukohad/' + id + '/puhas');
  await api(tee, { method: 'POST' });
  laadi();
}

function fmtAeg(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('et-EE') + ' ' + d.toLocaleTimeString('et-EE', { hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
</script>
</body>
</html>

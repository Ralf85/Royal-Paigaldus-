<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Paigaldus — Tööpäevik</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0d0f13; --bg2: #13161c; --bg3: #1e2128; --border: rgba(255,255,255,0.06); --text: #e2e8f0; --text2: #bbb; --text3: #555; }
    body.hele { --bg: #f4f5f7; --bg2: #ffffff; --bg3: #e8eaed; --border: rgba(0,0,0,0.08); --text: #1a1a2e; --text2: #444; --text3: #888; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.2s, color 0.2s; }
    .topbar { background: var(--bg2); border-bottom: 0.5px solid rgba(255,255,255,0.07); padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 32px; height: 32px; background: linear-gradient(135deg, #c9a84c, #f0d080); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .brand-name { font-size: 13px; font-weight: 700; color: #c9a84c; }
    .brand-sub { font-size: 10px; color: #555; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: #252830; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #999; }
    .worker-nimi { font-size: 13px; color: #bbb; }
    .logout-btn { font-size: 11px; color: #444; background: none; border: 0.5px solid #2a2a2a; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
    .logout-btn:hover { border-color: #ef4444; color: #ef4444; }
    .leht { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
    .kuu-filter { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .kuu-filter::-webkit-scrollbar { display: none; }
    .kf-nupp { font-size: 12px; padding: 6px 14px; border-radius: 20px; border: 0.5px solid #252830; color: #555; background: none; cursor: pointer; white-space: nowrap; }
    .kf-nupp.ak { background: #c9a84c; border-color: #c9a84c; color: #0d0f13; font-weight: 600; }
    .sekts-pealkiri { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #3a3d45; margin-bottom: 10px; }
    .employer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .emp-card { border-radius: 12px; padding: 14px 10px 13px; cursor: pointer; text-align: center; border: 1.5px solid transparent; transition: transform 0.15s; text-decoration: none; display: block; }
    .emp-card:hover { transform: translateY(-3px); }
    .emp-card.lidl { background: #002060; border-color: #003d99; }
    .emp-card.cramo { background: #180604; border-color: #3a0d07; }
    .emp-card.muu { background: #0e1824; border-color: #1a2d40; }
    .emp-card.merekohvik { background: #051a10; border-color: #0a3520; }
    .emp-logo { width: 40px; height: 40px; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    .emp-logo.lidl { background: #FFF200; border-radius: 50%; }
    .emp-logo.cramo { background: #CD2200; border-radius: 9px; }
    .emp-logo.muu { background: #1a3550; border-radius: 9px; }
    .emp-logo.merekohvik { background: #065f46; border-radius: 9px; }
    .emp-logo span { font-size: 10px; font-weight: 800; }
    .emp-logo.lidl span { color: #0050AA; }
    .emp-logo.cramo span { color: #fff; }
    .emp-logo.muu span { color: #38bdf8; }
    .emp-logo.merekohvik span { color: #4ade80; }
    .emp-label { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
    .emp-label.lidl { color: #FFF200; }
    .emp-label.cramo { color: #ff6b50; }
    .emp-label.muu { color: #38bdf8; }
    .emp-label.merekohvik { color: #4ade80; }
    .emp-tunnid { font-size: 20px; font-weight: 700; color: #fff; }
    .emp-tunnid-sub { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 3px; }
    .kaart { background: var(--bg2); border: 0.5px solid rgba(255,255,255,0.06); border-radius: 14px; overflow: hidden; margin-bottom: 16px; }
    .kaart-hdr { padding: 13px 16px 11px; border-bottom: 0.5px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 8px; }
    .kaart-hdr-tekst { font-size: 13px; font-weight: 600; color: #d0d0d0; }
    .kaart-hdr-arv { margin-left: auto; font-size: 11px; color: #444; background: #1e2128; border-radius: 20px; padding: 2px 8px; }
    .tulevane-rida { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-bottom: 0.5px solid rgba(255,255,255,0.04); }
    .tulevane-rida:last-child { border-bottom: none; }
    .tr-kast { min-width: 42px; background: #1e2128; border-radius: 9px; padding: 7px 4px; text-align: center; }
    .tr-paev { font-size: 17px; font-weight: 700; color: #fff; }
    .tr-kuu { font-size: 9px; text-transform: uppercase; color: #555; margin-top: 2px; }
    .tr-info { flex: 1; }
    .tr-badge { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-right: 6px; }
    .badge-lidl { background: #FFF200; color: #002060; }
    .badge-cramo { background: #CD2200; color: #fff; }
    .badge-muu { background: #0369a1; color: #fff; }
    .badge-merekohvik { background: #065f46; color: #4ade80; }
    .tr-objekt { font-size: 13px; font-weight: 500; color: #e0e0e0; }
    .tr-kell { font-size: 11px; color: #505560; margin-top: 2px; }
    .tr-kirjeldus { font-size: 11px; color: #505560; margin-top: 3px; font-style: italic; }
    .tr-paevad { text-align: right; }
    .tr-paevad-arv { font-size: 11px; color: #3a3d45; }
    .laek-kokkuvote { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(0,0,0,0.2); border-bottom: 0.5px solid rgba(255,255,255,0.05); }
    .laek-kv-item { padding: 13px 12px; text-align: center; border-right: 0.5px solid rgba(255,255,255,0.05); }
    .laek-kv-item:last-child { border-right: none; }
    .laek-kv-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #444; margin-bottom: 5px; }
    .laek-kv-val { font-size: 17px; font-weight: 700; }
    .v-roheline { color: #4ade80; }
    .v-hall { color: #666; }
    .v-kollane { color: #fbbf24; }
    .laekumine-rida { display: flex; justify-content: space-between; align-items: center; padding: 11px 16px; border-bottom: 0.5px solid rgba(255,255,255,0.04); }
    .laekumine-rida:last-child { border-bottom: none; }
    .lr-vasak { display: flex; align-items: center; gap: 10px; }
    .lr-ikoon { width: 30px; height: 30px; border-radius: 50%; background: #0f2d1a; border: 0.5px solid #1a4d2a; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .lr-kuupaev { font-size: 13px; color: #c0c0c0; }
    .lr-komm { font-size: 11px; color: #505560; margin-top: 1px; }
    .lr-summa { font-size: 15px; font-weight: 700; color: #4ade80; }
    .tyhi-olek { padding: 24px 16px; text-align: center; color: #3a3d45; font-size: 13px; }
    .tp-rida { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 0.5px solid rgba(255,255,255,0.04); }
    .tp-rida:last-child { border-bottom: none; }
    .tp-kp { min-width: 38px; background: #1e2128; border-radius: 8px; padding: 6px 4px; text-align: center; }
    .tp-kp-paev { font-size: 16px; font-weight: 700; color: #fff; line-height: 1; }
    .tp-kp-kuu { font-size: 9px; text-transform: uppercase; color: #555; margin-top: 2px; }
    .tp-info { flex: 1; }
    .tp-badge { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-right: 5px; }
    .tp-objekt { font-size: 13px; color: #d0d0d0; }
    .tp-aeg { font-size: 11px; color: #505560; margin-top: 2px; }
    .tp-komm { font-size: 11px; color: #505560; margin-top: 2px; font-style: italic; }
    .tp-tunnid { font-size: 15px; font-weight: 700; color: #c9a84c; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-logo">&#128081;</div>
      <div><div class="brand-name">ROYAL PAIGALDUS</div><div class="brand-sub">Tööpäevik</div></div>
    </div>
    <div class="topbar-right">
      <button onclick="vahetaTeema()" id="teemaNupp" style="font-size:16px;background:none;border:0.5px solid #333;border-radius:6px;padding:4px 8px;cursor:pointer;color:#aaa">&#9728;&#65039;</button>
      <div class="avatar" id="avatarInitsiaalid">—</div>
      <span class="worker-nimi" id="workerNimiTop">...</span>
      <button class="logout-btn" onclick="välju()">Välja</button>
    </div>
  </div>

  <div class="leht">
    <div class="kuu-filter" id="kuuFilter"></div>
    <div class="sekts-pealkiri" id="kuuPealkiri">Juuni tööd</div>

    <div class="employer-grid" id="ettevotteKaardid">
      <div style="color:#555;font-size:13px;padding:20px">Laadimine...</div>
    </div>

    <div class="kaart">
      <div class="kaart-hdr">
        <span>&#128197;</span>
        <span class="kaart-hdr-tekst">Tulevased tööd</span>
        <span class="kaart-hdr-arv" id="tulevaste-arv">0</span>
      </div>
      <div id="tulevasteToodSisu"><div class="tyhi-olek">Tulevasi töid pole kirjas</div></div>
    </div>

    <div class="kaart" id="merekohvikGraafikKaart" style="display:none">
      <div class="kaart-hdr" style="justify-content:space-between">
        <div style="display:flex;align-items:center;gap:8px">
          <span>&#9749;</span>
          <span class="kaart-hdr-tekst">Merekohviku graafik</span>
        </div>
        <button onclick="toggleLisaVahetus()" style="background:#065f46;border:none;border-radius:6px;padding:4px 10px;font-size:12px;color:#4ade80;cursor:pointer">+ Lisa vahetus</button>
      </div>

      <div id="lisaVahetusVorm" style="display:none;padding:14px 16px;border-bottom:0.5px solid rgba(255,255,255,0.05);background:rgba(0,0,0,0.2)">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
          <div>
            <label style="font-size:11px;color:#555;display:block;margin-bottom:4px">Kuupäev</label>
            <input type="date" id="g-kuupaev" style="width:100%;background:#13161c;border:0.5px solid #252830;border-radius:8px;padding:8px;color:#e2e8f0;font-size:13px;color-scheme:dark">
          </div>
          <div>
            <label style="font-size:11px;color:#555;display:block;margin-bottom:4px">Algus</label>
            <input type="time" id="g-algus" value="10:00" style="width:100%;background:#13161c;border:0.5px solid #252830;border-radius:8px;padding:8px;color:#e2e8f0;font-size:13px">
          </div>
          <div>
            <label style="font-size:11px;color:#555;display:block;margin-bottom:4px">Lõpp</label>
            <input type="time" id="g-lopp" value="18:00" style="width:100%;background:#13161c;border:0.5px solid #252830;border-radius:8px;padding:8px;color:#e2e8f0;font-size:13px">
          </div>
        </div>
        <div style="margin-bottom:8px">
          <label style="font-size:11px;color:#555;display:block;margin-bottom:4px">Märkus (vabatahtlik)</label>
          <input type="text" id="g-markus" placeholder="nt. ainult bar, terrassil..." style="width:100%;background:#13161c;border:0.5px solid #252830;border-radius:8px;padding:8px;color:#e2e8f0;font-size:13px">
        </div>
        <div style="display:flex;gap:8px">
          <button onclick="lisaVahetus()" style="background:#4ade80;color:#0d0f13;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer">Salvesta</button>
          <button onclick="toggleLisaVahetus()" style="background:#252830;color:#aaa;border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer">Tühista</button>
        </div>
        <div id="g-teade" style="margin-top:8px;font-size:12px;display:none"></div>
      </div>

      <div id="graafikSisu"><div class="tyhi-olek">Laadimine...</div></div>
    </div>

    <div class="kaart">
      <div class="kaart-hdr">
        <span>&#128203;</span>
        <span class="kaart-hdr-tekst">Tööpäevik</span>
        <span class="kaart-hdr-arv" id="toopaeviku-kuu">—</span>
      </div>
      <div id="toopaevikuSisu"><div class="tyhi-olek">Selle kuu kirjeid pole</div></div>
    </div>

    <div class="kaart">
      <div class="kaart-hdr" onclick="toggleLaekumised()" style="cursor:pointer">
        <span>&#128176;</span>
        <span class="kaart-hdr-tekst">Laekumised</span>
        <span class="kaart-hdr-arv" id="laekumiste-kuu">—</span>
        <span id="laekumiste-silm" style="margin-left:8px;font-size:14px;color:#555">&#128065;</span>
      </div>
      <div id="laekumistePeidus">
        <div style="padding:16px;text-align:center;color:#555;font-size:13px">
          Vajuta pealkirjale numbrite nägemiseks
        </div>
      </div>
      <div id="laekumisteSisu" style="display:none">
        <div class="laek-kokkuvote">
          <div class="laek-kv-item"><div class="laek-kv-label">Teenitud</div><div class="laek-kv-val v-roheline" id="kv-teenitud">—</div></div>
          <div class="laek-kv-item"><div class="laek-kv-label">Makstud</div><div class="laek-kv-val v-hall" id="kv-makstud">—</div></div>
          <div class="laek-kv-item"><div class="laek-kv-label">Ootel</div><div class="laek-kv-val v-kollane" id="kv-ootel">—</div></div>
        </div>
        <div id="laekumisteSisuList"><div class="tyhi-olek">Laekumisi pole</div></div>
      </div>
    </div>
  </div>

  <script>
    var KUUD = ['Jaanuar','Veebruar','Märts','Aprill','Mai','Juuni','Juuli','August','September','Oktoober','November','Detsember'];
    var KUUD_LYHIKE = ['jaan','veeb','märts','apr','mai','juu','juul','aug','sept','okt','nov','dets'];
    var aktiivsKuu, aktiivsAasta, aktiivsWorkerId = null;
    var TOKEN = localStorage.getItem('workerToken') || '';
    var koikGraafikAndmed = null;

    function api(url, opts) {
      opts = opts || {};
      opts.headers = opts.headers || {};
      opts.headers['x-session-token'] = TOKEN;
      opts.headers['Content-Type'] = 'application/json';
      return fetch(url, opts).then(function(r) { return r.json(); });
    }

    async function init() {
      if (!TOKEN) { window.location = '/'; return; }
      var s = await api('/api/auth/sessioon');
      if (!s.sisselogitud || s.isAdmin) { window.location = '/'; return; }
      var initsiaalid = s.nimi.split(' ').map(function(n) { return n[0]; }).join('').toUpperCase().slice(0,2);
      document.getElementById('avatarInitsiaalid').textContent = initsiaalid;
      document.getElementById('workerNimiTop').textContent = s.nimi;
      aktiivsWorkerId = s.workerId;
      var t = new Date();
      aktiivsKuu = t.getMonth() + 1;
      aktiivsAasta = t.getFullYear();
      ehitaKuuFilter(t);
      await laadiKoik();
    }

    function ehitaKuuFilter(t) {
      var filter = document.getElementById('kuuFilter');
      for (var i = -3; i <= 2; i++) {
        var kuu = t.getMonth() + i;
        var aasta = t.getFullYear();
        if (kuu < 0) { kuu += 12; aasta--; }
        if (kuu >= 12) { kuu -= 12; aasta++; }
        var btn = document.createElement('button');
        btn.className = 'kf-nupp' + (i === 0 ? ' ak' : '');
        btn.textContent = KUUD[kuu].slice(0,3) + ' ' + aasta;
        btn.dataset.kuu = kuu + 1;
        btn.dataset.aasta = aasta;
        (function(b) {
          b.onclick = function() {
            document.querySelectorAll('.kf-nupp').forEach(function(x) { x.classList.remove('ak'); });
            b.classList.add('ak');
            aktiivsKuu = parseInt(b.dataset.kuu);
            aktiivsAasta = parseInt(b.dataset.aasta);
            laadiKoik();
          };
        })(btn);
        filter.appendChild(btn);
      }
    }

    async function laadiKoik() {
      document.getElementById('kuuPealkiri').textContent = KUUD[aktiivsKuu-1] + ' tööd';
      document.getElementById('laekumiste-kuu').textContent = KUUD[aktiivsKuu-1];
      await Promise.all([laadiEttevotted(), laadiTulevasedTood(), laadiLaekumised(), laadiToopaevik(), laadiGraafik()]);
    }

    async function laadiEttevotted() {
      var ettevotted = await api('/api/tood/minu-ettevotted');
      var kokkuvote = await api('/api/tood/kokkuvote?aasta=' + aktiivsAasta + '&kuu=' + aktiivsKuu);
      var div = document.getElementById('ettevotteKaardid');
      if (!ettevotted.length) {
        div.innerHTML = '<div style="color:#555;font-size:13px;padding:20px;grid-column:1/-1">Ühtegi ettevõtet pole määratud</div>';
        return;
      }
      var tunnidFirma = {};
      if (kokkuvote.ok && kokkuvote.kirjed) {
        kokkuvote.kirjed.forEach(function(k) {
          tunnidFirma[k.ettevote_id] = (tunnidFirma[k.ettevote_id] || 0) + parseFloat(k.tunnid);
        });
      }
      if (kokkuvote.ok) {
        document.getElementById('kv-teenitud').textContent = parseFloat(kokkuvote.teenitud).toFixed(0) + ' €';
        document.getElementById('kv-makstud').textContent = parseFloat(kokkuvote.makstud).toFixed(0) + ' €';
        var ootel = parseFloat(kokkuvote.saadaVeel);
        document.getElementById('kv-ootel').textContent = (ootel > 0 ? '+' : '') + ootel.toFixed(0) + ' €';
      }
      div.innerHTML = ettevotted.map(function(e) {
        var tyyp = e.tyyp || 'muu';
        var tunnid = tunnidFirma[e.id] || 0;
        var logo = tyyp === 'lidl' ? 'LIDL' : tyyp === 'cramo' ? 'CR' : e.nimi.slice(0,2);
        return '<a class="emp-card ' + tyyp + '" href="/tootaja-tood?ettevote=' + e.id + '">'
          + '<div class="emp-logo ' + tyyp + '"><span>' + logo + '</span></div>'
          + '<div class="emp-label ' + tyyp + '">' + e.nimi + '</div>'
          + '<div class="emp-tunnid">' + (tunnid > 0 ? tunnid.toFixed(1) + 'h' : '0 h') + '</div>'
          + '<div class="emp-tunnid-sub">sellel kuul</div>'
          + '</a>';
      }).join('');
    }

    async function laadiTulevasedTood() {
      var andmed = await api('/api/tood/tulevased');
      var taana = new Date(); taana.setHours(0,0,0,0);
      var graafikAndmed = [];
      try {
        var t = new Date();
        var kuud = [];
        for (var i = 0; i < 3; i++) {
          var d = new Date(t.getFullYear(), t.getMonth() + i, 1);
          kuud.push({ aasta: d.getFullYear(), kuu: d.getMonth() + 1 });
        }
        var tulemused = await Promise.all(kuud.map(function(k) {
          return api('/api/graafik/minu?aasta=' + k.aasta + '&kuu=' + k.kuu);
        }));
        var koikVahetused = [];
        tulemused.forEach(function(v) {
          if (v && v.vahetused) koikVahetused = koikVahetused.concat(v.vahetused);
        });
        graafikAndmed = koikVahetused
          .filter(function(v) { return new Date(v.kuupaev.substring(0,10) + 'T12:00:00') >= taana; })
          .map(function(v) {
            return {
              kuupaev: v.kuupaev.substring(0,10),
              ettevote_nimi: 'MEREKOHVIK',
              tyyp: 'merekohvik',
              objekt_nimi: '',
              algus_kell: v.algus,
              lopp_kell: v.lopp,
              kirjeldus: v['m\u00e4rkus'] || '',
              onGraafik: true
            };
          });
      } catch(e) { console.log('Graafik viga:', e); }

      var koik = (Array.isArray(andmed) ? andmed : []).concat(graafikAndmed)
        .sort(function(a, b) { return new Date(a.kuupaev) - new Date(b.kuupaev); });
      var naita = koik.slice(0, 4);
      var div = document.getElementById('tulevasteToodSisu');
      document.getElementById('tulevaste-arv').textContent = koik.length;
      if (!koik.length) {
        div.innerHTML = '<div class="tyhi-olek">Tulevasi töid pole kirjas</div>';
        return;
      }
      div.innerHTML = naita.map(function(t) {
        var d = new Date(t.kuupaev);
        var paevJaani = Math.ceil((d - taana) / 86400000);
        var tyyp = (t.tyyp || 'muu').toLowerCase();
        return '<div class="tulevane-rida">'
          + '<div class="tr-kast"><div class="tr-paev">' + d.getDate() + '</div><div class="tr-kuu">' + KUUD_LYHIKE[d.getMonth()] + '</div></div>'
          + '<div class="tr-info">'
          + '<div><span class="tr-badge badge-' + tyyp + '">' + t.ettevote_nimi + '</span><span class="tr-objekt">' + (t.objekt_nimi || '') + '</span>' + (t.onGraafik ? '<span style="font-size:9px;color:#4ade80;margin-left:4px">graafik</span>' : '') + '</div>'
          + '<div style="font-size:12px;color:#505560">&#9200; ' + v.algus + ' – ' + v.lopp + '</div>'
          
          + (t.kirjeldus ? '<div class="tr-kirjeldus">' + t.kirjeldus + '</div>' : '')
          + '</div>'
          + '<div class="tr-paevad"><div class="tr-paevad-arv">' + (paevJaani > 0 ? paevJaani + 'p' : 'täna') + '</div></div>'
          + '</div>';
      }).join('') + (koik.length > 4 ? '<div style="padding:10px 16px;text-align:center;color:#555;font-size:12px">+ ' + (koik.length - 4) + ' veel...</div>' : '');
    }

    var laekumisedNahtav = false;

    function toggleLaekumised() {
      laekumisedNahtav = !laekumisedNahtav;
      document.getElementById('laekumisteSisu').style.display = laekumisedNahtav ? 'block' : 'none';
      document.getElementById('laekumistePeidus').style.display = laekumisedNahtav ? 'none' : 'block';
      document.getElementById('laekumiste-silm').textContent = laekumisedNahtav ? '&#128584;' : '&#128065;';
    }

    async function laadiLaekumised() {
      var andmed = await api('/api/admin/maksed?worker_id=self&aasta=' + aktiivsAasta + '&kuu=' + aktiivsKuu);
      if (Array.isArray(andmed) && andmed.length) {
        var kokku = andmed.reduce(function(s, m) { return s + parseFloat(m.summa); }, 0);
        document.getElementById('kv-makstud').textContent = kokku.toFixed(0) + ' €';
      } else {
        document.getElementById('kv-makstud').textContent = '0 €';
      }
      var div = document.getElementById('laekumisteSisuList');
      if (!Array.isArray(andmed) || !andmed.length) {
        div.innerHTML = '<div class="tyhi-olek">Selle kuu laekumisi pole</div>';
        return;
      }
      div.innerHTML = andmed.map(function(m) {
        var d = new Date(m.kuupaev);
        return '<div class="laekumine-rida">'
          + '<div class="lr-vasak"><div class="lr-ikoon">&#11015;&#65039;</div>'
          + '<div><div class="lr-kuupaev">' + d.getDate() + '. ' + KUUD[d.getMonth()] + ' ' + d.getFullYear() + '</div>'
          + (m.kommentaar ? '<div class="lr-komm">' + m.kommentaar + '</div>' : '')
          + '</div></div>'
          + '<div class="lr-summa">+' + parseFloat(m.summa).toFixed(0) + ' €</div>'
          + '</div>';
      }).join('');
    }

    async function laadiToopaevik() {
      document.getElementById('toopaeviku-kuu').textContent = KUUD[aktiivsKuu-1];
      var vastus = await api('/api/tood/kokkuvote?aasta=' + aktiivsAasta + '&kuu=' + aktiivsKuu);
      var div = document.getElementById('toopaevikuSisu');
      if (!vastus.ok || !vastus.kirjed || !vastus.kirjed.length) {
        div.innerHTML = '<div class="tyhi-olek">Selle kuu kirjeid pole</div>';
        return;
      }
      div.innerHTML = vastus.kirjed.map(function(k) {
        var d = new Date(k.kuupaev);
        var tyyp = (k.ettevote_tyyp || 'muu').toLowerCase();
        var kmInfo = parseFloat(k.kilomeetrid || 0) > 0 ? ' · &#128663; ' + k.kilomeetrid + 'km' : '';
        var lisakuluInfo = parseFloat(k.lisakulu_summa || 0) > 0 ? ' · &#128184; ' + parseFloat(k.lisakulu_summa).toFixed(2) + '€' + (k.lisakulu_selgitus ? ' (' + k.lisakulu_selgitus + ')' : '') : '';
        return '<div class="tp-rida">'
          + '<div class="tp-kp"><div class="tp-kp-paev">' + d.getDate() + '</div><div class="tp-kp-kuu">' + KUUD_LYHIKE[d.getMonth()] + '</div></div>'
          + '<div class="tp-info">'
          + '<div><span class="tp-badge badge-' + tyyp + '">' + k.ettevote_nimi + '</span><span class="tp-objekt">' + (k.objekt_nimi || '') + '</span></div>'
          + '<div class="tp-aeg">' + k.algus.slice(0,5) + ' – ' + k.lopp.slice(0,5) + kmInfo + lisakuluInfo + '</div>'
          + (k.kommentaar ? '<div class="tp-komm">' + k.kommentaar + '</div>' : '')
          + '</div>'
          + '<div class="tp-tunnid">' + parseFloat(k.tunnid).toFixed(1) + 'h</div>'
          + '</div>';
      }).join('');
    }

    async function laadiGraafik() {
      var t = new Date();
      var kuud = [];
      for (var i = 0; i < 3; i++) {
        var d = new Date(t.getFullYear(), t.getMonth() + i, 1);
        kuud.push({ aasta: d.getFullYear(), kuu: d.getMonth() + 1 });
      }
      var tulemused = await Promise.all(kuud.map(function(k) {
        return api('/api/graafik/minu?aasta=' + k.aasta + '&kuu=' + k.kuu);
      }));
      var kaart = document.getElementById('merekohvikGraafikKaart');
      var kehtiv = tulemused.filter(function(v) { return v && v.ok !== false; });
      if (!kehtiv.length) { kaart.style.display = 'none'; return; }
      kaart.style.display = 'block';
      var vahetused = [];
      var paevad = [];
      kehtiv.forEach(function(v) {
        if (v.vahetused) vahetused = vahetused.concat(v.vahetused);
        if (v.paevad) paevad = paevad.concat(v.paevad);
      });
      koikGraafikAndmed = { vahetused: vahetused, paevad: paevad };
      kuvaKompaktGraafik(koikGraafikAndmed, false);
    }

    function kuvaKompaktGraafik(vastus, koik) {
      var vahetused = vastus.vahetused || [];
      var paevadInfo = vastus.paevad || [];
      var paevadMap = {};
      paevadInfo.forEach(function(p) { paevadMap[p.kuupaev.substring(0,10)] = p; });
      var taana = new Date(); taana.setHours(0,0,0,0);
      var tulevased = vahetused
        .filter(function(v) { return new Date(v.kuupaev.substring(0,10) + 'T12:00:00') >= taana; })
        .sort(function(a,b) { return a.kuupaev.localeCompare(b.kuupaev); });
      var naita = koik ? tulevased : tulevased.slice(0, 4);
      var div = document.getElementById('graafikSisu');
      if (!tulevased.length) {
        div.innerHTML = '<div class="tyhi-olek">Sinu vahetusi pole</div>';
        return;
      }
      var staatusNimi = { suuryritus: '&#128309;', kohvik: '&#128994;', suletud: '&#128308;' };
      div.innerHTML = naita.map(function(v) {
        var kp = v.kuupaev.substring(0,10);
        var d = new Date(kp + 'T12:00:00');
        var nadalaPaev = ['P','E','T','K','N','R','L'][d.getDay()];
        var info = paevadMap[kp];
        var staatus = info && info.staatus;
        var markus = v['m\u00e4rkus'] || '';
        return '<div style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:0.5px solid rgba(255,255,255,0.04)">'
          + '<div style="min-width:42px;background:#1e2128;border-radius:9px;padding:6px 4px;text-align:center">'
          + '<div style="font-size:17px;font-weight:700;color:#fff;line-height:1">' + d.getDate() + '</div>'
          + '<div style="font-size:9px;text-transform:uppercase;color:#555;margin-top:2px">' + KUUD_LYHIKE[d.getMonth()] + '</div>'
          + '</div>'
          + '<div style="flex:1">'
          + '<div style="font-size:13px;font-weight:600;color:#e2e8f0">' + nadalaPaev + ' ' + (staatus && staatusNimi[staatus] ? staatusNimi[staatus] : '') + '</div>'
          + '<div style="font-size:12px;color:#505560">&#9200; ' + v.algus + ' – ' + v.lopp + '</div>'
          + (markus ? '<div style="font-size:11px;color:#505560;font-style:italic">' + markus + '</div>' : '')
          + '</div>'
          + '<button onclick="kustutaVahetus(' + v.id + ')" style="background:none;border:none;color:#444;cursor:pointer;font-size:13px">&#10005;</button>'
          + '</div>';
      }).join('')
        + (!koik && tulevased.length > 4 ? '<div onclick="kuvaKompaktGraafik(koikGraafikAndmed,true)" style="padding:12px 16px;text-align:center;color:#5b9cf6;font-size:13px;cursor:pointer">Näita rohkem (' + (tulevased.length - 4) + ' veel) &#8594;</div>' : '')
        + (koik && tulevased.length > 4 ? '<div onclick="kuvaKompaktGraafik(koikGraafikAndmed,false)" style="padding:12px 16px;text-align:center;color:#555;font-size:13px;cursor:pointer">Näita vähem &#8593;</div>' : '');
    }

    function toggleLisaVahetus() {
      var vorm = document.getElementById('lisaVahetusVorm');
      vorm.style.display = vorm.style.display === 'none' ? 'block' : 'none';
      if (vorm.style.display === 'block') {
        document.getElementById('g-kuupaev').value = new Date().toISOString().split('T')[0];
      }
    }

    async function lisaVahetus() {
      var kuupaev = document.getElementById('g-kuupaev').value;
      var algus = document.getElementById('g-algus').value;
      var lopp = document.getElementById('g-lopp').value;
      var markus = document.getElementById('g-markus').value;
      var teade = document.getElementById('g-teade');
      var keha = {};
      keha.kuupaev = kuupaev;
      keha.algus = algus;
      keha.lopp = lopp;
      keha['m\u00e4rkus'] = markus;
      var r = await api('/api/graafik/lisa', { method: 'POST', body: JSON.stringify(keha) });
      if (r.ok) {
        teade.style.display = 'none';
        document.getElementById('lisaVahetusVorm').style.display = 'none';
        document.getElementById('g-markus').value = '';
        await laadiGraafik();
      } else {
        teade.style.display = 'block';
        teade.style.color = '#ef4444';
        teade.textContent = r.veateade || 'Viga salvestamisel';
      }
    }

    async function kustutaVahetus(id) {
      if (!confirm('Kustutad selle vahetuse?')) return;
      var r = await api('/api/graafik/' + id, { method: 'DELETE' });
      if (r.ok) await laadiGraafik();
    }

    function välju() {
      localStorage.removeItem('workerToken');
      window.location = '/';
    }

    function vahetaTeema() {
      var hele = document.body.classList.toggle('hele');
      localStorage.setItem('teema', hele ? 'hele' : 'tume');
      document.getElementById('teemaNupp').textContent = hele ? '&#127769;' : '&#9728;&#65039;';
    }

    if (localStorage.getItem('teema') === 'hele') {
      document.body.classList.add('hele');
      document.addEventListener('DOMContentLoaded', function() {
        var n = document.getElementById('teemaNupp');
        if (n) n.textContent = '&#127769;';
      });
    }

    async function registreeriPush() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      try {
        var reg = await navigator.serviceWorker.register('/sw.js');
        var luba = await Notification.requestPermission();
        if (luba !== 'granted') return;
        var sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: 'BJEpvd77iMyYAyYabKtylPU1eOgTG2px0GeXTqECJnUcCYYeaX36MkyQk7NuqJD3LMNBK88PEvxopNbRYe-a6TA'
        });
        await fetch('/api/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-session-token': TOKEN },
          body: JSON.stringify({ subscription: sub })
        });
      } catch(e) { console.log('Push registreerimine ebaõnnestus:', e); }
    }

    init();
    setTimeout(registreeriPush, 2000);
  </script>
</body>
</html>

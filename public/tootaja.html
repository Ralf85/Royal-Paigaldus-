<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Paigaldus — Tööpäevik</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0f13;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── TOPBAR ── */
    .topbar {
      background: #13161c;
      border-bottom: 0.5px solid rgba(255,255,255,0.07);
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #c9a84c, #f0d080);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
    }
    .brand-name {
      font-size: 13px;
      font-weight: 700;
      color: #c9a84c;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    .brand-sub {
      font-size: 10px;
      color: #555;
      letter-spacing: 0.3px;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .worker-chip {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #252830;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: #999;
    }
    .worker-nimi {
      font-size: 13px;
      color: #bbb;
    }
    .logout-btn {
      font-size: 11px;
      color: #444;
      background: none;
      border: 0.5px solid #2a2a2a;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .logout-btn:hover { border-color: #ef4444; color: #ef4444; }

    /* ── LEHT ── */
    .leht { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }

    .kuu-pealkiri {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #3a3d45;
      margin-bottom: 10px;
    }

    /* ── TÖÖANDJA KAARDID ── */
    .employer-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .emp-card {
      border-radius: 12px;
      padding: 14px 10px 13px;
      cursor: pointer;
      text-align: center;
      border: 1.5px solid transparent;
      transition: transform 0.15s, border-color 0.2s;
      text-decoration: none;
    }
    .emp-card:hover { transform: translateY(-3px); }
    .emp-card:active { transform: scale(0.96); }

    /* LIDL */
    .emp-card.lidl { background: #002060; border-color: #003d99; }
    .emp-card.lidl:hover { border-color: #FFF200; }
    .emp-logo-lidl {
      width: 40px; height: 40px; border-radius: 50%;
      background: #FFF200; margin: 0 auto 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .emp-logo-lidl span { font-size: 10px; font-weight: 800; color: #0050AA; letter-spacing: 0.3px; }
    .emp-label-lidl { font-size: 12px; font-weight: 700; color: #FFF200; margin-bottom: 6px; }
    .emp-tunnid { font-size: 20px; font-weight: 700; color: #fff; line-height: 1; }
    .emp-tunnid-sub { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 3px; }

    /* CRAMO */
    .emp-card.cramo { background: #180604; border-color: #3a0d07; }
    .emp-card.cramo:hover { border-color: #CD2200; }
    .emp-logo-cramo {
      width: 40px; height: 40px; border-radius: 9px;
      background: #CD2200; margin: 0 auto 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .emp-logo-cramo span { font-size: 10px; font-weight: 800; color: #fff; }
    .emp-label-cramo { font-size: 12px; font-weight: 700; color: #ff6b50; margin-bottom: 6px; }

    /* MUU */
    .emp-card.muu { background: #0e1824; border-color: #1a2d40; }
    .emp-card.muu:hover { border-color: #38bdf8; }
    .emp-logo-muu {
      width: 40px; height: 40px; border-radius: 9px;
      background: #1a3550; margin: 0 auto 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .emp-logo-muu svg { width: 20px; height: 20px; stroke: #38bdf8; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .emp-label-muu { font-size: 12px; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }

    /* ── KAART (üldine) ── */
    .kaart {
      background: #13161c;
      border: 0.5px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .kaart-hdr {
      padding: 13px 16px 11px;
      border-bottom: 0.5px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .kaart-hdr-ikoon {
      width: 26px; height: 26px; border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .kaart-hdr-tekst { font-size: 13px; font-weight: 600; color: #d0d0d0; }
    .kaart-hdr-arv {
      margin-left: auto;
      font-size: 11px;
      color: #444;
      background: #1e2128;
      border-radius: 20px;
      padding: 2px 8px;
    }

    /* ── TULEVASED TÖÖD ── */
    .tulevane-rida {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 16px;
      border-bottom: 0.5px solid rgba(255,255,255,0.04);
      transition: background 0.1s;
    }
    .tulevane-rida:last-child { border-bottom: none; }
    .tulevane-rida:hover { background: rgba(255,255,255,0.02); }

    .tr-kast {
      min-width: 42px;
      background: #1e2128;
      border-radius: 9px;
      padding: 7px 4px;
      text-align: center;
    }
    .tr-paev { font-size: 17px; font-weight: 700; color: #fff; line-height: 1; }
    .tr-kuu { font-size: 9px; text-transform: uppercase; color: #555; margin-top: 2px; letter-spacing: 0.5px; }

    .tr-info { flex: 1; }
    .tr-firma-rida { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .tr-badge {
      font-size: 9px; font-weight: 800; letter-spacing: 0.5px;
      padding: 2px 6px; border-radius: 4px;
    }
    .badge-lidl { background: #FFF200; color: #002060; }
    .badge-cramo { background: #CD2200; color: #fff; }
    .badge-muu { background: #0369a1; color: #fff; }
    .tr-objekt { font-size: 13px; font-weight: 500; color: #e0e0e0; }
    .tr-kell { font-size: 11px; color: #505560; margin-top: 2px; }
    .tr-kirjeldus { font-size: 11px; color: #505560; margin-top: 3px; font-style: italic; }

    .tr-paevad { text-align: right; padding-top: 2px; }
    .tr-paevad-arv { font-size: 11px; color: #3a3d45; }
    .tr-paevad-txt { font-size: 9px; color: #2e3038; }

    .tyhi-olek { padding: 24px 16px; text-align: center; color: #3a3d45; font-size: 13px; }

    /* ── LAEKUMISED ── */
    .laek-kokkuvote {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: rgba(0,0,0,0.2);
      border-bottom: 0.5px solid rgba(255,255,255,0.05);
    }
    .laek-kv-item {
      padding: 13px 12px;
      text-align: center;
      border-right: 0.5px solid rgba(255,255,255,0.05);
    }
    .laek-kv-item:last-child { border-right: none; }
    .laek-kv-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #444; margin-bottom: 5px; }
    .laek-kv-val { font-size: 17px; font-weight: 700; }
    .v-roheline { color: #4ade80; }
    .v-hall { color: #666; }
    .v-kollane { color: #fbbf24; }

    .laekumine-rida {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 16px;
      border-bottom: 0.5px solid rgba(255,255,255,0.04);
    }
    .laekumine-rida:last-child { border-bottom: none; }
    .lr-vasak { display: flex; align-items: center; gap: 10px; }
    .lr-ikoon {
      width: 30px; height: 30px; border-radius: 50%;
      background: #0f2d1a;
      border: 0.5px solid #1a4d2a;
      display: flex; align-items: center; justify-content: center;
    }
    .lr-ikoon svg { width: 14px; height: 14px; stroke: #4ade80; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .lr-kuupaev { font-size: 13px; color: #c0c0c0; }
    .lr-komm { font-size: 11px; color: #505560; margin-top: 1px; }
    .lr-summa { font-size: 15px; font-weight: 700; color: #4ade80; }

    /* kuu filter */
    .kuu-filter {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .kuu-filter::-webkit-scrollbar { display: none; }
    .kf-nupp {
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      border: 0.5px solid #252830;
      color: #555;
      background: none;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .kf-nupp.ak {
      background: #c9a84c;
      border-color: #c9a84c;
      color: #0d0f13;
      font-weight: 600;
    }
    .kf-nupp:hover:not(.ak) { border-color: #444; color: #aaa; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-logo">👑</div>
    <div class="brand-text">
      <div class="brand-name">ROYAL PAIGALDUS</div>
      <div class="brand-sub">Tööpäevik</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="worker-chip">
      <div class="avatar" id="avatarInitsiaalid">—</div>
      <span class="worker-nimi" id="workerNimiTop">...</span>
    </div>
    <button class="logout-btn" onclick="välju()">Välja</button>
  </div>
</div>

<div class="leht">

  <!-- Kuu filter -->
  <div class="kuu-filter" id="kuuFilter"></div>

  <!-- Tööandjad -->
  <div class="kuu-pealkiri" id="kuuPealkiri">Juuni tööd</div>
  <div class="employer-grid">
    <a class="emp-card lidl" href="/tootaja-lidl">
      <div class="emp-logo-lidl"><span>LIDL</span></div>
      <div class="emp-label-lidl">LIDL</div>
      <div class="emp-tunnid" id="lidl-tunnid">—</div>
      <div class="emp-tunnid-sub">sellel kuul</div>
    </a>
    <a class="emp-card cramo" href="/tootaja-cramo">
      <div class="emp-logo-cramo"><span>CRAMO</span></div>
      <div class="emp-label-cramo">CRAMO</div>
      <div class="emp-tunnid" id="cramo-tunnid">—</div>
      <div class="emp-tunnid-sub">sellel kuul</div>
    </a>
    <a class="emp-card muu" href="/tootaja-muu">
      <div class="emp-logo-muu">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
      </div>
      <div class="emp-label-muu">MUU</div>
      <div class="emp-tunnid" id="muu-tunnid">—</div>
      <div class="emp-tunnid-sub">sellel kuul</div>
    </a>
  </div>

  <!-- Tulevased tööd -->
  <div class="kaart">
    <div class="kaart-hdr">
      <div class="kaart-hdr-ikoon" style="background:#1a2535">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      </div>
      <span class="kaart-hdr-tekst">Tulevased tööd</span>
      <span class="kaart-hdr-arv" id="tulevaste-arv">0</span>
    </div>
    <div id="tulevasteToodSisu">
      <div class="tyhi-olek">Tulevasi töid pole kirjas</div>
    </div>
  </div>

  <!-- Laekumised -->
  <div class="kaart">
    <div class="kaart-hdr">
      <div class="kaart-hdr-ikoon" style="background:#0f2d1a">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
      </div>
      <span class="kaart-hdr-tekst">Laekumised</span>
      <span class="kaart-hdr-arv" id="laekumiste-kuu">—</span>
    </div>
    <div class="laek-kokkuvote">
      <div class="laek-kv-item">
        <div class="laek-kv-label">Teenitud</div>
        <div class="laek-kv-val v-roheline" id="kv-teenitud">—</div>
      </div>
      <div class="laek-kv-item">
        <div class="laek-kv-label">Makstud</div>
        <div class="laek-kv-val v-hall" id="kv-makstud">—</div>
      </div>
      <div class="laek-kv-item">
        <div class="laek-kv-label">Ootel</div>
        <div class="laek-kv-val v-kollane" id="kv-ootel">—</div>
      </div>
    </div>
    <div id="laekumisteSisu">
      <div class="tyhi-olek">Laekumisi pole kirjas</div>
    </div>
  </div>

</div>

<script>
  const KUUD = ['Jaanuar','Veebruar','Märts','Aprill','Mai','Juuni','Juuli','August','September','Oktoober','November','Detsember'];
  const KUUD_LYHIKE = ['jaan','veeb','märts','apr','mai','juu','juul','aug','sept','okt','nov','dets'];
  let aktiivsKuu, aktiivsAasta, workerId;

  async function init() {
    const s = await fetch('/api/auth/sessioon').then(r => r.json());
    if (!s.sisselogitud || s.isAdmin) { window.location = '/'; return; }
    workerId = s.workerId;

    // Initsiaalid
    const initsiaalid = s.nimi.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2);
    document.getElementById('avatarInitsiaalid').textContent = initsiaalid;
    document.getElementById('workerNimiTop').textContent = s.nimi;

    const t = new Date();
    aktiivsKuu = t.getMonth() + 1;
    aktiivsAasta = t.getFullYear();

    ehitaKuuFilter(t);
    await laadiKoik();
  }

  function ehitaKuuFilter(t) {
    const filter = document.getElementById('kuuFilter');
    // Näita 3 eelmist + praegune + 2 tulevast
    for (let i = -3; i <= 2; i++) {
      let kuu = t.getMonth() + i;
      let aasta = t.getFullYear();
      if (kuu < 0) { kuu += 12; aasta--; }
      if (kuu >= 12) { kuu -= 12; aasta++; }
      const btn = document.createElement('button');
      btn.className = 'kf-nupp' + (i === 0 ? ' ak' : '');
      btn.textContent = KUUD[kuu].slice(0,3) + ' ' + aasta;
      btn.dataset.kuu = kuu + 1;
      btn.dataset.aasta = aasta;
      btn.onclick = () => {
        document.querySelectorAll('.kf-nupp').forEach(b => b.classList.remove('ak'));
        btn.classList.add('ak');
        aktiivsKuu = parseInt(btn.dataset.kuu);
        aktiivsAasta = parseInt(btn.dataset.aasta);
        laadiKoik();
      };
      filter.appendChild(btn);
    }
  }

  async function laadiKoik() {
    document.getElementById('kuuPealkiri').textContent = KUUD[aktiivsKuu - 1] + ' tööd';
    document.getElementById('laekumiste-kuu').textContent = KUUD[aktiivsKuu - 1];
    await Promise.all([laadiTunnid(), laadiTulevasedTood(), laadiLaekumised()]);
  }

  async function laadiTunnid() {
    const d = await fetch(`/api/tood/kokkuvote?aasta=${aktiivsAasta}&kuu=${aktiivsKuu}`).then(r => r.json());
    if (!d.ok) return;

    // Jaga firma kaupa
    const firma = { lidl: 0, cramo: 0, muu: 0 };
    d.kirjed.forEach(k => {
      const nimi = (k.objekt_firma || '').toLowerCase();
      if (nimi === 'lidl') firma.lidl += parseFloat(k.tunnid);
      else if (nimi === 'cramo') firma.cramo += parseFloat(k.tunnid);
      else firma.muu += parseFloat(k.tunnid);
    });
    document.getElementById('lidl-tunnid').textContent = firma.lidl > 0 ? firma.lidl.toFixed(1) + ' h' : '0 h';
    document.getElementById('cramo-tunnid').textContent = firma.cramo > 0 ? firma.cramo.toFixed(1) + ' h' : '0 h';
    document.getElementById('muu-tunnid').textContent = firma.muu > 0 ? firma.muu.toFixed(1) + ' h' : '0 h';

    document.getElementById('kv-teenitud').textContent = parseFloat(d.teenitud).toFixed(0) + ' €';
    document.getElementById('kv-makstud').textContent = parseFloat(d.makstud).toFixed(0) + ' €';
    const ootel = parseFloat(d.saadaVeel);
    document.getElementById('kv-ootel').textContent = (ootel > 0 ? '+' : '') + ootel.toFixed(0) + ' €';
    document.getElementById('kv-ootel').style.color = ootel > 0 ? '#fbbf24' : '#4ade80';
  }

  async function laadiTulevasedTood() {
    const andmed = await fetch(`/api/tood/tulevased`).then(r => r.json());
    const div = document.getElementById('tulevasteToodSisu');
    document.getElementById('tulevaste-arv').textContent = andmed.length;

    if (andmed.length === 0) {
      div.innerHTML = '<div class="tyhi-olek">Tulevasi töid pole kirjas</div>';
      return;
    }

    const taana = new Date();
    taana.setHours(0,0,0,0);

    div.innerHTML = andmed.map(t => {
      const d = new Date(t.kuupaev);
      const paevJaani = Math.ceil((d - taana) / 86400000);
      const firma = (t.firma || 'muu').toLowerCase();
      const badgeKlass = firma === 'lidl' ? 'badge-lidl' : firma === 'cramo' ? 'badge-cramo' : 'badge-muu';
      return `
        <div class="tulevane-rida">
          <div class="tr-kast">
            <div class="tr-paev">${d.getDate()}</div>
            <div class="tr-kuu">${KUUD_LYHIKE[d.getMonth()]}</div>
          </div>
          <div class="tr-info">
            <div class="tr-firma-rida">
              <span class="tr-badge ${badgeKlass}">${(t.firma||'MUU').toUpperCase()}</span>
              <span class="tr-objekt">${t.objekt || ''}</span>
            </div>
            <div class="tr-kell">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:-1px;margin-right:3px"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
              ${t.algus_kell || '—'}${t.lopp_kell ? ' – ' + t.lopp_kell : ''}
            </div>
            ${t.kirjeldus ? `<div class="tr-kirjeldus">${t.kirjeldus}</div>` : ''}
          </div>
          <div class="tr-paevad">
            <div class="tr-paevad-arv">${paevJaani > 0 ? paevJaani + 'p' : 'täna'}</div>
            <div class="tr-paevad-txt">${paevJaani > 0 ? 'jäänud' : ''}</div>
          </div>
        </div>`;
    }).join('');
  }

  async function laadiLaekumised() {
    const andmed = await fetch(`/api/admin/maksed?worker_id=self&aasta=${aktiivsAasta}&kuu=${aktiivsKuu}`).then(r => r.json());
    const div = document.getElementById('laekumisteSisu');

    if (!Array.isArray(andmed) || andmed.length === 0) {
      div.innerHTML = '<div class="tyhi-olek">Selle kuu laekumisi pole</div>';
      return;
    }

    div.innerHTML = andmed.map(m => {
      const d = new Date(m.kuupaev);
      const kuupaevTekst = d.getDate() + '. ' + KUUD[d.getMonth()] + ' ' + d.getFullYear();
      return `
        <div class="laekumine-rida">
          <div class="lr-vasak">
            <div class="lr-ikoon">
              <svg viewBox="0 0 24 24"><polyline points="17 11 12 6 7 11"/><line x1="12" y1="18" x2="12" y2="6"/></svg>
            </div>
            <div>
              <div class="lr-kuupaev">${kuupaevTekst}</div>
              ${m.kommentaar ? `<div class="lr-komm">${m.kommentaar}</div>` : ''}
            </div>
          </div>
          <div class="lr-summa">+${parseFloat(m.summa).toFixed(0)} €</div>
        </div>`;
    }).join('');
  }

  async function välju() {
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location = '/';
  }

  init();
</script>
</body>
</html>

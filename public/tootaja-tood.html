<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Töökirjed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d0f13; color: #e2e8f0; min-height: 100vh; }
    .topbar { background: #13161c; border-bottom: 0.5px solid rgba(255,255,255,0.07); padding: 0 20px; height: 56px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 100; }
    .topbar-back { background: none; border: 0.5px solid #252830; border-radius: 8px; color: #aaa; font-size: 13px; padding: 6px 12px; cursor: pointer; }
    .topbar-back:hover { border-color: #c9a84c; color: #c9a84c; }
    .topbar-title { font-size: 14px; font-weight: 600; color: #e2e8f0; }
    .topbar-badge { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 4px; }
    .badge-lidl { background: #FFF200; color: #002060; }
    .badge-cramo { background: #CD2200; color: #fff; }
    .badge-muu { background: #0369a1; color: #fff; }
    .badge-merekohvik { background: #065f46; color: #4ade80; }

    .leht { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }

    /* Teade ülaosas */
    .teade-top { display: none; position: sticky; top: 56px; z-index: 90; padding: 12px 16px; font-size: 14px; font-weight: 600; text-align: center; }
    .teade-top.ok { background: #14532d; color: #4ade80; border-bottom: 2px solid #4ade80; }
    .teade-top.viga { background: #7f1d1d; color: #fca5a5; border-bottom: 2px solid #ef4444; }

    .lisa-kaart { background: #13161c; border: 0.5px solid rgba(255,255,255,0.06); border-radius: 14px; overflow: hidden; margin-bottom: 20px; }
    .lisa-hdr { padding: 13px 16px; border-bottom: 0.5px solid rgba(255,255,255,0.05); font-size: 13px; font-weight: 600; color: #d0d0d0; }
    .lisa-body { padding: 14px 16px; }
    .vorm-rida { display: grid; gap: 10px; margin-bottom: 12px; }
    .vorm-rida.col2 { grid-template-columns: 1fr 1fr; }
    .vorm-grupp label { font-size: 11px; color: #555; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.8px; }
    .vorm-grupp input, .vorm-grupp select, .vorm-grupp textarea { width: 100%; background: #0d0f13; border: 0.5px solid #252830; border-radius: 8px; padding: 9px 11px; color: #e2e8f0; font-size: 14px; font-family: inherit; }
    .vorm-grupp input:focus, .vorm-grupp select:focus { outline: none; border-color: #c9a84c; }
    .vorm-grupp select option { background: #0d0f13; }

    /* Kirjelduse valik */
    .kirjeldus-valik { display: flex; flex-direction: column; gap: 6px; }
    .kirjeldus-select { width: 100%; background: #0d0f13; border: 0.5px solid #252830; border-radius: 8px; padding: 9px 11px; color: #e2e8f0; font-size: 14px; font-family: inherit; }
    .kirjeldus-select:focus { outline: none; border-color: #c9a84c; }
    .kirjeldus-vaba { width: 100%; background: #0d0f13; border: 0.5px solid #252830; border-radius: 8px; padding: 9px 11px; color: #e2e8f0; font-size: 14px; font-family: inherit; display: none; }
    .kirjeldus-vaba:focus { outline: none; border-color: #c9a84c; }
    .kirjeldus-vaba.nahtav { display: block; }

    /* Foto ala */
    .foto-ala { background: #0a0c10; border: 1.5px dashed #252830; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .foto-nupud { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .foto-nupp { background: #13161c; border: 0.5px solid #252830; border-radius: 8px; padding: 10px; color: #aaa; font-size: 13px; text-align: center; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .foto-nupp:hover { border-color: #c9a84c; color: #c9a84c; }
    .foto-nupp input { display: none; }
    .foto-eelvaade { display: none; }
    .foto-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 6px; }
    .foto-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 5px; }
    .foto-info { font-size: 11px; color: #555; }

    /* Progress */
    .progress-ala { display: none; background: #0d0f13; border: 0.5px solid #252830; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .progress-tekst { font-size: 13px; color: #c9a84c; margin-bottom: 8px; text-align: center; }
    .progress-riba-taust { background: #1e2128; border-radius: 4px; height: 6px; overflow: hidden; }
    .progress-riba { background: #c9a84c; height: 100%; border-radius: 4px; transition: width 0.3s; width: 0%; }

    /* Salvesta nupp */
    .salvesta-nupp { width: 100%; background: #c9a84c; color: #0d0f13; border: none; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .salvesta-nupp:hover:not(:disabled) { background: #e0b84e; }
    .salvesta-nupp:disabled { opacity: 0.6; cursor: not-allowed; }
    .salvesta-nupp.laadib { background: #1a3550; color: #5b9cf6; }
    .salvesta-nupp.valmis { background: #14532d; color: #4ade80; }

    /* Kirjed */
    .kirjed-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .kirjed-pealkiri { font-size: 13px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    .kirjed-kokku { font-size: 13px; color: #c9a84c; font-weight: 700; }
    .kirje-kaart { background: #13161c; border: 0.5px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 13px 14px; margin-bottom: 10px; }
    .kirje-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .kirje-kp { min-width: 42px; background: #1e2128; border-radius: 8px; padding: 6px 4px; text-align: center; }
    .kirje-kp-paev { font-size: 17px; font-weight: 700; color: #fff; line-height: 1; }
    .kirje-kp-kuu { font-size: 9px; text-transform: uppercase; color: #555; margin-top: 2px; }
    .kirje-info { flex: 1; }
    .kirje-objekt { font-size: 13px; color: #d0d0d0; font-weight: 500; }
    .kirje-aeg { font-size: 11px; color: #505560; margin-top: 2px; }
    .kirje-tunnid { font-size: 17px; font-weight: 700; color: #c9a84c; }
    .kirje-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .kirje-tag { font-size: 11px; background: #1e2128; border-radius: 4px; padding: 3px 8px; color: #666; }
    .kirje-tag.km { color: #60a5fa; }
    .kirje-tag.lisakulu { color: #fb923c; }
    .kirje-tag.komm { color: #888; font-style: italic; }
    .kirje-tag.kirjeldus { color: #a78bfa; }
    .kirje-pildid { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
    .kirje-pilt { width: 48px; height: 48px; object-fit: cover; border-radius: 5px; cursor: pointer; border: 0.5px solid #252830; }
    .kirje-actions { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 0.5px solid rgba(255,255,255,0.04); }
    .muuda-nupp { flex: 1; background: #1a2840; border: 0.5px solid #1e3a5f; border-radius: 8px; padding: 7px; font-size: 12px; color: #60a5fa; cursor: pointer; font-weight: 600; }
    .kustuta-nupp { background: #1a0a0a; border: 0.5px solid #3d0a0a; border-radius: 8px; padding: 7px 14px; font-size: 12px; color: #ef4444; cursor: pointer; font-weight: 600; }
    .tyhi { padding: 40px 20px; text-align: center; color: #3a3d45; font-size: 13px; }

    /* Muutmise modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); z-index: 200; align-items: flex-start; justify-content: center; padding: 20px 16px; overflow-y: auto; }
    .modal-overlay.avatud { display: flex; }
    .modal-sisu { background: #13161c; border: 0.5px solid rgba(255,255,255,0.08); border-radius: 16px; width: 100%; max-width: 520px; overflow: hidden; margin-top: 20px; padding: 20px; }
    .modal-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-hdr-tekst { font-size: 15px; font-weight: 700; color: #e2e8f0; }
    .modal-sulge { background: none; border: none; color: #555; font-size: 22px; cursor: pointer; }
    .salvesta-nupp-modal { width: 100%; background: #c9a84c; color: #0d0f13; border: none; border-radius: 8px; padding: 11px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px; }
    .modal-teade { font-size: 12px; margin-top: 8px; display: none; padding: 8px; border-radius: 6px; }
    .modal-teade.viga { background: #7f1d1d; color: #fca5a5; }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="topbar-back" onclick="history.back()">← Tagasi</button>
    <span class="topbar-badge" id="ettevoteBadge"></span>
    <span class="topbar-title" id="ettevoteNimi">Töökirjed</span>
  </div>

  <!-- Teade ülaosas -->
  <div class="teade-top" id="teadeTop"></div>

  <!-- Muutmise modal -->
  <div class="modal-overlay" id="muutaModal">
    <div class="modal-sisu">
      <div class="modal-hdr">
        <span class="modal-hdr-tekst">✏️ Muuda töökirjet</span>
        <button class="modal-sulge" onclick="sulgeModal()">✕</button>
      </div>
      <input type="hidden" id="muuta-id">
      <div class="vorm-rida col2">
        <div class="vorm-grupp"><label>Kuupäev</label><input type="date" id="muuta-kuupaev" style="color-scheme:dark"></div>
        <div class="vorm-grupp"><label>Objekt</label><input type="text" id="muuta-objekt" readonly style="color:#555"></div>
      </div>
      <div class="vorm-rida col2">
        <div class="vorm-grupp"><label>Algus</label><input type="time" id="muuta-algus"></div>
        <div class="vorm-grupp"><label>Lõpp</label><input type="time" id="muuta-lopp"></div>
      </div>
      <div class="vorm-rida col2">
        <div class="vorm-grupp"><label>Kilomeetrid</label><input type="number" id="muuta-km" placeholder="0" min="0" step="1"></div>
        <div class="vorm-grupp"><label>Lisakulu (€)</label><input type="number" id="muuta-lisakulu" placeholder="0.00" min="0" step="0.01"></div>
      </div>
      <div class="vorm-rida">
        <div class="vorm-grupp"><label>Lisakulu selgitus</label><input type="text" id="muuta-lisakulu-sel" placeholder="nt. sõidukulud"></div>
      </div>
      <div class="vorm-rida">
        <div class="vorm-grupp"><label>Kommentaar</label><input type="text" id="muuta-komm" placeholder="vabatahtlik"></div>
      </div>
      <button class="salvesta-nupp-modal" onclick="salvestaMuutus()">Salvesta muutused</button>
      <div class="modal-teade" id="muuta-teade"></div>
    </div>
  </div>

  <div class="leht">
    <!-- Lisa uus kirje -->
    <div class="lisa-kaart">
      <div class="lisa-hdr">➕ Lisa töökirje</div>
      <div class="lisa-body">
        <div class="vorm-rida col2">
          <div class="vorm-grupp">
            <label>Kuupäev</label>
            <input type="date" id="kuupaev" style="color-scheme:dark">
          </div>
          <div class="vorm-grupp" id="objekt-grupp" style="display:none">
            <label>Objekt</label>
            <select id="objekt"><option value="">— Vali objekt —</option></select>
          </div>
        </div>
        <div class="vorm-rida col2">
          <div class="vorm-grupp"><label>Algus</label><input type="time" id="algus" value="08:00"></div>
          <div class="vorm-grupp"><label>Lõpp</label><input type="time" id="lopp" value="17:00"></div>
        </div>

        <!-- Kirjeldus rippmenüü + vaba tekst -->
        <div class="vorm-rida">
          <div class="vorm-grupp">
            <label>Kirjeldus</label>
            <div class="kirjeldus-valik">
              <select class="kirjeldus-select" id="kirjeldus-select" onchange="kirjeldusVahetud()">
                <option value="">— Vali kirjeldus —</option>
              </select>
              <input type="text" class="kirjeldus-vaba" id="kirjeldus-vaba" placeholder="Kirjuta ise...">
            </div>
          </div>
        </div>

        <div class="vorm-rida col2">
          <div class="vorm-grupp"><label>Kilomeetrid</label><input type="number" id="km" placeholder="0" min="0" step="1" value="0"></div>
          <div class="vorm-grupp"><label>Lisakulu (€)</label><input type="number" id="lisakulu" placeholder="0.00" min="0" step="0.01" value="0"></div>
        </div>
        <div class="vorm-rida" id="lisakulu-sel-rida" style="display:none">
          <div class="vorm-grupp"><label>Lisakulu selgitus</label><input type="text" id="lisakulu-sel" placeholder="nt. sõidukulud, tööriistad..."></div>
        </div>

        <!-- Fotod -->
        <div class="foto-ala">
          <div class="foto-nupud">
            <label class="foto-nupp">
              📷 Kaamera
              <input type="file" id="foto-kaamera" accept="image/*" capture="environment" multiple>
            </label>
            <label class="foto-nupp">
              🖼️ Album (kuni 12)
              <input type="file" id="foto-album" accept="image/*" multiple>
            </label>
          </div>
          <div class="foto-eelvaade" id="foto-eelvaade">
            <div class="foto-grid" id="foto-grid"></div>
            <div class="foto-info" id="foto-info"></div>
          </div>
        </div>

        <!-- Progress -->
        <div class="progress-ala" id="progress-ala">
          <div class="progress-tekst" id="progress-tekst">Salvestab...</div>
          <div class="progress-riba-taust"><div class="progress-riba" id="progress-riba"></div></div>
        </div>

        <button class="salvesta-nupp" id="salvesta-nupp" onclick="lisaKirje()">Salvesta kirje</button>
      </div>
    </div>

    <!-- Kirjete nimekiri -->
    <div class="kirjed-hdr">
      <span class="kirjed-pealkiri">Selle kuu kirjed</span>
      <span class="kirjed-kokku" id="kirjed-kokku"></span>
    </div>
    <div id="kirjed-sisu"><div class="tyhi">Laadimine...</div></div>
  </div>

  <script>
    var KUUD_L = ['jaan','veeb','märts','apr','mai','juu','juul','aug','sept','okt','nov','dets'];
    var TOKEN = localStorage.getItem('workerToken') || '';
    var ettevoteId = null;
    var etteVoteTyyp = '';
    var valitudFotod = [];
    var salvestamine = false;

    function api(url, opts) {
      opts = opts || {};
      opts.headers = opts.headers || {};
      opts.headers['x-session-token'] = TOKEN;
      if (!(opts.body instanceof FormData)) opts.headers['Content-Type'] = 'application/json';
      return fetch(url, opts).then(function(r) { return r.json(); });
    }

    function naitaTeade(tekst, tyyp) {
      var el = document.getElementById('teadeTop');
      el.textContent = tekst;
      el.className = 'teade-top ' + tyyp;
      el.style.display = 'block';
      setTimeout(function() { el.style.display = 'none'; }, 6000);
    }

    function setProgress(tekst, protsent) {
      var ala = document.getElementById('progress-ala');
      var t = document.getElementById('progress-tekst');
      var r = document.getElementById('progress-riba');
      if (protsent === null) {
        ala.style.display = 'none';
      } else {
        ala.style.display = 'block';
        t.textContent = tekst;
        r.style.width = protsent + '%';
      }
    }

    async function init() {
      if (!TOKEN) { window.location = '/'; return; }
      var s = await api('/api/auth/sessioon');
      if (!s.sisselogitud || s.isAdmin) { window.location = '/'; return; }

      var params = new URLSearchParams(window.location.search);
      ettevoteId = params.get('ettevote');
      if (!ettevoteId) { window.location = '/tootaja'; return; }

      var t = new Date();
      document.getElementById('kuupaev').value = t.toISOString().split('T')[0];

      // Lae ettevõte info
      var ettevotted = await api('/api/tood/minu-ettevotted');
      var ettevote = ettevotted.find(function(e) { return String(e.id) === String(ettevoteId); });
      if (!ettevote) { window.location = '/tootaja'; return; }

      etteVoteTyyp = (ettevote.tyyp || 'muu').toLowerCase();
      document.getElementById('ettevoteNimi').textContent = ettevote.nimi;
      var badge = document.getElementById('ettevoteBadge');
      badge.textContent = ettevote.nimi;
      badge.className = 'topbar-badge badge-' + etteVoteTyyp;

      // Lae objektid
      var objektid = await api('/api/tood/objektid/' + ettevoteId);
      if (Array.isArray(objektid) && objektid.length) {
        var sel = document.getElementById('objekt');
        objektid.forEach(function(o) {
          var opt = document.createElement('option');
          opt.value = o.id; opt.textContent = o.nimi;
          sel.appendChild(opt);
        });
        document.getElementById('objekt-grupp').style.display = 'block';

        // Cramo default objekt
        if (etteVoteTyyp === 'cramo') {
          Array.from(sel.options).forEach(function(opt) {
            if (opt.textContent.toLowerCase().includes('soojakute')) {
              sel.value = opt.value;
            }
          });
        }
      }

      // Lae kirjeldused tulevaste tööde põhjal
      await laadiKirjeldused();

      // Lisakulu
      document.getElementById('lisakulu').addEventListener('input', function() {
        document.getElementById('lisakulu-sel-rida').style.display = parseFloat(this.value) > 0 ? 'block' : 'none';
      });

      // Fotod
      document.getElementById('foto-kaamera').addEventListener('change', function() { lisaFotod(this.files); });
      document.getElementById('foto-album').addEventListener('change', function() { lisaFotod(this.files); });

      await laadiKirjed();
    }

    async function laadiKirjeldused() {
      try {
        var tulevased = await api('/api/tood/tulevased');
        var sel = document.getElementById('kirjeldus-select');
        
        // Kogu unikaalsed kirjeldused
        var kirjeldused = [];
        if (Array.isArray(tulevased)) {
          tulevased.forEach(function(t) {
            if (t.ettevote_id == ettevoteId && t.kirjeldus && !kirjeldused.includes(t.kirjeldus)) {
              kirjeldused.push(t.kirjeldus);
            }
          });
        }

        if (kirjeldused.length) {
          kirjeldused.forEach(function(k) {
            var opt = document.createElement('option');
            opt.value = k; opt.textContent = k;
            sel.appendChild(opt);
          });
        }

        // Lisa "Muu - kirjuta ise" valik alati
        var muuOpt = document.createElement('option');
        muuOpt.value = '__muu__'; muuOpt.textContent = '✏️ Muu — kirjuta ise';
        sel.appendChild(muuOpt);
      } catch(e) {
        console.error('Kirjelduste laadimine ebaõnnestus:', e);
      }
    }

    function kirjeldusVahetud() {
      var sel = document.getElementById('kirjeldus-select');
      var vaba = document.getElementById('kirjeldus-vaba');
      if (sel.value === '__muu__') {
        vaba.classList.add('nahtav');
        vaba.focus();
      } else {
        vaba.classList.remove('nahtav');
        vaba.value = '';
      }
    }

    function getKirjeldus() {
      var sel = document.getElementById('kirjeldus-select');
      var vaba = document.getElementById('kirjeldus-vaba');
      if (sel.value === '__muu__') return vaba.value;
      return sel.value;
    }

    // ── FOTOD ────────────────────────────────────────────────
    function lisaFotod(files) {
      var uued = Array.from(files).slice(0, 12 - valitudFotod.length);
      valitudFotod = valitudFotod.concat(uued).slice(0, 12);
      uuendaFotoEelvaade();
    }

    function uuendaFotoEelvaade() {
      var grid = document.getElementById('foto-grid');
      var info = document.getElementById('foto-info');
      var eelvaade = document.getElementById('foto-eelvaade');

      if (!valitudFotod.length) {
        eelvaade.style.display = 'none';
        return;
      }

      eelvaade.style.display = 'block';
      grid.innerHTML = '';
      info.textContent = valitudFotod.length + ' pilti valitud';

      valitudFotod.forEach(function(file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = document.createElement('img');
          img.src = e.target.result;
          grid.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    }

    async function kompresseeriFoto(file) {
      return new Promise(function(resolve) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = new Image();
          img.onload = function() {
            var canvas = document.createElement('canvas');
            var maxSize = 1600;
            var w = img.width, h = img.height;
            if (w > maxSize || h > maxSize) {
              if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
              else { w = Math.round(w * maxSize / h); h = maxSize; }
            }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            canvas.toBlob(function(blob) {
              resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' }));
            }, 'image/jpeg', 0.80);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // ── SALVESTA ─────────────────────────────────────────────
    async function lisaKirje() {
      if (salvestamine) return;

      var kuupaev = document.getElementById('kuupaev').value;
      var algus = document.getElementById('algus').value;
      var lopp = document.getElementById('lopp').value;
      var km = document.getElementById('km').value || '0';
      var lisakulu = document.getElementById('lisakulu').value || '0';
      var lisakulu_sel = document.getElementById('lisakulu-sel').value;
      var objekt_id = document.getElementById('objekt').value || null;
      var kirjeldus = getKirjeldus();

      if (!kuupaev || !algus || !lopp) {
        naitaTeade('❌ Täida kuupäev, algus ja lõpp!', 'viga');
        return;
      }

      salvestamine = true;
      var nupp = document.getElementById('salvesta-nupp');
      nupp.disabled = true;
      nupp.className = 'salvesta-nupp laadib';
      nupp.textContent = '⏳ Salvestab...';
      setProgress('Salvestab töökirjet...', 10);

      try {
        var r = await api('/api/tood/lisa', {
          method: 'POST',
          body: JSON.stringify({
            ettevote_id: ettevoteId, objekt_id: objekt_id,
            kuupaev: kuupaev, algus: algus, lopp: lopp,
            kommentaar: kirjeldus,
            kilomeetrid: km, lisakulu_summa: lisakulu, lisakulu_selgitus: lisakulu_sel
          })
        });

        if (!r.ok) {
          naitaTeade('❌ ' + (r.veateade || 'Viga salvestamisel'), 'viga');
          setProgress(null, null);
          salvestamine = false;
          nupp.disabled = false;
          nupp.className = 'salvesta-nupp';
          nupp.textContent = 'Salvesta kirje';
          return;
        }

        setProgress('Töökirje salvestatud! (' + r.tunnid + 'h)', 30);

        // Lae fotod üles
        var fotodKoopia = valitudFotod.slice();
        valitudFotod = [];
        document.getElementById('foto-kaamera').value = '';
        document.getElementById('foto-album').value = '';
        document.getElementById('foto-eelvaade').style.display = 'none';
        document.getElementById('foto-grid').innerHTML = '';

        if (fotodKoopia.length && r.kirjeId) {
          var kokku = fotodKoopia.length;
          for (var i = 0; i < kokku; i++) {
            nupp.textContent = '📷 ' + (i+1) + '/' + kokku + ' pilti...';
            setProgress('Laadin pilti ' + (i+1) + '/' + kokku + '...', 30 + Math.round(70 * i / kokku));

            try {
              var kompressitud = await kompresseeriFoto(fotodKoopia[i]);
              var fd = new FormData();
              fd.append('kirje_id', r.kirjeId);
              fd.append('pildid', kompressitud);
              var piltR = await fetch('/api/pildid/lisa', {
                method: 'POST',
                headers: { 'x-session-token': TOKEN },
                body: fd
              });
              if (!piltR.ok) {
                console.error('Pildi laadimine ebaõnnestus:', i+1);
              }
            } catch(e) {
              console.error('Pildi viga:', e);
            }
          }
        }

        setProgress('✅ Kõik salvestatud!', 100);

        // Puhasta vorm
        document.getElementById('km').value = '0';
        document.getElementById('lisakulu').value = '0';
        document.getElementById('lisakulu-sel').value = '';
        document.getElementById('lisakulu-sel-rida').style.display = 'none';
        document.getElementById('kirjeldus-select').value = '';
        document.getElementById('kirjeldus-vaba').value = '';
        document.getElementById('kirjeldus-vaba').classList.remove('nahtav');

        var teadeTekst = '✅ Salvestatud! ' + r.tunnid + 'h';
        if (fotodKoopia.length) teadeTekst += ' · ' + fotodKoopia.length + ' pilti lisatud';
        if (r.lounaPaus) teadeTekst += ' · lõunapaus arvestatud';

        naitaTeade(teadeTekst, 'ok');
        window.scrollTo({ top: 0, behavior: 'smooth' });

        nupp.className = 'salvesta-nupp valmis';
        nupp.textContent = '✅ Salvestatud!';

        await laadiKirjed();

        setTimeout(function() {
          setProgress(null, null);
          nupp.disabled = false;
          nupp.className = 'salvesta-nupp';
          nupp.textContent = 'Salvesta kirje';
          salvestamine = false;
        }, 2000);

      } catch(e) {
        console.error('Salvesta viga:', e);
        naitaTeade('❌ Viga: ' + e.message, 'viga');
        setProgress(null, null);
        salvestamine = false;
        nupp.disabled = false;
        nupp.className = 'salvesta-nupp';
        nupp.textContent = 'Salvesta kirje';
      }
    }

    // ── KIRJED ───────────────────────────────────────────────
    async function laadiKirjed() {
      var t = new Date();
      var vastus = await api('/api/tood/kokkuvote?aasta=' + t.getFullYear() + '&kuu=' + (t.getMonth()+1));
      var div = document.getElementById('kirjed-sisu');
      var kirjedEl = document.getElementById('kirjed-kokku');

      if (!vastus.ok || !vastus.kirjed) {
        div.innerHTML = '<div class="tyhi">Selle kuu kirjeid pole</div>';
        kirjedEl.textContent = '';
        return;
      }

      var kirjed = vastus.kirjed.filter(function(k) { return String(k.ettevote_id) === String(ettevoteId); });
      if (!kirjed.length) {
        div.innerHTML = '<div class="tyhi">Selle kuu kirjeid pole</div>';
        kirjedEl.textContent = '';
        return;
      }

      var kokku = kirjed.reduce(function(s, k) { return s + parseFloat(k.tunnid); }, 0);
      kirjedEl.textContent = kokku.toFixed(1) + ' h kokku';

      // Lae pildid
      var ids = kirjed.map(function(k) { return k.id; }).join(',');
      var pildidMap = {};
      try {
        var pr = await api('/api/pildid/batch?ids=' + ids);
        if (pr.ok && pr.pildid) {
          pr.pildid.forEach(function(p) {
            if (!pildidMap[p.tookirje_id]) pildidMap[p.tookirje_id] = [];
            pildidMap[p.tookirje_id].push(p);
          });
        }
      } catch(e) {}

      div.innerHTML = kirjed.map(function(k) {
        var d = new Date(k.kuupaev);
        var km = parseFloat(k.kilomeetrid || 0);
        var lisakulu = parseFloat(k.lisakulu_summa || 0);
        var tags = '';
        if (km > 0) tags += '<span class="kirje-tag km">🚗 ' + km + 'km</span>';
        if (lisakulu > 0) tags += '<span class="kirje-tag lisakulu">💸 ' + lisakulu.toFixed(2) + '€</span>';
        if (k.kommentaar) tags += '<span class="kirje-tag kirjeldus">' + k.kommentaar + '</span>';

        var pildid = pildidMap[k.id] || [];
        var pildiHTML = pildid.length ? '<div class="kirje-pildid">' + pildid.slice(0,6).map(function(p) {
          return '<img src="' + p.url + '" class="kirje-pilt" onclick="window.open(\'' + p.url + '\',\'_blank\')" loading="lazy">';
        }).join('') + (pildid.length > 6 ? '<span style="font-size:11px;color:#555;align-self:center">+' + (pildid.length-6) + '</span>' : '') + '</div>' : '';

        return '<div class="kirje-kaart">'
          + '<div class="kirje-hdr">'
          + '<div class="kirje-kp"><div class="kirje-kp-paev">' + d.getDate() + '</div><div class="kirje-kp-kuu">' + KUUD_L[d.getMonth()] + '</div></div>'
          + '<div class="kirje-info"><div class="kirje-objekt">' + (k.objekt_nimi || k.ettevote_nimi) + '</div>'
          + '<div class="kirje-aeg">' + k.algus.slice(0,5) + ' – ' + k.lopp.slice(0,5) + '</div></div>'
          + '<div class="kirje-tunnid">' + parseFloat(k.tunnid).toFixed(1) + 'h</div>'
          + '</div>'
          + (tags ? '<div class="kirje-tags">' + tags + '</div>' : '')
          + pildiHTML
          + '<div class="kirje-actions">'
          + '<button class="muuda-nupp" onclick=\'avaModal(' + JSON.stringify(k) + ')\'>✏️ Muuda</button>'
          + '<button class="kustuta-nupp" onclick="kustutaKirje(' + k.id + ')">🗑 Kustuta</button>'
          + '</div></div>';
      }).join('');
    }

    // ── MUUTMINE ─────────────────────────────────────────────
    function avaModal(kirje) {
      document.getElementById('muuta-id').value = kirje.id;
      document.getElementById('muuta-kuupaev').value = kirje.kuupaev ? kirje.kuupaev.split('T')[0] : '';
      document.getElementById('muuta-algus').value = kirje.algus ? kirje.algus.slice(0,5) : '';
      document.getElementById('muuta-lopp').value = kirje.lopp ? kirje.lopp.slice(0,5) : '';
      document.getElementById('muuta-km').value = parseFloat(kirje.kilomeetrid || 0);
      document.getElementById('muuta-lisakulu').value = parseFloat(kirje.lisakulu_summa || 0);
      document.getElementById('muuta-lisakulu-sel').value = kirje.lisakulu_selgitus || '';
      document.getElementById('muuta-komm').value = kirje.kommentaar || '';
      document.getElementById('muuta-objekt').value = kirje.objekt_nimi || kirje.ettevote_nimi || '';
      document.getElementById('muuta-teade').style.display = 'none';
      document.getElementById('muutaModal').classList.add('avatud');
    }

    function sulgeModal() { document.getElementById('muutaModal').classList.remove('avatud'); }

    async function salvestaMuutus() {
      var id = document.getElementById('muuta-id').value;
      var r = await api('/api/tood/kirje/' + id, {
        method: 'PUT',
        body: JSON.stringify({
          kuupaev: document.getElementById('muuta-kuupaev').value,
          algus: document.getElementById('muuta-algus').value,
          lopp: document.getElementById('muuta-lopp').value,
          kommentaar: document.getElementById('muuta-komm').value,
          kilomeetrid: document.getElementById('muuta-km').value,
          lisakulu_summa: document.getElementById('muuta-lisakulu').value,
          lisakulu_selgitus: document.getElementById('muuta-lisakulu-sel').value
        })
      });
      if (r.ok) { sulgeModal(); await laadiKirjed(); }
      else {
        var t = document.getElementById('muuta-teade');
        t.className = 'modal-teade viga'; t.style.display = 'block';
        t.textContent = r.veateade || 'Viga salvestamisel';
      }
    }

    async function kustutaKirje(id) {
      if (!confirm('Kustutad selle töökirje?')) return;
      var r = await api('/api/tood/kustuta/' + id, { method: 'DELETE' });
      if (r.ok) await laadiKirjed();
      else alert(r.veateade || 'Kustutamine ebaõnnestus');
    }

    document.getElementById('muutaModal').addEventListener('click', function(e) {
      if (e.target === this) sulgeModal();
    });

    init();
  </script>
</body>

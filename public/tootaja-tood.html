<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Paigaldus — Lisa töökirje</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0d0f13; --bg2: #13161c; --bg3: #1e2128; --border: rgba(255,255,255,0.06); --text: #e2e8f0; --text2: #94a3b8; --text3: #555; }
    body.hele { --bg: #f4f5f7; --bg2: #ffffff; --bg3: #e8eaed; --border: rgba(0,0,0,0.08); --text: #1a1a2e; --text2: #444; --text3: #888; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.2s, color 0.2s; }

    .topbar { background: #13161c; border-bottom: 0.5px solid rgba(255,255,255,0.07); padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 32px; height: 32px; background: linear-gradient(135deg, #c9a84c, #f0d080); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .brand-name { font-size: 13px; font-weight: 700; color: #c9a84c; }
    .brand-sub { font-size: 10px; color: #555; }
    .tagasi-nupp { font-size: 12px; color: #64748b; background: none; border: 0.5px solid #252830; border-radius: 6px; padding: 6px 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .tagasi-nupp:hover { border-color: #c9a84c; color: #c9a84c; }

    .leht { max-width: 520px; margin: 0 auto; padding: 24px 16px 60px; }

    /* Ettevõte valik */
    .sekts { margin-bottom: 20px; }
    .sekts-pealkiri { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #3a3d45; margin-bottom: 10px; }

    .emp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .emp-btn { border-radius: 12px; padding: 16px 12px; cursor: pointer; text-align: center; border: 1.5px solid transparent; transition: all 0.15s; background: #13161c; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .emp-btn:hover { transform: translateY(-2px); }
    .emp-btn.valitud { transform: translateY(-2px); }
    .emp-btn.lidl { border-color: #003d99; }
    .emp-btn.lidl.valitud { background: #002060; border-color: #4488ff; box-shadow: 0 0 0 2px rgba(68,136,255,0.2); }
    .emp-btn.cramo { border-color: #3a0d07; }
    .emp-btn.cramo.valitud { background: #180604; border-color: #ff4433; box-shadow: 0 0 0 2px rgba(255,68,51,0.2); }
    .emp-btn.muu { border-color: #1a2d40; }
    .emp-btn.muu.valitud { background: #0e1824; border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56,189,248,0.15); }
    .emp-btn.merekohvik { border-color: #1a3020; }
    .emp-btn.merekohvik.valitud { background: #0a1a10; border-color: #4ade80; box-shadow: 0 0 0 2px rgba(74,222,128,0.15); }
    .emp-logo { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; }
    .emp-logo.lidl { background: #FFF200; color: #0050AA; }
    .emp-logo.cramo { background: #CD2200; color: #fff; border-radius: 9px; }
    .emp-logo.muu { background: #1a3550; color: #38bdf8; border-radius: 9px; font-size: 14px; }
    .emp-logo.merekohvik { background: #0d2d1a; color: #4ade80; border-radius: 9px; font-size: 14px; }
    .emp-nimi { font-size: 12px; font-weight: 700; }
    .emp-nimi.lidl { color: #FFF200; }
    .emp-nimi.cramo { color: #ff6b50; }
    .emp-nimi.muu { color: #38bdf8; }
    .emp-nimi.merekohvik { color: #4ade80; }
    .emp-tunnitasu { font-size: 11px; color: #444; }

    /* Objekt valik */
    .valik-grupp { margin-bottom: 16px; }
    .valik-label { font-size: 12px; color: #64748b; margin-bottom: 6px; display: block; }
    select, input[type=text], input[type=date], input[type=number], textarea {
      width: 100%; background: #13161c; border: 0.5px solid #252830; border-radius: 10px;
      padding: 12px 14px; font-size: 14px; color: #e2e8f0; outline: none;
      font-family: inherit;
    }
    select:focus, input:focus, textarea:focus { border-color: #c9a84c; }
    textarea { resize: vertical; min-height: 80px; }

    /* Kellaaeg */
    .kell-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .kell-valik { position: relative; }
    .kell-valik input { text-align: center; font-size: 22px; font-weight: 700; letter-spacing: 2px; padding: 14px; }
    .kell-label-small { font-size: 10px; color: #444; text-align: center; margin-top: 4px; }

    /* Tunnid display */
    .tunnid-display { background: #13161c; border: 0.5px solid #1e2128; border-radius: 10px; padding: 14px; text-align: center; margin-bottom: 16px; }
    .tunnid-arv { font-size: 32px; font-weight: 700; color: #c9a84c; }
    .tunnid-sub { font-size: 12px; color: #444; margin-top: 2px; }

    /* KM sektsioon */
    .km-sekts { background: #0c1520; border: 0.5px solid #1a3050; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .km-pealkiri { font-size: 12px; color: #4488ff; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .km-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .km-result { background: #0f2040; border-radius: 8px; padding: 10px 12px; text-align: center; }
    .km-result-arv { font-size: 18px; font-weight: 700; color: #60a5fa; }
    .km-result-sub { font-size: 10px; color: #3a5070; margin-top: 2px; }

    /* Lisa nupp */
    .lisa-nupp { width: 100%; background: linear-gradient(135deg, #c9a84c, #e0b84e); color: #0d0f13; border: none; border-radius: 12px; padding: 16px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .lisa-nupp:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(201,168,76,0.3); }
    .lisa-nupp:active { transform: translateY(0); }
    .lisa-nupp:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* Tänased kirjed */
    .kirjed-nimekiri { margin-top: 24px; }
    .kirje-rida { background: #13161c; border: 0.5px solid rgba(255,255,255,0.05); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .kirje-vasak { flex: 1; }
    .kirje-firma { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 4px; margin-right: 6px; }
    .kirje-firma.lidl { background: #FFF200; color: #002060; }
    .kirje-firma.cramo { background: #CD2200; color: #fff; }
    .kirje-firma.muu { background: #0369a1; color: #fff; }
    .kirje-firma.merekohvik { background: #065f46; color: #4ade80; }
    .kirje-aeg { font-size: 13px; color: #d0d0d0; margin-top: 3px; }
    .kirje-komm { font-size: 11px; color: #505560; margin-top: 2px; font-style: italic; }
    .kirje-tunnid { font-size: 18px; font-weight: 700; color: #c9a84c; margin-left: 12px; }
    .kustuta-btn { background: #2d0a0a; border: 0.5px solid #4a1010; color: #ef4444; border-radius: 7px; padding: 6px 10px; font-size: 13px; cursor: pointer; margin-left: 10px; }
    .kustuta-btn:hover { background: #3d1010; }

    .teade { border-radius: 10px; padding: 12px 14px; font-size: 13px; margin-bottom: 14px; display: none; }
    .teade.ok { background: #0d2d1a; border: 0.5px solid #1a4d2a; color: #4ade80; }
    .teade.viga { background: #2d0a0a; border: 0.5px solid #4a1010; color: #f87171; }

    .tyhi { padding: 20px; text-align: center; color: #3a3d45; font-size: 13px; }

    /* Kuupäev */
    input[type=date] { color-scheme: dark; }
    /* Kalender */
    .kal-paev { text-align:center; font-size:14px; padding:7px 4px; border-radius:8px; cursor:pointer; color:#e2e8f0; transition:all 0.1s; }
    .kal-paev:hover { background:#1e2128; }
    .kal-paev.taana { border:1.5px solid #c9a84c; color:#c9a84c; font-weight:700; }
    .kal-paev.valitud { background:#c9a84c !important; color:#0d0f13 !important; font-weight:700; }
    .kal-paev.tookirjega { background:#2d1f0a; color:#f0a040; font-weight:600; }
    .kal-paev.teine-kuu { color:#333; cursor:default; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-logo">👑</div>
      <div><div class="brand-name">ROYAL PAIGALDUS</div><div class="brand-sub">Tööpäevik</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button onclick="vahetaTeema()" id="teemaNupp" style="font-size:16px;background:none;border:0.5px solid #333;border-radius:6px;padding:4px 8px;cursor:pointer;color:#aaa">☀️</button>
      <button class="tagasi-nupp" onclick="window.location='/tootaja'">← Tagasi</button>
    </div>
  </div>

  <div class="leht">
    <div class="teade ok" id="teade-ok"></div>
    <div class="teade viga" id="teade-viga"></div>

    <!-- 1. Ettevõte valik -->
    <div class="sekts">
      <div class="sekts-pealkiri">Vali projekt</div>
      <div class="emp-grid" id="ettevotteGrid">
        <div style="color:#555;font-size:13px;padding:16px;grid-column:1/-1">Laadimine...</div>
      </div>
    </div>

    <!-- 2. Objekt (ainult LIDL puhul) -->
    <div class="valik-grupp" id="objektRida" style="display:none">
      <label class="valik-label">Objekt</label>
      <select id="objektValik">
        <option value="">— Pole määratud —</option>
      </select>
    </div>

    <!-- 3. Kuupäev -->
    <div class="valik-grupp">
      <label class="valik-label">Kuupäev</label>
      <div id="kalenderWrapper">
        <div id="kalenderNupp" onclick="toggleKalender()" style="background:#13161c;border:0.5px solid #252830;border-radius:10px;padding:12px 14px;font-size:14px;color:#e2e8f0;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
          <span id="kalenderTekst">Laadimine...</span>
          <span style="color:#555">📅</span>
        </div>
        <div id="kalenderPanel" style="display:none;background:#13161c;border:0.5px solid #252830;border-radius:12px;padding:16px;margin-top:6px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <button onclick="kalenderKuu(-1)" style="background:none;border:none;color:#aaa;font-size:18px;cursor:pointer;padding:4px 10px">‹</button>
            <span id="kalenderKuuNimi" style="font-size:14px;font-weight:600;color:#e2e8f0"></span>
            <button onclick="kalenderKuu(1)" style="background:none;border:none;color:#aaa;font-size:18px;cursor:pointer;padding:4px 10px">›</button>
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px">
            <div style="text-align:center;font-size:10px;color:#555;padding:4px">E</div>
            <div style="text-align:center;font-size:10px;color:#555;padding:4px">T</div>
            <div style="text-align:center;font-size:10px;color:#555;padding:4px">K</div>
            <div style="text-align:center;font-size:10px;color:#555;padding:4px">N</div>
            <div style="text-align:center;font-size:10px;color:#555;padding:4px">R</div>
            <div style="text-align:center;font-size:10px;color:#555;padding:4px">L</div>
            <div style="text-align:center;font-size:10px;color:#555;padding:4px">P</div>
          </div>
          <div id="kalenderPaevad" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px"></div>
        </div>
      </div>
      <input type="hidden" id="kuupaev">
    </div>

    <!-- 4. Kellaaeg -->
    <div class="sekts">
      <div class="sekts-pealkiri">Tööaeg</div>
      <div class="kell-grid">
        <div class="kell-valik">
          <input type="time" id="algus" value="08:00" oninput="arvutaTunnid()">
          <div class="kell-label-small">Algus</div>
        </div>
        <div class="kell-valik">
          <input type="time" id="lopp" value="17:00" oninput="arvutaTunnid()">
          <div class="kell-label-small">Lõpp</div>
        </div>
      </div>
    </div>

    <!-- 5. Tunnid display -->
    <div class="tunnid-display">
      <div class="tunnid-arv" id="tunnidArv">9.0 h</div>
      <div class="tunnid-sub" id="tunnidSub">töötundi</div>
    </div>

    <!-- 6. KM (ainult LIDL puhul) -->
    <div class="km-sekts" id="kmSekts" style="display:none">
      <div class="km-pealkiri">🚗 Sõidupäevik (LIDL)</div>
      <div class="km-grid">
        <div class="valik-grupp" style="margin:0">
          <label class="valik-label">Kilomeetrid (edasi-tagasi)</label>
          <input type="number" id="kilomeetrid" placeholder="0" min="0" step="1" oninput="arvutaKm()">
        </div>
        <div class="km-result">
          <div class="km-result-arv" id="kmRaha">0.00 €</div>
          <div class="km-result-sub">sõiduraha (12€/100km)</div>
        </div>
      </div>
    </div>

    <!-- 7. Kommentaar -->
    <div class="valik-grupp">
      <label class="valik-label">Töökirjeldus (vabatahtlik)</label>
      <textarea id="kommentaar" placeholder="nt. ladu, riiulite paigaldus, ülevaatus..."></textarea>
    </div>

    <!-- 8. Lisakulu -->
    <div class="km-sekts" style="background:#1a1208;border-color:#3a2a10;margin-bottom:16px">
      <div class="km-pealkiri" style="color:#f0b84e">💸 Lisakulu (vabatahtlik)</div>
      <div class="km-grid">
        <div class="valik-grupp" style="margin:0">
          <label class="valik-label">Summa (€)</label>
          <input type="number" id="lisakulu_summa" placeholder="0.00" min="0" step="0.01">
        </div>
        <div class="valik-grupp" style="margin:0">
          <label class="valik-label">Selgitus</label>
          <input type="text" id="lisakulu_selgitus" placeholder="nt. Bolt Drive, parkimine...">
        </div>
      </div>
    </div>

    <!-- Lisa nupp -->
    <button class="lisa-nupp" id="lisaNupp" onclick="lisaKirje()" disabled>
      ➕ Lisa töökirje
    </button>

    <!-- Tänased kirjed -->
    <div class="kirjed-nimekiri">
      <div class="sekts-pealkiri" style="margin-top:8px">Tänased kirjed</div>
      <div id="kirjedSisu"><div class="tyhi">Täna pole kirjeid lisatud</div></div>
    </div>
  </div>

  <script>
    const TOKEN = localStorage.getItem('workerToken') || '';
    const KUUD_NIMED = ['Jaanuar','Veebruar','Märts','Aprill','Mai','Juuni','Juuli','August','September','Oktoober','November','Detsember'];
    let valitudEttevote = null;
    let ettevotted = [];
    let kalenderKuupäev = new Date(); // aktiivne kuu kalendris
    let valitudKuupäev = new Date(); // valitud kuupäev
    let tookirjeKuupäevad = new Set(); // kuupäevad kus on kirjeid

    function kuupaevISO(d) {
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function toggleKalender() {
      const p = document.getElementById('kalenderPanel');
      p.style.display = p.style.display === 'none' ? 'block' : 'none';
    }

    function kalenderKuu(suund) {
      kalenderKuupäev = new Date(kalenderKuupäev.getFullYear(), kalenderKuupäev.getMonth() + suund, 1);
      joonistаKalender();
    }

    async function laadiTookirjeKuupäevad() {
      const t = new Date();
      // Laadi praeguse ja eelmise kuu kirjed
      for (let i = 0; i <= 1; i++) {
        const kuu = t.getMonth() + 1 - i;
        const aasta = kuu <= 0 ? t.getFullYear() - 1 : t.getFullYear();
        const kuu2 = kuu <= 0 ? kuu + 12 : kuu;
        try {
          const v = await api(`/api/tood/kokkuvote?aasta=${aasta}&kuu=${kuu2}`);
          if (v.ok && v.kirjed) {
            v.kirjed.forEach(k => tookirjeKuupäevad.add(k.kuupaev.split('T')[0]));
          }
        } catch(e) {}
      }
      joonistаKalender();
    }

    function joonistаKalender() {
      const aasta = kalenderKuupäev.getFullYear();
      const kuu = kalenderKuupäev.getMonth();
      document.getElementById('kalenderKuuNimi').textContent = KUUD_NIMED[kuu] + ' ' + aasta;

      const taana = new Date();
      const tanaISO = kuupaevISO(taana);
      const valitudISO = kuupaevISO(valitudKuupäev);

      // Kuu esimene päev ja selle nädalapäev (0=E, 6=P)
      const esimene = new Date(aasta, kuu, 1);
      let algusNädalapäev = esimene.getDay(); // 0=P, 1=E...
      algusNädalapäev = algusNädalapäev === 0 ? 6 : algusNädalapäev - 1; // teisenda E=0

      const viimane = new Date(aasta, kuu + 1, 0).getDate();
      const div = document.getElementById('kalenderPaevad');
      let html = '';

      // Eelmise kuu päevad
      for (let i = algusNädalapäev - 1; i >= 0; i--) {
        const ep = new Date(aasta, kuu, -i);
        html += `<div class="kal-paev teine-kuu">${ep.getDate()}</div>`;
      }

      // Selle kuu päevad
      for (let p = 1; p <= viimane; p++) {
        const d = new Date(aasta, kuu, p);
        const iso = kuupaevISO(d);
        let klass = 'kal-paev';
        if (iso === tanaISO) klass += ' taana';
        if (iso === valitudISO) klass += ' valitud';
        if (tookirjeKuupäevad.has(iso)) klass += ' tookirjega';
        html += `<div class="${klass}" onclick="valiKuupaev('${iso}')">${p}</div>`;
      }

      // Järgmise kuu päevad
      const lõppNädalapäev = new Date(aasta, kuu, viimane).getDay();
      const puudu = lõppNädalapäev === 0 ? 0 : 7 - lõppNädalapäev;
      for (let i = 1; i <= puudu; i++) {
        html += `<div class="kal-paev teine-kuu">${i}</div>`;
      }

      div.innerHTML = html;
    }

    function valiKuupaev(iso) {
      valitudKuupäev = new Date(iso + 'T12:00:00');
      document.getElementById('kuupaev').value = iso;
      const d = valitudKuupäev;
      document.getElementById('kalenderTekst').textContent =
        `${d.getDate()}. ${KUUD_NIMED[d.getMonth()]} ${d.getFullYear()}`;
      document.getElementById('kalenderPanel').style.display = 'none';
      joonistаKalender();
    }

    async function api(url, opts={}) {
      opts.headers = opts.headers || {};
      opts.headers['x-session-token'] = TOKEN;
      opts.headers['Content-Type'] = 'application/json';
      return fetch(url, opts).then(r => r.json());
    }

    async function init() {
      if (!TOKEN) { window.location = '/'; return; }
      const s = await api('/api/auth/sessioon');
      if (!s.sisselogitud || s.isAdmin) { window.location = '/'; return; }

      // Initsialiseeri kalender tänase kuupäevaga
      const t = new Date();
      valitudKuupäev = new Date(t);
      kalenderKuupäev = new Date(t);
      const tanaISO = kuupaevISO(t);
      document.getElementById('kuupaev').value = tanaISO;
      document.getElementById('kalenderTekst').textContent =
        `${t.getDate()}. ${KUUD_NIMED[t.getMonth()]} ${t.getFullYear()}`;
      joonistаKalender();
      laadiTookirjeKuupäevad(); // laadi oranžid päevad taustal

      // Laadi ettevõtted
      ettevotted = await api('/api/tood/minu-ettevotted');
      ehitaEttevotteGrid();

      // Vaata kas URL-is on ettevõte
      const params = new URLSearchParams(window.location.search);
      const eId = params.get('ettevote');
      if (eId) {
        const leitud = ettevotted.find(e => e.id == eId);
        if (leitud) valiEttevote(leitud);
      }

      arvutaTunnid();
      await laadiTanaKirjed();
    }

    function ehitaEttevotteGrid() {
      const grid = document.getElementById('ettevotteGrid');
      if (!ettevotted.length) {
        grid.innerHTML = '<div style="color:#555;font-size:13px;padding:16px;grid-column:1/-1">Ühtegi projekti pole määratud</div>';
        return;
      }
      grid.innerHTML = ettevotted.map(e => {
        const tyyp = (e.tyyp || 'muu').toLowerCase();
        const logoHTML = tyyp === 'lidl'
          ? `<svg width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
              <circle cx="18" cy="18" r="18" fill="#FFF200"/>
              <text x="18" y="14" text-anchor="middle" font-size="7" font-weight="900" fill="#0050AA" font-family="Arial">LIDL</text>
              <circle cx="18" cy="22" r="6" fill="none" stroke="#0050AA" stroke-width="1.5"/>
              <circle cx="18" cy="22" r="3.5" fill="#CD2200"/>
            </svg>`
          : tyyp === 'cramo'
          ? `<svg width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
              <rect width="36" height="36" rx="8" fill="#CD2200"/>
              <text x="18" y="23" text-anchor="middle" font-size="13" font-weight="900" fill="white" font-family="Arial">CR</text>
            </svg>`
          : tyyp === 'merekohvik'
          ? `<svg width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
              <rect width="36" height="36" rx="8" fill="#0d2d1a"/>
              <path d="M4 26 Q18 8 32 26" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              <path d="M8 26 Q18 12 28 26" stroke="#4ade80" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.4"/>
            </svg>`
          : `<svg width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
              <rect width="36" height="36" rx="8" fill="#1a3550"/>
              <text x="18" y="24" text-anchor="middle" font-size="20" font-family="Arial">🔨</text>
            </svg>`;
        return `<div class="emp-btn ${tyyp}" id="emp-${e.id}" onclick="valiEttevote(${JSON.stringify(e).replace(/"/g,'&quot;')})">
          <div class="emp-logo ${tyyp}" style="background:none;border-radius:0;padding:0">${logoHTML}</div>
          <div class="emp-nimi ${tyyp}">${e.nimi}</div>
          <div class="emp-tunnitasu">${parseFloat(e.tunnitasu||0).toFixed(2)} €/h</div>
        </div>`;
      }).join('');
    }

    async function valiEttevote(e) {
      valitudEttevote = e;
      const tyyp = (e.tyyp || 'muu').toLowerCase();

      // Visuaalne valik
      document.querySelectorAll('.emp-btn').forEach(b => b.classList.remove('valitud'));
      const btn = document.getElementById('emp-' + e.id);
      if (btn) btn.classList.add('valitud');

      // KM sekts ainult LIDL
      document.getElementById('kmSekts').style.display = tyyp === 'lidl' ? 'block' : 'none';
      if (tyyp !== 'lidl') { document.getElementById('kilomeetrid').value = ''; arvutaKm(); }

      // Objekt valik
      const objektRida = document.getElementById('objektRida');
      if (tyyp === 'lidl' || tyyp === 'cramo') {
        objektRida.style.display = 'block';
        await laadiObjektid(e.id);
      } else {
        objektRida.style.display = 'none';
      }

      document.getElementById('lisaNupp').disabled = false;
      arvutaTunnid();
    }

    async function laadiObjektid(ettevoteId) {
      const objektid = await api(`/api/tood/objektid/${ettevoteId}`);
      const sel = document.getElementById('objektValik');
      sel.innerHTML = '<option value="">— Pole määratud —</option>';
      objektid.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.id;
        opt.textContent = o.nimi;
        sel.appendChild(opt);
      });
    }

    function arvutaTunnid() {
      const algus = document.getElementById('algus').value;
      const lopp = document.getElementById('lopp').value;
      const arv = document.getElementById('tunnidArv');
      const sub = document.getElementById('tunnidSub');

      if (!algus || !lopp) { arv.textContent = '—'; return; }

      const [ah, am] = algus.split(':').map(Number);
      const [lh, lm] = lopp.split(':').map(Number);
      let min = (lh * 60 + lm) - (ah * 60 + am);

      if (min < 0) {
        // Öövahetus
        arv.textContent = ((1440 + min) / 60).toFixed(1) + ' h';
        sub.textContent = 'öövahetus';
      } else if (min === 0) {
        arv.textContent = '—';
        sub.textContent = 'kontrolli kellaaegu';
      } else {
        arv.textContent = (min / 60).toFixed(1) + ' h';
        sub.textContent = 'töötundi';
      }
    }

    function arvutaKm() {
      const km = parseFloat(document.getElementById('kilomeetrid').value) || 0;
      const raha = km / 100 * 12;
      document.getElementById('kmRaha').textContent = raha.toFixed(2) + ' €';
    }

    async function lisaKirje() {
      if (!valitudEttevote) return;

      const algus = document.getElementById('algus').value;
      const lopp = document.getElementById('lopp').value;
      const kuupaev = document.getElementById('kuupaev').value;
      const kommentaar = document.getElementById('kommentaar').value;
      const objekt_id = document.getElementById('objektValik').value || null;
      const km = parseFloat(document.getElementById('kilomeetrid').value) || 0;
      const lisakulu_summa = parseFloat(document.getElementById('lisakulu_summa').value) || 0;
      const lisakulu_selgitus = document.getElementById('lisakulu_selgitus').value;

      const nupp = document.getElementById('lisaNupp');
      nupp.disabled = true;
      nupp.textContent = 'Salvestamine...';

      const vastus = await api('/api/tood/lisa', {
        method: 'POST',
        body: JSON.stringify({
          ettevote_id: valitudEttevote.id,
          objekt_id,
          kuupaev,
          algus,
          lopp,
          kommentaar,
          kilomeetrid: km,
          lisakulu_summa,
          lisakulu_selgitus
        })
      });

      nupp.disabled = false;
      nupp.innerHTML = '➕ Lisa töökirje';

      if (vastus.ok) {
        naita('ok', `✓ Lisatud! ${vastus.tunnid} tundi${vastus.km_raha > 0 ? ' + ' + parseFloat(vastus.km_raha).toFixed(2) + '€ sõiduraha' : ''}`);
        document.getElementById('kommentaar').value = '';
        document.getElementById('kilomeetrid').value = '';
        document.getElementById('lisakulu_summa').value = '';
        document.getElementById('lisakulu_selgitus').value = '';
        arvutaKm();
        tookirjeKuupäevad.clear();
        await laadiTookirjeKuupäevad();
        await laadiTanaKirjed();
      } else {
        naita('viga', vastus.veateade || 'Viga salvestamisel');
      }
    }

    async function laadiTanaKirjed() {
      const t = new Date();
      const vastus = await api(`/api/tood/kokkuvote?aasta=${t.getFullYear()}&kuu=${t.getMonth()+1}`);
      const div = document.getElementById('kirjedSisu');
      const KUUD_LYHIKE = ['jaan','veeb','märts','apr','mai','juu','juul','aug','sept','okt','nov','dets'];

      if (!vastus.ok || !vastus.kirjed || !vastus.kirjed.length) {
        div.innerHTML = '<div class="tyhi">Selle kuu kirjeid pole</div>';
        return;
      }

      div.innerHTML = vastus.kirjed.map(k => {
        const d = new Date(k.kuupaev);
        const tyyp = (k.ettevote_tyyp || 'muu').toLowerCase();
        const kmInfo = k.kilomeetrid > 0 ? ` · 🚗 ${k.kilomeetrid}km (${parseFloat(k.km_raha||0).toFixed(2)}€)` : '';
        const lisakuluInfo = parseFloat(k.lisakulu_summa||0) > 0 ? ` · 💸 ${parseFloat(k.lisakulu_summa).toFixed(2)}€${k.lisakulu_selgitus ? ' ('+k.lisakulu_selgitus+')' : ''}` : '';
        const kuupaevTekst = `${d.getDate()}. ${KUUD_LYHIKE[d.getMonth()]}`;
        return `<div class="kirje-rida">
          <div class="kirje-vasak">
            <div><span class="kirje-firma ${tyyp}">${k.ettevote_nimi}</span> <span style="font-size:11px;color:#666">${kuupaevTekst}</span>${k.objekt_nimi ? `<span style="font-size:12px;color:#888"> · ${k.objekt_nimi}</span>` : ''}</div>
            <div class="kirje-aeg">${k.algus} – ${k.lopp}${kmInfo}${lisakuluInfo}</div>
            ${k.kommentaar ? `<div class="kirje-komm">${k.kommentaar}</div>` : ''}
          </div>
          <div style="display:flex;align-items:center">
            <div class="kirje-tunnid">${parseFloat(k.tunnid).toFixed(1)}h</div>
            <button class="kustuta-btn" onclick="kustutaKirje(${k.id})">🗑</button>
          </div>
        </div>`;
      }).join('');
    }

    async function kustutaKirje(id) {
      if (!confirm('Kustutad selle töökirje? Seda ei saa tagasi võtta.')) return;
      const v = await api(`/api/tood/kustuta/${id}`, { method: 'DELETE' });
      if (v.ok) {
        naita('ok', 'Kirje kustutatud');
        await laadiTanaKirjed();
      } else {
        naita('viga', v.veateade || 'Kustutamine ebaõnnestus');
      }
    }

    function naita(tyyp, tekst) {
      const ok = document.getElementById('teade-ok');
      const viga = document.getElementById('teade-viga');
      ok.style.display = 'none';
      viga.style.display = 'none';
      if (tyyp === 'ok') { ok.textContent = tekst; ok.style.display = 'block'; setTimeout(() => ok.style.display='none', 4000); }
      else { viga.textContent = tekst; viga.style.display = 'block'; setTimeout(() => viga.style.display='none', 5000); }
    }

    function vahetaTeema() {
      const hele = document.body.classList.toggle('hele');
      localStorage.setItem('teema', hele ? 'hele' : 'tume');
      document.getElementById('teemaNupp').textContent = hele ? '🌙' : '☀️';
    }
    if (localStorage.getItem('teema') === 'hele') {
      document.body.classList.add('hele');
      document.addEventListener('DOMContentLoaded', () => {
        const n = document.getElementById('teemaNupp');
        if (n) n.textContent = '🌙';
      });
    }
    init();
  </script>
</body>
</html>

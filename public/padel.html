<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Paigaldus — Padel</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d0f13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #0d0f13; --bg2: #13161c; --bg3: #1e2128; --border: rgba(255,255,255,0.06); --text: #e2e8f0; --text2: #bbb; --text3: #7a8290; --groen: #4ade80; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding: 16px; padding-bottom: 60px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .topbar h1 { font-size: 18px; font-weight: 800; }
  .topbar h1 span { color: var(--groen); }
  a.tagasi { color: var(--text2); text-decoration: none; font-size: 13px; }
  select, input { background: var(--bg3); border: 0.5px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
  .kaart { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 14px; margin-bottom: 16px; overflow: hidden; }
  .kaart-hdr { padding: 14px 18px; font-size: 15px; font-weight: 700; border-bottom: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .kaart-body { padding: 18px; }
  .tyhi { padding: 24px 18px; text-align: center; color: var(--text3); }
  .laadimine { padding: 24px; text-align: center; color: var(--text3); }
  .nupp { background: var(--groen); color: #06240f; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .nupp.hall { background: var(--bg3); color: var(--text); border: 0.5px solid var(--border); }
  .nupp.pisike { padding: 6px 10px; font-size: 12px; }
  .teade { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 10px; display: none; }
  .teade.ok { background: rgba(74,222,128,0.12); color: #4ade80; display: block; }
  .teade.viga { background: rgba(248,113,113,0.12); color: #f87171; display: block; }
  .rida { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid var(--border); flex-wrap: wrap; }
  .rida:last-child { border-bottom: none; }
  .saldo-summa { font-size: 26px; font-weight: 800; }
  .saldo-summa.null { color: var(--groen); }
  .saldo-summa.voolgu { color: #fbbf24; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 4px; color: var(--text3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 0.5px solid var(--border); }
  td { padding: 8px 4px; border-bottom: 0.5px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  .paar-blokk { background: var(--bg3); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .pesad-rida { display: flex; gap: 10px; }
  .pesa { flex: 1; background: var(--bg2); border-radius: 10px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; text-align: center; min-height: 110px; justify-content: center; }
  .pesa-tuhi { cursor: pointer; border: 1.5px dashed var(--border); position: relative; }
  .pesa-pluss { font-size: 26px; color: var(--text3); line-height: 1; margin-bottom: 4px; }
  .pesa-taidetud { border: 1.5px solid var(--groen); }
  .pesa-ootel { border: 1.5px solid #fbbf24; }
  .pesa-valikud { position: absolute; top: 100%; left: 0; right: 0; margin-top: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; z-index: 20; max-height: 220px; overflow-y: auto; text-align: left; }
  .pesa-valik { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13px; cursor: pointer; }
  .pesa-valik:hover { background: var(--bg3); }
  .paar-pealkiri { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .liige-rida { display: flex; align-items: center; gap: 8px; padding: 6px 0; flex-wrap: wrap; }
  .liige-nimi { flex: 1; min-width: 90px; font-weight: 600; }
  .osalus-nupud { display: flex; gap: 6px; }
  .osalus-nupp { background: var(--bg2); border: 0.5px solid var(--border); color: var(--text2); border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  .osalus-nupp.aktiivne-jah { background: rgba(74,222,128,0.18); color: #4ade80; border-color: #166534; }
  .osalus-nupp.aktiivne-ei { background: rgba(248,113,113,0.18); color: #f87171; border-color: #7f1d1d; }
  .asendaja-rida { width: 100%; display: flex; gap: 6px; margin-top: 6px; }
  .tulemus-vorm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tulemus-vorm input { width: 60px; text-align: center; font-weight: 700; }
  .medal { font-size: 16px; margin-right: 4px; }
  /* Avatavad moodulid (Minu saldo, Statistika) */
  .ava-pais { padding: 16px 18px; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .ava-pais .pealkiri { font-size: 15px; font-weight: 800; letter-spacing: 0.5px; flex: 1; }
  .ava-pais .vaartus { font-size: 15px; font-weight: 800; }
  .ava-pais .nool { color: var(--text3); font-size: 12px; transition: transform .15s; }
  .ava-kaart.lahti .ava-pais .nool { transform: rotate(90deg); }
  .ava-keha { display: none; border-top: 0.5px solid var(--border); padding: 16px 18px; }
  .ava-kaart.lahti .ava-keha { display: block; }
  .pea-alam { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; margin: 18px 0 8px; }
  .pea-alam:first-child { margin-top: 0; }
  .led-rida { display: grid; grid-template-columns: 82px 1fr auto; gap: 4px 10px; align-items: center; padding: 9px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; }
  .led-rida:last-child { border-bottom: none; }
  .led-rida .kp { color: var(--text3); font-variant-numeric: tabular-nums; }
  .led-rida .summa { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .led-rida .alam { grid-column: 2 / -1; font-size: 11px; color: var(--text3); }
  .staatus-silt { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 5px; margin-left: 6px; vertical-align: middle; }
  .staatus-silt.ok { background: rgba(74,222,128,0.14); color: var(--groen); }
  .staatus-silt.ei { background: rgba(251,191,36,0.14); color: #fbbf24; }
  /* Statistika */
  .st-chipid { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .st-chip { background: var(--bg3); border: 0.5px solid var(--border); color: var(--text2); border-radius: 20px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .st-chip.aktiivne { background: var(--groen); color: #052e16; border-color: var(--groen); }
  .st-ruudud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .st-ruut { background: var(--bg3); border-radius: 10px; padding: 10px 12px; }
  .st-ruut .n { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; }
  .st-ruut .v { font-size: 20px; font-weight: 800; margin-top: 2px; }
  .st-ruut .a { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .vorm { display: flex; gap: 4px; }
  .vorm span { width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; }
  .vorm .V { background: rgba(74,222,128,0.18); color: var(--groen); }
  .vorm .K { background: rgba(248,113,113,0.18); color: #f87171; }
  .vorm .Vi { background: var(--bg2); color: var(--text2); }
  .st-rida { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; }
  .st-rida:last-child { border-bottom: none; }
  .st-rida .nimi { flex: 1; min-width: 0; }
  .st-rida .nimi > b { display: block; font-weight: 700; }
  .st-rida .nimi small b { color: var(--text); }
  .st-rida .nimi small { color: var(--text3); font-size: 11px; }
  .st-rida .num { font-weight: 800; text-align: right; white-space: nowrap; }
  .st-kaardid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .st-kaart { background: var(--bg3); border-radius: 10px; padding: 12px; }
  .st-kaart .silt { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; margin-bottom: 8px; }
  .st-kaart .kes { display: flex; align-items: center; font-weight: 700; font-size: 13px; }
  .st-kaart .mis { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .riba { height: 5px; border-radius: 3px; background: var(--bg2); overflow: hidden; margin-top: 4px; }
  .riba > div { height: 100%; background: var(--groen); border-radius: 3px; }
  .avatarid { display: inline-flex; margin-right: 8px; }
  .avatarid > * { margin-right: -8px !important; border: 2px solid var(--bg2); border-radius: 50%; }
  .avatarid > *:last-child { margin-right: 0 !important; }
  @media (max-width: 420px) { .st-ruudud { grid-template-columns: repeat(2, 1fr); } .st-kaardid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>🎾 <span>Padel</span></h1>
      <a class="tagasi" href="/tootaja">← Tagasi pealehele</a>
    </div>
  </div>

  <div id="lubamatuTeade" style="display:none" class="tyhi">Sul pole Padel mooduli ligipääsu. Palun küsi adminilt.</div>

  <div id="sisu" style="display:none">
    <div class="kaart ava-kaart" id="saldoKaart">
      <div class="ava-pais" onclick="lylitaKaart('saldoKaart')">
        <span class="pealkiri">💰 MINU SALDO</span>
        <span class="vaartus" id="saldoPais">…</span>
        <span class="nool">▶</span>
      </div>
      <div class="ava-keha" id="saldoSisu"><div class="laadimine">Laadimine...</div></div>
    </div>

    <div id="tanaBanner"></div>

    <div id="ryhmadSisu"><div class="laadimine">Laadimine...</div></div>

    <div class="kaart ava-kaart" id="statKaart">
      <div class="ava-pais" onclick="lylitaKaart('statKaart')">
        <span class="pealkiri">📊 STATISTIKA</span>
        <span class="nool">▶</span>
      </div>
      <div class="ava-keha" id="statSisu"><div class="laadimine">Laadimine...</div></div>
    </div>
  </div>

<script>
var TOKEN = localStorage.getItem('workerToken') || '';
if (!TOKEN) window.location.replace('/');

function api(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'Content-Type': 'application/json', 'x-session-token': TOKEN }, opts.headers || {});
  return fetch(url, opts).then(function(r) { return r.json(); });
}
function fmtEur(n) { return (parseFloat(n) || 0).toFixed(2).replace('.', ',') + ' €'; }
function fmtKp(d) { if (!d) return '—'; var dt = new Date(d); return String(dt.getDate()).padStart(2,'0') + '.' + String(dt.getMonth()+1).padStart(2,'0') + '.' + dt.getFullYear(); }
function tanaISO() { return new Date().toISOString().split('T')[0]; }
// Server tagastab kuupäeva mõnikord täispika ISO stringina (nt "2026-09-02T00:00:00.000Z") —
// normaliseerime alati "YYYY-MM-DD" kujule, enne kui kuupäevi omavahel võrdleme.
function avatarHtml(fotoUrl, nimi, suurus) {
  suurus = suurus || 28;
  if (fotoUrl) return '<img src="' + fotoUrl + '" style="width:' + suurus + 'px;height:' + suurus + 'px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px">';
  var initsiaal = (nimi || '?').charAt(0).toUpperCase();
  return '<span style="display:inline-flex;align-items:center;justify-content:center;width:' + suurus + 'px;height:' + suurus + 'px;border-radius:50%;background:var(--bg3);color:var(--text3);font-size:' + (suurus*0.4) + 'px;font-weight:700;vertical-align:middle;margin-right:8px">' + initsiaal + '</span>';
}

function kpOsa(d) { return (d || '').toString().slice(0, 10); }

var mineRyhmad = [];
var tananeTrenniLeitud = [];
var ryhmiVarvid = {};

function renderTanaBanner() {
  var div = document.getElementById('tanaBanner');
  if (!tananeTrenniLeitud.length) { div.innerHTML = ''; return; }
  div.innerHTML = tananeTrenniLeitud.map(function(t) {
    var varv = ryhmiVarvid[t.ryhmId] || '#4ade80';
    return '<div class="kaart" style="border-left:4px solid ' + varv + ';background:#0d1f13">'
      + '<div class="kaart-body" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">'
      + '<span style="font-weight:700">🟢 Täna on trenn: <span style="color:' + varv + '">' + t.nimi + '</span></span>'
      + '<a href="#ryhm-kaart-' + t.ryhmId + '" class="nupp pisike" onclick="document.getElementById(\'ryhm-kaart-' + t.ryhmId + '\').scrollIntoView({behavior:\'smooth\'})" style="text-decoration:none">Ava ↓</a>'
      + '</div></div>';
  }).join('');
}

var praeguneTootajaId = null;
var praeguneTootajaNimi = '';
async function init() {
  var kontroll = await api('/api/padel/kontroll');
  if (!kontroll.lubatud) {
    document.getElementById('lubamatuTeade').style.display = 'block';
    return;
  }
  praeguneTootajaId = kontroll.worker_id;
  praeguneTootajaNimi = kontroll.worker_nimi || '';
  document.getElementById('sisu').style.display = 'block';
  await Promise.all([laadiSaldo(), laadiRyhmad()]);
}

// Ralfi kontod, kuhu padeli võlad tasutakse — muudetav ainult siin, ühes kohas.
var MAKSE_SAAJA = 'RALF ROGOV';
var MAKSE_KONTOD = [
  { pank: 'Swedbank', logo: '/swedbank.png', tausta: '#fff', iban: 'EE792200221024775145' },
  { pank: 'LHV',      logo: '/lhv.jpg',      tausta: '#0d0f13', iban: 'EE097700771000752043' }
];

function lylitaKaart(id) {
  var el = document.getElementById(id);
  el.classList.toggle('lahti');
  if (id === 'statKaart' && el.classList.contains('lahti') && !statLaetud) laadiStatistika();
}
function fmtKpS(kp) { var o = String(kp).slice(0, 10).split('-'); return o.length === 3 ? o[2] + '.' + o[1] + '.' + o[0] : fmtKp(kp); }
function escH(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function(c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }

async function laadiSaldo() {
  var r = await api('/api/padel/minu-saldo');
  var div = document.getElementById('saldoSisu');
  var pais = document.getElementById('saldoPais');
  if (!r.ok) { div.innerHTML = '<div class="tyhi">Viga saldo laadimisel</div>'; pais.textContent = ''; return; }

  // Päis (nähtav ka suletuna)
  if (r.kokku > 0.004) { pais.textContent = fmtEur(r.kokku) + ' võlgu'; pais.style.color = '#fbbf24'; }
  else if (r.kokku < -0.004) { pais.textContent = '+' + fmtEur(-r.kokku); pais.style.color = 'var(--groen)'; }
  else { pais.textContent = '0,00 € ✓'; pais.style.color = 'var(--groen)'; }

  var html = '';
  if (r.kokku > 0.004) {
    html += '<button class="nupp" style="width:100%" onclick="lylitaMakse(' + r.kokku + ')">💳 MAKSA ' + fmtEur(r.kokku) + '</button>'
      + '<div id="makse-paneel" style="display:none;margin-top:12px;background:var(--bg3);border-radius:10px;padding:14px"></div>';
  } else if (r.kokku < -0.004) {
    html += '<div style="font-size:13px;color:var(--groen)">Sul on ' + fmtEur(-r.kokku) + ' ettemaksu — see läheb järgmiste trennide arvelt maha.</div>';
  } else {
    html += '<div style="font-size:13px;color:var(--groen)">Kõik makstud! ✅</div>';
  }

  // Kronoloogiline liikumine: trennitasud (−) ja maksed (+) koos jooksva saldoga
  var sundmused = [];
  (r.trennid || []).forEach(function(t) { sundmused.push({ kp: t.kuupaev, tyyp: 'trenn', summa: t.summa, t: t }); });
  (r.maksed || []).forEach(function(m) { sundmused.push({ kp: String(m.kuupaev).slice(0, 10), tyyp: 'makse', summa: parseFloat(m.summa) || 0, m: m }); });
  sundmused.sort(function(a, b) { return a.kp < b.kp ? -1 : a.kp > b.kp ? 1 : (a.tyyp === 'trenn' ? -1 : 1); });
  var jooksev = 0;
  sundmused.forEach(function(e) { jooksev += e.tyyp === 'trenn' ? e.summa : -e.summa; e.saldo = jooksev; });

  html += '<div class="pea-alam" style="margin-top:18px">Trennitasud ja maksed</div>';
  if (!sundmused.length) html += '<div style="font-size:13px;color:var(--text3)">Veel pole ühtegi trenni ega makset.</div>';
  html += sundmused.slice().reverse().map(function(e) {
    var saldoTekst = e.saldo > 0.004 ? 'võlg ' + fmtEur(e.saldo) : (e.saldo < -0.004 ? 'ettemaks ' + fmtEur(-e.saldo) : 'tasa');
    if (e.tyyp === 'trenn') {
      var t = e.t, silt = '';
      if (t.staatus === 'kandis') silt = '<span class="staatus-silt ok">✓ makstud ' + fmtKpS(t.makse.kuupaev) + '</span>';
      else if (t.staatus === 'kaetud') silt = '<span class="staatus-silt ok">✓ kaetud</span>';
      else silt = '<span class="staatus-silt ei">maksmata</span>';
      return '<div class="led-rida"><span class="kp">' + fmtKpS(t.kuupaev) + '</span>'
        + '<span>🎾 Trenn · ' + escH(t.ryhm_nimi) + silt + '</span>'
        + '<span class="summa">−' + fmtEur(t.summa) + '</span>'
        + '<span class="alam">pärast: ' + saldoTekst + '</span></div>';
    }
    var m = e.m;
    return '<div class="led-rida"><span class="kp">' + fmtKpS(m.kuupaev) + '</span>'
      + '<span>💶 Makse' + (m.kommentaar ? ' · <span style="color:var(--text3)">' + escH(m.kommentaar) + '</span>' : '') + '</span>'
      + '<span class="summa" style="color:var(--groen)">+' + fmtEur(m.summa) + '</span>'
      + '<span class="alam">pärast: ' + saldoTekst + '</span></div>';
  }).join('');
  div.innerHTML = html;
}

function lylitaMakse(summa) {
  var paneel = document.getElementById('makse-paneel');
  var avatud = paneel.style.display !== 'none';
  if (avatud) { paneel.style.display = 'none'; return; }
  var viide = 'Padel' + (praeguneTootajaNimi ? ' - ' + praeguneTootajaNimi : '');
  var summaStr = summa.toFixed(2);
  var pangadHtml = MAKSE_KONTOD.map(function(k) {
    var ibanLoetav = k.iban.replace(/(.{4})/g, '$1 ').trim();
    return '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px">'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
      + '<img src="' + k.logo + '" alt="' + k.pank + '" style="width:26px;height:26px;border-radius:6px;background:' + k.tausta + ';object-fit:cover">'
      + '<span style="font-size:13px;font-weight:700">' + k.pank + '</span>'
      + '</div>'
      + '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'
      + '<span style="font-size:13px;font-weight:600;font-family:monospace">' + ibanLoetav + '</span>'
      + '<button class="nupp hall pisike" onclick="kopeeriMakseVali(this, \'' + k.iban + '\')">📋 Kopeeri</button>'
      + '</div></div>';
  }).join('');
  paneel.innerHTML =
    '<div style="font-size:12px;color:var(--text3);margin-bottom:10px">Vali pank, kust kiiremini kannad:</div>'
    + pangadHtml
    + '<div style="margin-top:6px">'
    + makseRida('Saaja', MAKSE_SAAJA)
    + makseRida('Summa', summaStr + ' €', summaStr)
    + makseRida('Selgitus', viide)
    + '</div>';
  paneel.style.display = 'block';
}
function makseRida(silt, kuvatav, kopeeritav) {
  var kop = (kopeeritav !== undefined ? kopeeritav : kuvatav).replace(/'/g, "\\'");
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--border)">'
    + '<div><div style="font-size:10px;color:var(--text3)">' + silt + '</div><div style="font-size:13px;font-weight:600">' + kuvatav + '</div></div>'
    + '<button class="nupp hall pisike" onclick="kopeeriMakseVali(this, \'' + kop + '\')">📋 Kopeeri</button>'
    + '</div>';
}
function kopeeriMakseVali(nupp, tekst) {
  var vana = nupp.textContent;
  function onnestus() { nupp.textContent = '✅ Kopeeritud'; setTimeout(function() { nupp.textContent = vana; }, 1500); }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(tekst).then(onnestus);
  } else {
    var ajutine = document.createElement('textarea');
    ajutine.value = tekst; ajutine.style.position = 'fixed'; ajutine.style.opacity = '0';
    document.body.appendChild(ajutine); ajutine.focus(); ajutine.select();
    try { document.execCommand('copy'); onnestus(); } catch (e) {}
    document.body.removeChild(ajutine);
  }
}

async function laadiRyhmad() {
  var r = await api('/api/padel/minu');
  var div = document.getElementById('ryhmadSisu');
  mineRyhmad = (r.ok && r.ryhmad) ? r.ryhmad : [];
  tananeTrenniLeitud = [];
  renderTanaBanner();
  if (!mineRyhmad.length) { div.innerHTML = '<div class="kaart"><div class="tyhi">Sind pole veel ühessegi Padeli gruppi lisatud.</div></div>'; return; }

  // Laadime kõigi gruppide andmed korraga, et saaksime tänase trenniga grupi kõige ette tõsta.
  var koikAndmed = await Promise.all(mineRyhmad.map(function(g) { return api('/api/padel/ryhm/' + g.ryhm_id); }));
  var tanaISOval = tanaISO();
  var jarjestatud = mineRyhmad.map(function(g, i) { return { g: g, r: koikAndmed[i] }; }).sort(function(a, b) {
    var aTana = leiaTana(a.r, tanaISOval) ? 0 : 1;
    var bTana = leiaTana(b.r, tanaISOval) ? 0 : 1;
    return aTana - bTana;
  });

  var varvid = ['#4ade80', '#60a5fa', '#f472b6', '#fbbf24', '#a78bfa', '#fb7185', '#2dd4bf'];
  div.innerHTML = jarjestatud.map(function(item, i) {
    var g = item.g;
    var varv = varvid[i % varvid.length];
    ryhmiVarvid[g.ryhm_id] = varv;
    return '<div class="kaart" id="ryhm-kaart-' + g.ryhm_id + '" style="border-left:4px solid ' + varv + '">'
      + '<div class="kaart-hdr"><span style="color:' + varv + '">🎾 ' + g.ryhm_nimi + '</span>'
      + '<span style="display:flex;gap:8px">'
      + '<button class="nupp hall pisike" onclick="saadaSonum(' + g.ryhm_id + ')">📨 Saada sõnum</button>'
      + '<button class="nupp hall pisike" onclick="saadaMeeldetuletus(' + g.ryhm_id + ')">🔔 Meeldetuleta kõigile</button>'
      + '</span></div>'
      + '<div class="kaart-body" id="ryhm-sisu-' + g.ryhm_id + '"><div class="laadimine">Laadimine...</div></div>'
      + '</div>';
  }).join('');
  jarjestatud.forEach(function(item) { taidaRyhmSisu(item.g.ryhm_id, item.r); });
}

// Kas selle grupi JÄRGMINE trenn on täna?
function leiaTana(r, tanaISOval) {
  if (!r || !r.ok || !r.nadalad) return false;
  var nimekiri = r.nadalad.slice().sort(function(a, b) { return new Date(a.kuupaev) - new Date(b.kuupaev); });
  var jargmine = nimekiri.find(function(n) { return kpOsa(n.kuupaev) >= tanaISOval; });
  return jargmine && kpOsa(jargmine.kuupaev) === tanaISOval;
}

async function laadiRyhmSisu(ryhmId) {
  var r = await api('/api/padel/ryhm/' + ryhmId);
  await taidaRyhmSisu(ryhmId, r);
}

// Külaline = mängija ilma kontota (admin on ta nime järgi trennile lisanud)
function kylSilt(onKylaline) {
  return onKylaline ? ' <span title="Mängija ilma kontota" style="font-size:10px;font-weight:600;color:#60a5fa;background:rgba(96,165,250,0.14);border-radius:5px;padding:1px 5px;white-space:nowrap">külaline</span>' : '';
}

async function taidaRyhmSisu(ryhmId, r) {
  var div = document.getElementById('ryhm-sisu-' + ryhmId);
  if (!r.ok) { div.innerHTML = '<div class="tyhi">Viga: ' + (r.veateade || '') + '</div>'; return; }

var edetabelHtml = '<table><thead><tr><th>#</th><th>Mängija</th><th style="text-align:right">Punktid</th><th style="text-align:right">Geimid</th><th style="text-align:right">Trenne</th></tr></thead><tbody>'
    + r.edetabel.map(function(e, i) {
      var medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1) + '.';
      return '<tr><td>' + medal + '</td><td>' + avatarHtml(e.foto_url, e.nimi, 24) + e.nimi + kylSilt(e.kylaline) + '</td><td style="text-align:right;font-weight:700;color:var(--groen)">' + e.punktid + '</td><td style="text-align:right">' + e.geimid + '</td><td style="text-align:right;color:var(--text3)">' + e.mange + '</td></tr>';
    }).join('') + '</tbody></table>';

  var tanaISOval = tanaISO();
  var trennideNimekiri = (r.nadalad || []).slice().sort(function(a, b) { return new Date(a.kuupaev) - new Date(b.kuupaev); });
  var jargmine = trennideNimekiri.find(function(n) { return kpOsa(n.kuupaev) >= tanaISOval; });

  var valikudHtml = trennideNimekiri.map(function(n) {
    var tulemusOlemas = n.setid && n.setid.length;
    return '<option value="' + kpOsa(n.kuupaev) + '">' + fmtKp(n.kuupaev) + (tulemusOlemas ? ' ✓ tulemus sees' : (kpOsa(n.kuupaev) >= tanaISOval ? ' — tulevane' : ' — tulemus puudub')) + '</option>';
  }).join('');
  var vaikimisiValik = jargmine ? kpOsa(jargmine.kuupaev) : (trennideNimekiri.length ? kpOsa(trennideNimekiri[trennideNimekiri.length - 1].kuupaev) : '');

  if (jargmine && kpOsa(jargmine.kuupaev) === tanaISOval && !tananeTrenniLeitud.some(function(t) { return t.ryhmId === ryhmId; })) {
    tananeTrenniLeitud.push({ ryhmId: ryhmId, nimi: r.ryhm.nimi });
    renderTanaBanner();
  }

  div.innerHTML =
    '<div class="paar-pealkiri">Edetabel</div>'
    + edetabelHtml
    + (trennideNimekiri.length
      ? '<div id="nadal-' + ryhmId + '" style="margin-top:18px"></div>'
        + '<div style="margin-top:14px"><a href="#" onclick="lylitaTrennideValik(' + ryhmId + ');return false;" style="font-size:12px;color:var(--text3)" id="trennide-link-' + ryhmId + '">📜 Vaata teisi trenne</a></div>'
        + '<div id="trennide-valik-' + ryhmId + '" style="display:none;margin-top:8px">'
        + '<select id="kp-' + ryhmId + '" style="width:100%" onchange="avaNadal(' + ryhmId + ')">' + valikudHtml + '</select>'
        + '</div>'
      : '<div style="color:var(--text3);font-size:12px;margin-top:14px">Admin pole veel trenne genereerinud.</div>');

  if (vaikimisiValik) { document.getElementById('kp-' + ryhmId).value = vaikimisiValik; avaNadal(ryhmId); }
}

function lylitaTrennideValik(ryhmId) {
  var el = document.getElementById('trennide-valik-' + ryhmId);
  var link = document.getElementById('trennide-link-' + ryhmId);
  var avatud = el.style.display !== 'none';
  el.style.display = avatud ? 'none' : 'block';
  link.textContent = avatud ? '📜 Vaata teisi trenne' : '📜 Peida teised trennid';
}

async function avaNadal(ryhmId) {
  var kuupaev = document.getElementById('kp-' + ryhmId).value;
  if (!kuupaev) return;
  var r = await api('/api/padel/ryhm/' + ryhmId + '/nadal', { method: 'POST', body: JSON.stringify({ kuupaev: kuupaev }) });
  var div = document.getElementById('nadal-' + ryhmId);
  if (!r.ok) { div.innerHTML = '<div class="teade viga">' + (r.veateade || 'Viga') + '</div>'; return; }
  await naitaNadal(ryhmId, r.nadal_id);
}

async function naitaNadal(ryhmId, nadalId) {
  var r = await api('/api/padel/ryhm/' + ryhmId);
  var nadal = (r.nadalad || []).find(function(n) { return n.id === nadalId; });
  var div = document.getElementById('nadal-' + ryhmId);
  if (!nadal) { div.innerHTML = ''; return; }
  var kohad = nadal.kohad || [];
  var paar1 = kohad.filter(function(k) { return k.paar === 1; });
  var paar2 = kohad.filter(function(k) { return k.paar === 2; });
  var hoivatudLiigeIdd = kohad.filter(function(k) { return k.paar === 1 || k.paar === 2; }).map(function(k) { return k.liige_id; });
  var vabadLiikmed = (r.liikmed || []).filter(function(l) { return hoivatudLiigeIdd.indexOf(l.id) === -1; });

  // Üks "pesa" — kas täidetud (avatar + nimi + kinnituse olek) või tühi ("+ Lisa mängija").
  function pesa(k, sihtPaar) {
    if (!k) {
      var valikud = vabadLiikmed.map(function(l) {
        return '<div class="pesa-valik" onclick="lisaMangija(' + nadalId + ', ' + l.id + ', ' + sihtPaar + ', ' + ryhmId + ')">' + avatarHtml(l.foto_url, l.nimi, 22) + l.nimi + '</div>';
      }).join('') || '<div style="padding:8px;color:var(--text3);font-size:12px">Kõik grupi liikmed on juba kirjas</div>';
      return '<div class="pesa pesa-tuhi" onclick="lylitaPesaValik(this)">'
        + '<div class="pesa-pluss">+</div><div style="font-size:11px;color:var(--text3)">Lisa mängija</div>'
        + '<div class="pesa-valikud" style="display:none">' + valikud + '</div>'
        + '</div>';
    }
    var minaOlen = praeguneTootajaId && k.worker_id === praeguneTootajaId;
    if (!k.kinnitatud) {
      return '<div class="pesa pesa-ootel">'
        + avatarHtml(k.foto_url, k.nimi, 40)
        + '<div style="font-weight:700;font-size:13px;margin-top:4px">' + k.nimi + kylSilt(k.kylaline) + '</div>'
        + '<div style="color:#fbbf24;font-size:11px;margin:2px 0 6px">⏳ ootab kinnitust</div>'
        + (minaOlen
          ? '<div style="display:flex;gap:4px"><button class="nupp pisike" style="background:var(--groen);color:#052e16;padding:4px 8px;font-size:11px" onclick="kinnitaKoht(' + k.id + ', ' + ryhmId + ', ' + nadalId + ')">✅ Kinnita</button>'
            + '<button class="nupp hall pisike" style="padding:4px 8px;font-size:11px" onclick="eemaldaRegistreering(' + k.id + ', ' + ryhmId + ', ' + nadalId + ')">❌</button></div>'
          : '<button class="nupp hall pisike" style="padding:4px 8px;font-size:11px" onclick="eemaldaRegistreering(' + k.id + ', ' + ryhmId + ', ' + nadalId + ')">✕ Eemalda</button>')
        + '</div>';
    }
    return '<div class="pesa pesa-taidetud">'
      + avatarHtml(k.foto_url, k.nimi, 40)
      + '<div style="font-weight:700;font-size:13px;margin-top:4px">' + k.nimi + kylSilt(k.kylaline) + (minaOlen ? ' <span style="color:var(--groen);font-weight:400">(sina)</span>' : '') + '</div>'
      + '<div style="color:var(--groen);font-size:11px;margin:2px 0 6px">✅ kinnitatud</div>'
      + '<button class="nupp hall pisike" style="padding:4px 8px;font-size:11px" onclick="eemaldaRegistreering(' + k.id + ', ' + ryhmId + ', ' + nadalId + ')">✕ Eemalda</button>'
      + '</div>';
  }

  var setid = (nadal.setid && nadal.setid.length) ? nadal.setid : [{},{},{}];
  var setiReadHtml = setid.map(function(s, i) { return setiRidaHtml(nadalId, i, s.paar1_geimid, s.paar2_geimid); }).join('');

  var margis = kpOsa(nadal.kuupaev) === tanaISO() ? '🟢 TÄNA' : (kpOsa(nadal.kuupaev) > tanaISO() ? '📅 JÄRGMINE TRENN' : '📋 VARASEM TRENN');

  div.innerHTML =
    '<div style="font-size:16px;font-weight:800;margin-bottom:2px">' + margis + '</div>'
    + '<div class="paar-pealkiri" style="margin-bottom:10px">' + fmtKp(nadal.kuupaev) + '</div>'
    + '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">'
    + '<span style="font-size:12px;color:var(--text3)">🕐 Algusaeg:</span>'
    + '<input type="time" id="kell-' + nadalId + '" value="' + (nadal.kellaaeg ? nadal.kellaaeg.slice(0,5) : '') + '" style="width:100px">'
    + '<button class="nupp hall pisike" onclick="salvestaKellaaeg(' + ryhmId + ', ' + nadalId + ')">💾</button>'
    + '<span id="kell-teade-' + nadalId + '" style="font-size:12px"></span>'
    + '</div>'
    + '<div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">'
    + '<span style="font-size:12px;color:var(--text3)">🔑 Uksekood (Playtomic):</span>'
    + '<input type="text" inputmode="numeric" maxlength="4" id="uks-' + nadalId + '" value="' + (nadal.ukse_kood || '') + '" placeholder="0000" style="width:70px;text-align:center;font-weight:700;letter-spacing:2px">'
    + '<button class="nupp hall pisike" onclick="salvestaUksekood(' + ryhmId + ', ' + nadalId + ')">💾</button>'
    + '<span id="uks-teade-' + nadalId + '" style="font-size:12px"></span>'
    + (nadal.kellaaeg ? '<span style="font-size:11px;color:var(--text3)">📲 Kood saadetakse automaatselt kõigile 30 min enne algust</span>' : '<span style="font-size:11px;color:#fbbf24">⚠ Sisesta algusaeg, et kood automaatselt saadetaks</span>')
    + '</div>'
    + '<div class="paar-blokk"><div class="paar-pealkiri">Paar 1</div><div class="pesad-rida">'
      + pesa(paar1[0], 1) + pesa(paar1[1], 1) + '</div></div>'
    + '<div class="paar-blokk"><div class="paar-pealkiri">Paar 2</div><div class="pesad-rida">'
      + pesa(paar2[0], 2) + pesa(paar2[1], 2) + '</div></div>'
    + '<div class="paar-pealkiri">Tulemused (geim-geimilt, nt 6:3)</div>'
    + '<div id="setid-' + nadalId + '">' + setiReadHtml + '</div>'
    + '<div style="display:flex;gap:8px;margin:8px 0 12px">'
    + '<button class="nupp hall pisike" onclick="lisaSetiRida(' + nadalId + ')">+ Lisa geim</button>'
    + '</div>'
    + '<button class="nupp pisike" onclick="salvestaTulemus(' + ryhmId + ', ' + nadalId + ')">💾 Salvesta tulemus</button>'
    + '<div id="nadal-teade-' + nadalId + '" class="teade"></div>';
}

function lylitaPesaValik(el) {
  var valikud = el.querySelector('.pesa-valikud');
  var oliLahti = valikud.style.display !== 'none';
  document.querySelectorAll('.pesa-valikud').forEach(function(v) { v.style.display = 'none'; });
  valikud.style.display = oliLahti ? 'none' : 'block';
}

function setiRidaHtml(nadalId, idx, p1, p2) {
  return '<div class="tulemus-vorm" id="set-' + nadalId + '-' + idx + '" style="margin-bottom:6px">'
    + '<span style="color:var(--text3);font-size:12px;width:16px">' + (idx+1) + '.</span>'
    + '<input type="number" min="0" id="tul1-' + nadalId + '-' + idx + '" value="' + (p1 != null ? p1 : '') + '" placeholder="Paar 1">'
    + '<span>:</span>'
    + '<input type="number" min="0" id="tul2-' + nadalId + '-' + idx + '" value="' + (p2 != null ? p2 : '') + '" placeholder="Paar 2">'
    + '<button class="nupp hall pisike" onclick="document.getElementById(\'set-' + nadalId + '-' + idx + '\').remove()">✕</button>'
    + '</div>';
}

function lisaSetiRida(nadalId) {
  var kast = document.getElementById('setid-' + nadalId);
  var idx = kast.children.length;
  kast.insertAdjacentHTML('beforeend', setiRidaHtml(nadalId, idx, null, null));
}

async function salvestaUksekood(ryhmId, nadalId) {
  var kood = document.getElementById('uks-' + nadalId).value.trim();
  var teade = document.getElementById('uks-teade-' + nadalId);
  var r = await api('/api/padel/nadalad/' + nadalId + '/uksekood', { method: 'PUT', body: JSON.stringify({ kood: kood }) });
  teade.textContent = r.ok ? '✅ Salvestatud' : (r.veateade || 'Viga');
  teade.style.color = r.ok ? 'var(--groen)' : '#f87171';
  setTimeout(function() { teade.textContent = ''; }, 2500);
}

async function salvestaKellaaeg(ryhmId, nadalId) {
  var kellaaeg = document.getElementById('kell-' + nadalId).value.trim();
  var teade = document.getElementById('kell-teade-' + nadalId);
  var r = await api('/api/padel/nadalad/' + nadalId + '/kellaaeg', { method: 'PUT', body: JSON.stringify({ kellaaeg: kellaaeg }) });
  teade.style.color = r.ok ? 'var(--groen)' : '#f87171';
  teade.textContent = r.ok ? '✅ Salvestatud' : (r.veateade || 'Viga');
  setTimeout(function() { teade.textContent = ''; }, 2500);
}

async function lisaMangija(nadalId, liigeId, paar, ryhmId) {
  var r = await api('/api/padel/nadalad/' + nadalId + '/lisa', { method: 'POST', body: JSON.stringify({ liige_id: liigeId, paar: paar }) });
  if (!r.ok) { alert(r.veateade || 'Ei õnnestunud'); return; }
  await naitaNadal(ryhmId, nadalId);
  laadiSaldo();
}

async function kinnitaKoht(kohaId, ryhmId, nadalId) {
  var r = await api('/api/padel/kohad/' + kohaId + '/kinnita', { method: 'PUT' });
  if (!r.ok) { alert(r.veateade || 'Ei õnnestunud'); return; }
  await naitaNadal(ryhmId, nadalId);
}

async function eemaldaRegistreering(kohaId, ryhmId, nadalId) {
  await api('/api/padel/kohad/' + kohaId, { method: 'DELETE' });
  await naitaNadal(ryhmId, nadalId);
  laadiSaldo();
}

async function salvestaTulemus(ryhmId, nadalId) {
  var kast = document.getElementById('setid-' + nadalId);
  var setid = [];
  Array.prototype.forEach.call(kast.children, function(rida) {
    var p1input = rida.querySelector('input[id^="tul1-"]');
    var p2input = rida.querySelector('input[id^="tul2-"]');
    if (p1input && p2input && p1input.value !== '' && p2input.value !== '') {
      setid.push({ paar1_geimid: p1input.value, paar2_geimid: p2input.value });
    }
  });
  var teade = document.getElementById('nadal-teade-' + nadalId);
  if (!setid.length) { teade.className = 'teade viga'; teade.textContent = 'Sisesta vähemalt ühe geimi tulemus'; return; }
  var r = await api('/api/padel/nadalad/' + nadalId + '/setid', { method: 'PUT', body: JSON.stringify({ setid: setid }) });
  if (r.ok) { teade.className = 'teade ok'; teade.textContent = '✅ Tulemus salvestatud'; laadiRyhmSisu(ryhmId); if (statLaetud) laadiStatistika(statRyhm); }
  else { teade.className = 'teade viga'; teade.textContent = r.veateade || 'Viga'; }
}

async function saadaMeeldetuletus(ryhmId) {
  var r = await api('/api/padel/ryhm/' + ryhmId + '/meeldetuletus', { method: 'POST' });
  if (r.ok) alert('✅ Meeldetuletus saadetud kõigile grupi liikmetele');
  else alert('Viga: ' + (r.veateade || ''));
}

async function laeUlesFoto(liigeId, sisend, ryhmId, nadalId) {
  var fail = sisend.files[0];
  if (!fail) return;
  var vorm = new FormData();
  vorm.append('foto', fail);
  try {
    var vastus = await fetch('/api/padel/liikmed/' + liigeId + '/foto', {
      method: 'POST',
      headers: { 'x-session-token': TOKEN },
      body: vorm
    });
    var r = await vastus.json();
    if (r.ok) { if (nadalId) naitaNadal(ryhmId, nadalId); laadiRyhmSisu(ryhmId); }
    else alert('Viga: ' + (r.veateade || 'Pildi üleslaadimine ebaõnnestus'));
  } catch (e) {
    alert('Viga pildi üleslaadimisel');
  }
}

async function saadaSonum(ryhmId) {
  var r = await api('/api/padel/ryhm/' + ryhmId);
  if (!r.ok) return;
  var nimekiri = r.liikmed.map(function(l, i) { return (i + 1) + '. ' + l.nimi; }).join('\n');
  var valik = (prompt('Kellele saata?\n\n' + nimekiri + '\n\nKirjuta number (nt 1), või jäta tühjaks, et saata KÕIGILE:') || '').trim();
  var liigeId = null;
  if (valik) {
    var idx = parseInt(valik, 10);
    if (!Number.isInteger(idx) || idx < 1 || idx > r.liikmed.length) return alert('Vigane number — proovi uuesti ja kirjuta ainult number (nt 1).');
    liigeId = r.liikmed[idx - 1].id;
  }
  var pealkiri = (prompt('Pealkiri (nt "Palju õnne!" või "Maksa võlg ära"):') || '').trim();
  if (!pealkiri) return;
  var sonum = (prompt('Sõnumi tekst:') || '').trim();
  if (!sonum) return;
  var res = await api('/api/padel/ryhm/' + ryhmId + '/sonum', { method: 'POST', body: JSON.stringify({ pealkiri: pealkiri, sonum: sonum, liige_id: liigeId }) });
  if (res.ok) alert('✅ Sõnum saadetud (' + res.saadeti + ' saajale)');
  else alert('Viga: ' + (res.veateade || ''));
}

//  STATISTIKA
// ═══════════════════════════════════════════════════════════════════
var statLaetud = false;
var statRyhm = null;

async function laadiStatistika(ryhmId) {
  statLaetud = true;
  statRyhm = ryhmId || null;
  var div = document.getElementById('statSisu');
  div.innerHTML = '<div class="laadimine">Arvutan...</div>';
  var r = await api('/api/padel/statistika' + (statRyhm ? '?ryhm_id=' + statRyhm : ''));
  if (!r.ok) { div.innerHTML = '<div class="tyhi">Viga: ' + escH(r.veateade || '') + '</div>'; return; }
  var P = r.inimesed || {};
  function nimi(id) { return P[id] ? P[id].nimi : '?'; }
  function ees(id) { return nimi(id).split(' ')[0]; }
  function av(id, s) { return avatarHtml(P[id] && P[id].foto_url, nimi(id), s || 30); }
  function duoAv(ids, s) { return '<span class="avatarid">' + ids.map(function(id) { return avatarHtml(P[id] && P[id].foto_url, nimi(id), s || 26); }).join('') + '</span>'; }
  function duoNimi(ids) { return ids.map(ees).join(' & '); }
  function mark(v) { return (v > 0 ? '+' : '') + v; }
  function mangTekst(m) { return duoNimi(m.p1) + ' <b>' + m.g1 + ':' + m.g2 + '</b> ' + duoNimi(m.p2); }

  var html = '';
  if (r.ryhmad && r.ryhmad.length > 1) {
    html += '<div class="st-chipid"><button class="st-chip' + (!statRyhm ? ' aktiivne' : '') + '" onclick="laadiStatistika()">Kõik grupid</button>'
      + r.ryhmad.map(function(g) { return '<button class="st-chip' + (statRyhm === g.id ? ' aktiivne' : '') + '" onclick="laadiStatistika(' + g.id + ')">' + escH(g.nimi) + '</button>'; }).join('') + '</div>';
  }
  if (!r.mange) { div.innerHTML = html + '<div class="tyhi">Statistika tekib, kui trennidele on tulemused sisestatud (2 + 2 mängijat ja geimid).</div>'; return; }

  html += '<div style="font-size:12px;color:var(--text3);margin-bottom:14px">Arvestatud <b style="color:var(--text)">' + r.mange + ' trenni</b> ja ' + r.geime_kokku + ' geimi. Võit = paaril rohkem geime trenni peale kokku.</div>';

  // ── MINU NUMBRID ──
  var m = r.mina;
  if (m) {
    var seeriaTekst = m.seeria && m.seeria.pikkus > 1
      ? (m.seeria.tyyp === 'V' ? '🔥 ' + m.seeria.pikkus + ' võitu järjest' : m.seeria.tyyp === 'K' ? '🥶 ' + m.seeria.pikkus + ' kaotust järjest' : m.seeria.pikkus + ' viiki järjest')
      : '';
    html += '<div class="pea-alam">Minu numbrid</div>'
      + '<div class="st-ruudud">'
      + '<div class="st-ruut"><div class="n">Trenne</div><div class="v">' + m.mange + '</div><div class="a">' + m.koht_edetabelis + '. koht võidu% järgi</div></div>'
      + '<div class="st-ruut"><div class="n">Võidu %</div><div class="v" style="color:var(--groen)">' + m.voidu_pr + '%</div><div class="a">' + m.voidud + 'V · ' + m.viigid + 'Vi · ' + m.kaotused + 'K</div></div>'
      + '<div class="st-ruut"><div class="n">Geimivahe</div><div class="v" style="color:' + (m.geimivahe >= 0 ? 'var(--groen)' : '#f87171') + '">' + mark(m.geimivahe) + '</div><div class="a">' + m.geime_poolt + ' : ' + m.geime_vastu + '</div></div>'
      + '<div class="st-ruut"><div class="n">Geime / trenn</div><div class="v">' + m.keskm_geime + '</div><div class="a">keskmiselt võidetud</div></div>'
      + '<div class="st-ruut"><div class="n">Pikim võiduseeria</div><div class="v">' + m.pikim_voiduseeria + '</div><div class="a">' + (seeriaTekst || '&nbsp;') + '</div></div>'
      + '<div class="st-ruut"><div class="n">Suurim võit</div><div class="v">' + (m.suurim_voit != null ? '+' + m.suurim_voit : '—') + '</div><div class="a">' + (m.suurim_kaotus != null ? 'suurim kaotus −' + m.suurim_kaotus : '&nbsp;') + '</div></div>'
      + '</div>'
      + '<div style="display:flex;align-items:center;gap:10px;margin-top:10px"><span style="font-size:11px;color:var(--text3)">Viimased trennid:</span><span class="vorm">'
      + m.viimased.map(function(t) { return '<span class="' + t + '">' + t + '</span>'; }).join('') + '</span></div>';

    // Partnerid
    if (m.partnerid.length) {
      var parim = m.partnerid.filter(function(p) { return p.mange >= 2; })[0] || m.partnerid[0];
      html += '<div class="pea-alam">Kellega sul klapib</div>'
        + '<div class="st-kaart" style="margin-bottom:10px;background:rgba(74,222,128,0.08);border:0.5px solid rgba(74,222,128,0.25)">'
        + '<div class="silt">💚 Parim partner</div><div class="kes">' + av(parim.worker_id, 34) + escH(nimi(parim.worker_id)) + '</div>'
        + '<div class="mis">' + parim.mange + ' trenni koos · ' + parim.voidud + ' võitu · ' + parim.voidu_pr + '% · geimivahe ' + mark(parim.geimivahe) + '</div></div>'
        + m.partnerid.map(function(p) {
          return '<div class="st-rida">' + av(p.worker_id, 30) + '<span class="nimi"><b>' + escH(nimi(p.worker_id)) + '</b><small>' + p.mange + ' trenni koos · geimivahe ' + mark(p.geimivahe) + '</small>'
            + '<div class="riba"><div style="width:' + p.voidu_pr + '%"></div></div></span><span class="num">' + p.voidu_pr + '%</span></div>';
        }).join('');
    }
    // Vastased
    if (m.lemmikvastane || m.raskeim_vastane) {
      html += '<div class="pea-alam">Vastased</div><div class="st-kaardid">';
      if (m.lemmikvastane) html += '<div class="st-kaart"><div class="silt">😎 Lemmikvastane</div><div class="kes">' + av(m.lemmikvastane.worker_id, 30) + escH(nimi(m.lemmikvastane.worker_id)) + '</div><div class="mis">Võidad teda ' + m.lemmikvastane.voidu_pr + '% (' + m.lemmikvastane.voidud + '/' + m.lemmikvastane.mange + ')</div></div>';
      if (m.raskeim_vastane && (!m.lemmikvastane || m.raskeim_vastane.worker_id !== m.lemmikvastane.worker_id)) html += '<div class="st-kaart"><div class="silt">😤 Kõige raskem vastane</div><div class="kes">' + av(m.raskeim_vastane.worker_id, 30) + escH(nimi(m.raskeim_vastane.worker_id)) + '</div><div class="mis">Võidad teda ainult ' + m.raskeim_vastane.voidu_pr + '% (' + m.raskeim_vastane.voidud + '/' + m.raskeim_vastane.mange + ')</div></div>';
      html += '</div>';
    }
  }

  // ── GRUPI REKORDID ──
  var rk = r.rekordid || {};
  var rekordRead = [];
  if (rk.koige_aktiivsem) rekordRead.push(['🏃 Kõige aktiivsem', rk.koige_aktiivsem.worker_id, rk.koige_aktiivsem.mange + ' trenni']);
  if (rk.parim_voidu_pr) rekordRead.push(['👑 Kõrgeim võidu %', rk.parim_voidu_pr.worker_id, rk.parim_voidu_pr.voidu_pr + '% (' + rk.parim_voidu_pr.mange + ' trenni)']);
  if (rk.enim_geime_keskm) rekordRead.push(['🎯 Enim geime trenni kohta', rk.enim_geime_keskm.worker_id, rk.enim_geime_keskm.keskm_geime + ' keskmiselt']);
  if (rk.parim_geimivahe) rekordRead.push(['📈 Parim geimivahe', rk.parim_geimivahe.worker_id, mark(rk.parim_geimivahe.geimivahe) + ' kokku']);
  html += '<div class="pea-alam">Grupi rekordid</div>'
    + rekordRead.map(function(x) {
      return '<div class="st-rida">' + av(x[1], 30) + '<span class="nimi"><b>' + escH(nimi(x[1])) + '</b><small>' + x[0] + '</small></span><span class="num">' + x[2] + '</span></div>';
    }).join('');
  if (rk.suurim_voit) html += '<div class="st-rida"><span style="font-size:18px;width:30px;text-align:center">💥</span><span class="nimi"><b>Suurim võit</b><small>' + fmtKpS(rk.suurim_voit.kuupaev) + ' · ' + mangTekst(rk.suurim_voit) + '</small></span><span class="num">' + Math.abs(rk.suurim_voit.g1 - rk.suurim_voit.g2) + ' geimi</span></div>';
  if (rk.enim_geime_trennis) html += '<div class="st-rida"><span style="font-size:18px;width:30px;text-align:center">⏱</span><span class="nimi"><b>Kõige pikem trenn</b><small>' + fmtKpS(rk.enim_geime_trennis.kuupaev) + ' · ' + mangTekst(rk.enim_geime_trennis) + '</small></span><span class="num">' + (rk.enim_geime_trennis.g1 + rk.enim_geime_trennis.g2) + ' geimi</span></div>';

  // ── PARIMAD PAARID ──
  if (r.parimad_paarid && r.parimad_paarid.length) {
    html += '<div class="pea-alam">Parimad paarid <span style="text-transform:none;letter-spacing:0;font-weight:400">(vähemalt 2 trenni koos)</span></div>'
      + r.parimad_paarid.map(function(d) {
        return '<div class="st-rida">' + duoAv(d.mangijad) + '<span class="nimi"><b>' + escH(duoNimi(d.mangijad)) + '</b><small>' + d.mange + ' trenni · ' + d.voidud + ' võitu · geimivahe ' + mark(d.geimivahe) + '</small></span><span class="num">' + d.voidu_pr + '%</span></div>';
      }).join('');
  }

  // ── PINGELISEMAD VASTASSEISUD ──
  if (r.pingelisemad_vastasseisud && r.pingelisemad_vastasseisud.length) {
    html += '<div class="pea-alam">Kõige pingelisemad vastasseisud</div>'
      + r.pingelisemad_vastasseisud.map(function(v) {
        return '<div class="st-rida"><span class="nimi"><b>' + escH(duoNimi(v.duo1)) + ' <span style="color:var(--text3);font-weight:400">vs</span> ' + escH(duoNimi(v.duo2)) + '</b>'
          + '<small>' + v.mange + ' trenni · seis ' + v.duo1_voidud + ':' + v.duo2_voidud + '</small></span>'
          + '<span class="num" title="Keskmine geimide vahe">±' + v.keskm_vahe + '</span></div>';
      }).join('')
      + '<div style="font-size:11px;color:var(--text3);margin-top:4px">±X = keskmine geimide vahe nende paaride vahel (mida väiksem, seda tasavägisem).</div>';
  }

  // ── TASAVÄGISEMAD TRENNID ──
  if (r.tasavagisemad_mangud && r.tasavagisemad_mangud.length) {
    html += '<div class="pea-alam">Kõige tasavägisemad trennid</div>'
      + r.tasavagisemad_mangud.map(function(g) {
        return '<div class="st-rida"><span class="nimi"><b>' + escH(duoNimi(g.p1)) + ' <span style="color:var(--groen)">' + g.g1 + ':' + g.g2 + '</span> ' + escH(duoNimi(g.p2)) + '</b><small>' + fmtKpS(g.kuupaev) + ' · ' + escH(g.ryhm) + ' · ' + (g.setid || []).map(function(x) { return x.g1 + ':' + x.g2; }).join(', ') + '</small></span></div>';
      }).join('');
  }

  // ── KÕIK MÄNGIJAD ──
  html += '<div class="pea-alam">Kõik mängijad</div>'
    + '<table><thead><tr><th>Mängija</th><th style="text-align:right">Trenne</th><th style="text-align:right">Võit %</th><th style="text-align:right">Geime/tr</th><th style="text-align:right">+/−</th></tr></thead><tbody>'
    + r.mangijad.map(function(p) {
      var mina = r.mina && p.worker_id === r.mina.worker_id;
      return '<tr' + (mina ? ' style="background:rgba(74,222,128,0.07)"' : '') + '><td>' + av(p.worker_id, 22) + escH(p.nimi) + '</td><td style="text-align:right">' + p.mange + '</td><td style="text-align:right;font-weight:700;color:var(--groen)">' + p.voidu_pr + '%</td><td style="text-align:right">' + p.keskm_geime + '</td><td style="text-align:right;color:' + (p.geimivahe >= 0 ? 'var(--text2)' : '#f87171') + '">' + mark(p.geimivahe) + '</td></tr>';
    }).join('') + '</tbody></table>';

  div.innerHTML = html;
}

init();
</script>
<script>
  // Android Chrome/Brave: kellaaja/kuupäeva valija avaneb väljale vajutades (mitte ainult ikoonile)
  (function() {
    document.addEventListener("click", function(e) {
      var el = e.target;
      if (!el || el.tagName !== "INPUT") return;
      if (el.type !== "time" && el.type !== "date") return;
      if (typeof el.showPicker !== "function") return;
      if (/iPhone|iPad|iPod/.test(navigator.userAgent)) return;
      try { el.showPicker(); } catch (err) {}
    });
  })();
</script>
</body>
</html>

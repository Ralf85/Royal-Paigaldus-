<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Royal Paigaldus</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d0f13; color: #e2e8f0; }
    .header { background: #13161c; border-bottom: 0.5px solid rgba(255,255,255,0.07); padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 30px; height: 30px; background: linear-gradient(135deg, #c9a84c, #f0d080); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .brand-name { font-size: 13px; font-weight: 700; color: #c9a84c; }
    .brand-sub { font-size: 10px; color: #555; }
    .logout { font-size: 11px; color: #555; background: none; border: 0.5px solid #2a2a2a; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
    .logout:hover { border-color: #ef4444; color: #ef4444; }
    .konteiner { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }
    .tabid { display: flex; gap: 4px; margin-bottom: 20px; background: #13161c; padding: 5px; border-radius: 10px; width: fit-content; border: 0.5px solid rgba(255,255,255,0.06); }
    .tab { padding: 9px 16px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 500; color: #555; transition: all 0.2s; border: none; background: none; }
    .tab.ak { background: #c9a84c; color: #0d0f13; font-weight: 700; }
    .tab:hover:not(.ak) { color: #aaa; }
    .sektsioon { display: none; }
    .sektsioon.nhtav { display: block; }
    .kaart { background: #13161c; border: 0.5px solid rgba(255,255,255,0.06); border-radius: 14px; overflow: hidden; margin-bottom: 16px; }
    .kaart-hdr { padding: 14px 18px; border-bottom: 0.5px solid rgba(255,255,255,0.05); font-size: 14px; font-weight: 600; color: #d0d0d0; }
    .kaart-body { padding: 16px 18px; }
    .vorm-rida { display: grid; gap: 10px; margin-bottom: 12px; }
    .vorm-rida.col2 { grid-template-columns: 1fr 1fr; }
    .vorm-rida.col3 { grid-template-columns: 1fr 1fr 1fr; }
    .vorm-rida.col4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
    .vorm-grupp { display: flex; flex-direction: column; gap: 5px; }
    .vorm-grupp label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.8px; }
    input, select, textarea { background: #0d0f13; border: 0.5px solid #252830; border-radius: 8px; padding: 9px 12px; color: #e2e8f0; font-size: 14px; width: 100%; outline: none; font-family: inherit; }
    input:focus, select:focus { border-color: #c9a84c; }
    .nupp { border: none; border-radius: 8px; padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .nupp.kull { background: #c9a84c; color: #0d0f13; }
    .nupp.roheline { background: #16a34a; color: #fff; }
    .nupp.punane { background: #dc2626; color: #fff; font-size: 12px; padding: 5px 10px; }
    .nupp.hall { background: #252830; color: #aaa; }
    .nupp.kustuta-tootaja { background: #3d0a0a; border: 0.5px solid #6b1010; color: #ef4444; font-size: 12px; padding: 6px 12px; }
    .nupp.kustuta-tootaja:hover { background: #5a1010; }
    .teade { border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-top: 10px; display: none; }
    .teade.ok { background: #14532d; color: #86efac; }
    .teade.viga { background: #7f1d1d; color: #fca5a5; }
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #444; padding: 10px 12px; text-align: left; border-bottom: 0.5px solid rgba(255,255,255,0.05); }
    td { padding: 10px 12px; font-size: 13px; border-bottom: 0.5px solid rgba(255,255,255,0.03); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    .kuu-rida { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .kuu-rida select { width: auto; }
    .raport-nupp { background: #7c3aed; color: #fff; border: none; border-radius: 8px; padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
    .worker-kaart { background: #13161c; border: 0.5px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
    .stat { background: #0d0f13; border-radius: 8px; padding: 10px 12px; }
    .stat-n { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #444; margin-bottom: 4px; }
    .stat-v { font-size: 18px; font-weight: 700; }
    .v-sinine { color: #5b9cf6; } .v-roheline { color: #4ade80; } .v-kollane { color: #fbbf24; }
    .kirjed-list { border-top: 0.5px solid rgba(255,255,255,0.05); padding-top: 10px; }
    .kirje { display: flex; gap: 10px; font-size: 12px; padding: 5px 0; color: #666; border-bottom: 0.5px solid rgba(255,255,255,0.03); }
    .kirje:last-child { border-bottom: none; }
    .kirje span:first-child { color: #aaa; min-width: 70px; }
    .ettevote-rida { display: grid; grid-template-columns: 24px 1fr 100px; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 0.5px solid rgba(255,255,255,0.04); }
    .ettevote-rida:last-child { border-bottom: none; }
  </style>
</head>
<body>
<div class="header">
  <div class="brand">
    <div class="brand-logo">👑</div>
    <div><div class="brand-name">ROYAL PAIGALDUS</div><div class="brand-sub">Admin paneel</div></div>
  </div>
  <button class="logout" onclick="välju()">Logi välja</button>
</div>

<div class="konteiner">
  <div class="tabid">
    <button class="tab ak" onclick="avatTab(0)">📊 Kokkuvõte</button>
    <button class="tab" onclick="avatTab(1)">💳 Maksed</button>
    <button class="tab" onclick="avatTab(2)">👷 Töötajad</button>
    <button class="tab" onclick="avatTab(3)">🏗️ Objektid</button>
    <button class="tab" onclick="avatTab(4)">📅 Tulevased tööd</button>
  </div>

  <div class="sektsioon nhtav" id="tab0">
    <div class="kuu-rida">
      <select id="kv-kuu"></select>
      <select id="kv-aasta"></select>
      <button class="nupp kull" onclick="laadiKokkuvote()">Näita</button>
      <a class="raport-nupp" href="#" onclick="laadiCSV(event)">⬇ CSV raport</a>
    </div>
    <div id="kokkuvoteKast"></div>
  </div>

  <div class="sektsioon" id="tab1">
    <div class="kaart">
      <div class="kaart-hdr">➕ Lisa makse</div>
      <div class="kaart-body">
        <div class="vorm-rida col4">
          <div class="vorm-grupp"><label>Töötaja</label><select id="makse-worker"></select></div>
          <div class="vorm-grupp"><label>Summa (€)</label><input type="number" id="makse-summa" placeholder="500" step="0.01"></div>
          <div class="vorm-grupp"><label>Kuupäev</label><input type="date" id="makse-kuupaev"></div>
          <div class="vorm-grupp"><label>Kommentaar</label><input type="text" id="makse-komm" placeholder="Mai ettemaks"></div>
        </div>
        <button class="nupp roheline" onclick="lisaMakse()">💾 Salvesta makse</button>
        <div class="teade" id="makse-teade"></div>
      </div>
    </div>
    <div class="kaart">
      <div class="kaart-hdr">📋 Maksete ajalugu</div>
      <div style="padding:0"><div id="maksedTabel"></div></div>
    </div>
  </div>

  <div class="sektsioon" id="tab2">
    <div class="kaart">
      <div class="kaart-hdr">➕ Lisa töötaja</div>
      <div class="kaart-body">
        <div class="vorm-rida col2">
          <div class="vorm-grupp"><label>Nimi</label><input type="text" id="t-nimi" placeholder="Vaiko"></div>
          <div class="vorm-grupp"><label>PIN-kood</label><input type="text" id="t-pin" placeholder="1234" maxlength="6"></div>
        </div>
        <button class="nupp roheline" onclick="lisaTootaja()">➕ Lisa töötaja</button>
        <div class="teade" id="tootaja-teade"></div>
      </div>
    </div>
    <div class="kaart">
      <div class="kaart-hdr">👥 Töötajad ja ettevõtted</div>
      <div id="tootajadSisu"></div>
    </div>
  </div>

  <div class="sektsioon" id="tab3">
    <div class="kaart">
      <div class="kaart-hdr">➕ Lisa objekt</div>
      <div class="kaart-body">
        <div class="vorm-rida col2">
          <div class="vorm-grupp"><label>Ettevõte</label><select id="obj-ettevote"></select></div>
          <div class="vorm-grupp"><label>Objekti nimi</label><input type="text" id="obj-nimi" placeholder="LIDL Tartu Annelinn"></div>
        </div>
        <button class="nupp roheline" onclick="lisaObjekt()">➕ Lisa objekt</button>
        <div class="teade" id="objekt-teade"></div>
      </div>
    </div>
    <div class="kaart">
      <div class="kaart-hdr">📋 Objektide nimekiri</div>
      <div id="objektidTabel"></div>
    </div>
  </div>

  <div class="sektsioon" id="tab4">
    <div class="kaart">
      <div class="kaart-hdr">➕ Lisa tulevane töö</div>
      <div class="kaart-body">
        <div class="vorm-rida col2">
          <div class="vorm-grupp"><label>Ettevõte</label><select id="tt-ettevote" onchange="laadiTTObjektid()"></select></div>
          <div class="vorm-grupp"><label>Objekt (vabatahtlik)</label><select id="tt-objekt"><option value="">— Pole määratud —</option></select></div>
        </div>
        <div class="vorm-rida col3">
          <div class="vorm-grupp"><label>Kuupäev</label><input type="date" id="tt-kuupaev"></div>
          <div class="vorm-grupp"><label>Algus</label><input type="time" id="tt-algus" value="08:00"></div>
          <div class="vorm-grupp"><label>Lõpp</label><input type="time" id="tt-lopp" value="17:00"></div>
        </div>
        <div class="vorm-rida">
          <div class="vorm-grupp"><label>Kirjeldus</label><input type="text" id="tt-kirjeldus" placeholder="nt. Riiulite paigaldus..."></div>
        </div>
        <div class="vorm-grupp" style="margin-bottom:12px">
          <label style="margin-bottom:8px;display:block">Töötajad (vali üks või mitu)</label>
          <div id="tt-workers-valik" style="background:#0d0f13;border:0.5px solid #252830;border-radius:8px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px">
            <span style="color:#555;font-size:13px">Laadimine...</span>
          </div>
        </div>
        <button class="nupp kull" onclick="lisaTulevaneToo()">📅 Lisa töö valitud töötajatele</button>
        <div class="teade" id="tt-teade"></div>
      </div>
    </div>
    <div class="kaart">
      <div class="kaart-hdr">📋 Tulevased tööd</div>
      <div id="tulevasteToodTabel"></div>
    </div>
  </div>
</div>

<script>
const KUUD = ['Jaanuar','Veebruar','Märts','Aprill','Mai','Juuni','Juuli','August','September','Oktoober','November','Detsember'];
let kõikEttevotted = [];
let TOKEN = localStorage.getItem('adminToken') || '';
setInterval(() => { TOKEN = localStorage.getItem('adminToken') || TOKEN; }, 30000);

async function api(url, opts = {}) {
  opts.headers = opts.headers || {};
  opts.headers['x-session-token'] = TOKEN;
  opts.headers['Content-Type'] = opts.headers['Content-Type'] || 'application/json';
  const r = await fetch(url, opts);
  const token = r.headers.get('x-session-token');
  if (token) { TOKEN = token; localStorage.setItem('adminToken', token); }
  return r.json();
}

const tabid = document.querySelectorAll('.tab');
const sektsioonid = document.querySelectorAll('.sektsioon');
function avatTab(i) {
  tabid.forEach((t,j) => t.classList.toggle('ak', i===j));
  sektsioonid.forEach((s,j) => s.classList.toggle('nhtav', i===j));
  if(i===0) laadiKokkuvote();
  if(i===1) { laadiWorkerSelect(); laadiMaksed(); }
  if(i===2) laadiTootajad();
  if(i===3) laadiObjektid();
  if(i===4) { if(kõikEttevotted.length) laadiTTWorkers(); else setTimeout(()=>{laadiTTWorkers();}, 500); laadiTulevasteToodTabel(); }
}

async function init() {
  kõikEttevotted = await api('/api/admin/ettevotted');
  if (!Array.isArray(kõikEttevotted)) { window.location='/admin-login'; return; }
  const t = new Date();
  const kvKuu = document.getElementById('kv-kuu');
  KUUD.forEach((k,i) => { const o = document.createElement('option'); o.value=i+1; o.textContent=k; if(i===t.getMonth()) o.selected=true; kvKuu.appendChild(o); });
  const kvAasta = document.getElementById('kv-aasta');
  for(let y=t.getFullYear(); y>=t.getFullYear()-2; y--) { const o = document.createElement('option'); o.value=y; o.textContent=y; kvAasta.appendChild(o); }
  document.getElementById('makse-kuupaev').value = t.toISOString().split('T')[0];
  document.getElementById('tt-kuupaev').value = t.toISOString().split('T')[0];
  const objEttevote = document.getElementById('obj-ettevote');
  kõikEttevotted.forEach(e => { objEttevote.innerHTML += `<option value="${e.id}">${e.nimi}</option>`; });
  laadiKokkuvote();
}

async function laadiKokkuvote() {
  const kuu = document.getElementById('kv-kuu').value;
  const aasta = document.getElementById('kv-aasta').value;
  const andmed = await api(`/api/admin/kokkuvote?aasta=${aasta}&kuu=${kuu}`);
  const div = document.getElementById('kokkuvoteKast');
  if(!andmed.length) { div.innerHTML='<div style="padding:32px;text-align:center;color:#444">Selle kuu kirjeid pole</div>'; return; }
  div.innerHTML = andmed.map(w => `
    <div class="worker-kaart">
      <div style="font-size:16px;font-weight:700;margin-bottom:12px">👷 ${w.nimi}</div>
      <div class="stats-grid">
        <div class="stat"><div class="stat-n">Tunnid</div><div class="stat-v v-sinine">${w.tunnid} h</div></div>
        <div class="stat"><div class="stat-n">Teenitud</div><div class="stat-v v-roheline">${w.teenitud} €</div></div>
        <div class="stat"><div class="stat-n">Makstud</div><div class="stat-v" style="color:#666">${w.makstud} €</div></div>
        <div class="stat"><div class="stat-n">Saada veel</div><div class="stat-v v-kollane">${parseFloat(w.saadaVeel)>0?'+':''}${w.saadaVeel} €</div></div>
      </div>
      ${w.kirjed.length ? `<div class="kirjed-list">${w.kirjed.map(k=>`<div class="kirje">
        <span>${formatKp(k.kuupaev)}</span>
        <span>${k.ettevote_nimi}</span>
        <span>${k.objekt_nimi||'—'}</span>
        <span>${k.algus.slice(0,5)}–${k.lopp.slice(0,5)}</span>
        <span>${parseFloat(k.tunnid).toFixed(2)}h</span>
        ${k.ettevote_tyyp === 'muu'
          ? `<span style="display:flex;align-items:center;gap:4px">
               <input type="number" value="${k.muu_tunnitasu||''}" placeholder="€/h" step="0.5" min="0"
                 style="width:65px;padding:3px 6px;font-size:12px;background:#0d0f13;border:0.5px solid ${k.muu_tunnitasu ? '#c9a84c' : '#3a3d45'};border-radius:5px;color:#e2e8f0"
                 id="muu-tasu-${k.id}" onchange="salvesta MuuTasu(${k.id}, this)">
               <button onclick="salvestaMuuTasu(${k.id})" style="background:#c9a84c;border:none;border-radius:5px;padding:3px 7px;font-size:11px;font-weight:700;color:#0d0f13;cursor:pointer">✓</button>
             </span>`
          : `<span>${k.tunnitasu}€/h</span>`}
      </div>`).join('')}</div>` : ''}
    </div>`).join('');
}

function laadiCSV(e) {
  e.preventDefault();
  const kuu = document.getElementById('kv-kuu').value;
  const aasta = document.getElementById('kv-aasta').value;
  window.location=`/api/admin/raport-csv?aasta=${aasta}&kuu=${kuu}&_token=${TOKEN}`;
}

async function laadiTootajad() {
  const workers = await api('/api/admin/tootajad');
  const div = document.getElementById('tootajadSisu');
  let html = '';
  for(const w of workers) {
    const we = await api(`/api/admin/tootaja-ettevotted/${w.id}`);
    const weMap = {};
    we.forEach(x => weMap[x.ettevote_id] = x.tunnitasu);
    html += `<div style="padding:16px 18px;border-bottom:0.5px solid rgba(255,255,255,0.05)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <input type="text" value="${w.nimi}" id="wn-${w.id}" style="width:130px;font-weight:600">
          <span style="color:#555;font-size:12px">PIN:</span>
          <input type="text" value="${w.pin}" id="wp-${w.id}" style="width:70px">
          <label style="font-size:12px;color:#555;display:flex;align-items:center;gap:5px">
            <input type="checkbox" ${w.aktiivne?'checked':''} id="wa-${w.id}"> Aktiivne
          </label>
        </div>
        <div style="display:flex;gap:8px">
          <button class="nupp hall" style="font-size:12px;padding:6px 14px" onclick="uuendaTootaja(${w.id})">Salvesta</button>
          <button class="nupp kustuta-tootaja" onclick="kustutaTootaja(${w.id}, '${w.nimi}')">🗑 Kustuta</button>
        </div>
      </div>
      <div style="font-size:11px;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Ettevõtted ja tunnitasud</div>
      ${kõikEttevotted.map(e => {
        const onMaara = weMap[e.id] !== undefined;
        const tasu = weMap[e.id] || '';
        return `<div class="ettevote-rida">
          <input type="checkbox" id="ec-${w.id}-${e.id}" ${onMaara?'checked':''} onchange="toggleEttevote(${w.id}, ${e.id}, this)">
          <span style="flex:1;font-size:13px">${e.nimi}</span>
          <input type="number" id="et-${w.id}-${e.id}" value="${tasu}" placeholder="€/h" step="0.5" style="width:90px" ${onMaara?'':'disabled'} onchange="uuendaEttevoteTasu(${w.id}, ${e.id})">
        </div>`;
      }).join('')}
    </div>`;
  }
  div.innerHTML = html || '<div style="padding:24px;text-align:center;color:#444">Töötajaid pole</div>';
}

async function lisaTootaja() {
  const nimi = document.getElementById('t-nimi').value;
  const pin = document.getElementById('t-pin').value;
  if(!nimi||!pin) return naitaTeade('tootaja-teade','viga','Täida kõik väljad!');
  const r = await api('/api/admin/tootajad', {method:'POST', body: JSON.stringify({nimi,pin})});
  if(r.ok) { naitaTeade('tootaja-teade','ok','✅ Lisatud!'); document.getElementById('t-nimi').value=''; document.getElementById('t-pin').value=''; laadiTootajad(); }
  else naitaTeade('tootaja-teade','viga', r.veateade);
}

async function uuendaTootaja(id) {
  const nimi = document.getElementById(`wn-${id}`).value;
  const pin = document.getElementById(`wp-${id}`).value;
  const aktiivne = document.getElementById(`wa-${id}`).checked;
  await api(`/api/admin/tootajad/${id}`, {method:'PUT', body: JSON.stringify({nimi,pin,aktiivne})});
  laadiTootajad();
}

async function kustutaTootaja(id, nimi) {
  if(!confirm(`Kustutad töötaja "${nimi}"?\n\nSEE KUSTUTAB KA kõik tema töökirjed, maksed ja tulevased tööd!\n\nSee on pöördumatu!`)) return;
  const r = await api(`/api/admin/tootajad/${id}`, {method:'DELETE'});
  if(r.ok) { naitaTeade('tootaja-teade','ok',`✅ ${nimi} kustutatud`); laadiTootajad(); }
  else naitaTeade('tootaja-teade','viga', r.veateade || 'Kustutamine ebaõnnestus');
}

async function toggleEttevote(workerId, ettevoteId, checkbox) {
  const tasuInput = document.getElementById(`et-${workerId}-${ettevoteId}`);
  if(checkbox.checked) { tasuInput.disabled = false; tasuInput.focus(); }
  else {
    tasuInput.disabled = true; tasuInput.value = '';
    await api(`/api/admin/tootaja-ettevotted/${workerId}/${ettevoteId}`, {method:'DELETE'});
  }
}

async function uuendaEttevoteTasu(workerId, ettevoteId) {
  const checkbox = document.getElementById(`ec-${workerId}-${ettevoteId}`);
  const tasu = document.getElementById(`et-${workerId}-${ettevoteId}`).value;
  if(!checkbox.checked || !tasu) return;
  await api('/api/admin/tootaja-ettevotted', {method:'POST', body: JSON.stringify({worker_id:workerId, ettevote_id:ettevoteId, tunnitasu:tasu})});
}

async function laadiObjektid() {
  const r = await api('/api/admin/objektid');
  let html = '<table><thead><tr><th>Ettevõte</th><th>Nimi</th><th>Aktiivne</th><th>Salvesta</th></tr></thead><tbody>';
  if(Array.isArray(r)) {
    r.forEach(o => { html += `<tr><td style="color:#666">${o.ettevote_nimi}</td><td><input type="text" value="${o.nimi}" id="on-${o.id}" style="width:200px"></td><td><input type="checkbox" ${o.aktiivne?'checked':''} id="oa-${o.id}"></td><td><button class="nupp hall" style="font-size:12px;padding:5px 12px" onclick="uuendaObjekt(${o.id})">Salvesta</button></td></tr>`; });
  }
  document.getElementById('objektidTabel').innerHTML = html + '</tbody></table>';
}

async function lisaObjekt() {
  const nimi = document.getElementById('obj-nimi').value;
  const ettevote_id = document.getElementById('obj-ettevote').value;
  if(!nimi) return naitaTeade('objekt-teade','viga','Sisesta objekti nimi!');
  const r = await api('/api/admin/objektid', {method:'POST', body: JSON.stringify({nimi, ettevote_id})});
  if(r.ok) { naitaTeade('objekt-teade','ok','✅ Lisatud!'); document.getElementById('obj-nimi').value=''; laadiObjektid(); }
  else naitaTeade('objekt-teade','viga', r.veateade || 'Viga');
}

async function uuendaObjekt(id) {
  const nimi = document.getElementById(`on-${id}`).value;
  const aktiivne = document.getElementById(`oa-${id}`).checked;
  await api(`/api/admin/objektid/${id}`, {method:'PUT', body: JSON.stringify({nimi,aktiivne})});
  laadiObjektid();
}

async function laadiWorkerSelect() {
  const workers = await api('/api/admin/tootajad');
  const sel = document.getElementById('makse-worker');
  sel.innerHTML = '';
  workers.filter(w=>w.aktiivne).forEach(w => sel.innerHTML += `<option value="${w.id}">${w.nimi}</option>`);
}

async function laadiMaksed() {
  const r = await api('/api/admin/maksed');
  let html = '<table><thead><tr><th>Kuupäev</th><th>Töötaja</th><th>Summa</th><th>Kommentaar</th><th></th></tr></thead><tbody>';
  if(Array.isArray(r)) r.forEach(m => { html += `<tr><td>${formatKp(m.kuupaev)}</td><td>${m.worker_nimi}</td><td><strong>${parseFloat(m.summa).toFixed(2)} €</strong></td><td style="color:#666">${m.kommentaar||'—'}</td><td><button class="nupp punane" onclick="kustutaMakse(${m.id})">🗑</button></td></tr>`; });
  document.getElementById('maksedTabel').innerHTML = html + '</tbody></table>';
}

async function lisaMakse() {
  const worker_id=document.getElementById('makse-worker').value;
  const summa=document.getElementById('makse-summa').value;
  const kuupaev=document.getElementById('makse-kuupaev').value;
  const kommentaar=document.getElementById('makse-komm').value;
  if(!summa||!kuupaev) return naitaTeade('makse-teade','viga','Täida väljad!');
  const r = await api('/api/admin/maksed', {method:'POST', body: JSON.stringify({worker_id,summa,kuupaev,kommentaar})});
  if(r.ok){naitaTeade('makse-teade','ok','✅ Salvestatud!');document.getElementById('makse-summa').value='';laadiMaksed();}
  else naitaTeade('makse-teade','viga',r.veateade);
}

async function kustutaMakse(id) {
  if(!confirm('Kustutad makse?')) return;
  await api(`/api/admin/maksed/${id}`, {method:'DELETE'});
  laadiMaksed();
}

async function laadiTTWorkers() {
  const workers = await api('/api/admin/tootajad');
  const ettevotted = kõikEttevotted;
  const ettSel = document.getElementById('tt-ettevote');
  ettSel.innerHTML = '';
  ettevotted.forEach(e => ettSel.innerHTML += `<option value="${e.id}">${e.nimi}</option>`);
  laadiTTObjektid();
  const div = document.getElementById('tt-workers-valik');
  if(!workers || !Array.isArray(workers) || !workers.length) { div.innerHTML = '<span style="color:#555;font-size:13px">Töötajaid pole</span>'; return; }
  div.innerHTML = workers.filter(w=>w.aktiivne).map(w => `
    <label style="display:flex;align-items:center;gap:6px;background:#13161c;border:0.5px solid #252830;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;color:#d0d0d0">
      <input type="checkbox" value="${w.id}" style="width:auto;margin:0"> ${w.nimi}
    </label>`).join('');
}

async function laadiTTObjektid() {
  const ettevoteId = document.getElementById('tt-ettevote').value;
  if(!ettevoteId) return;
  const objektid = await api(`/api/tood/objektid/${ettevoteId}`);
  const sel = document.getElementById('tt-objekt');
  sel.innerHTML = '<option value="">— Pole määratud —</option>';
  if(Array.isArray(objektid)) objektid.forEach(o => sel.innerHTML += `<option value="${o.id}">${o.nimi}</option>`);
}

async function lisaTulevaneToo() {
  const ettevote_id=document.getElementById('tt-ettevote').value;
  const objekt_id=document.getElementById('tt-objekt').value||null;
  const kuupaev=document.getElementById('tt-kuupaev').value;
  const algus_kell=document.getElementById('tt-algus').value;
  const lopp_kell=document.getElementById('tt-lopp').value;
  const kirjeldus=document.getElementById('tt-kirjeldus').value;
  if(!kuupaev) return naitaTeade('tt-teade','viga','Vali kuupäev!');
  const valitudWorkers = [...document.querySelectorAll('#tt-workers-valik input:checked')].map(cb => cb.value);
  if(!valitudWorkers.length) return naitaTeade('tt-teade','viga','Vali vähemalt üks töötaja!');
  let ok = 0;
  for(const worker_id of valitudWorkers) {
    const r = await api('/api/admin/tulevased', {method:'POST', body: JSON.stringify({worker_id,ettevote_id,objekt_id,kuupaev,algus_kell,lopp_kell,kirjeldus})});
    if(r.ok) ok++;
  }
  if(ok > 0){ naitaTeade('tt-teade','ok',`✅ Lisatud ${ok} töötajale!`); document.getElementById('tt-kirjeldus').value=''; laadiTulevasteToodTabel(); }
  else naitaTeade('tt-teade','viga','Viga lisamisel');
}

async function laadiTulevasteToodTabel() {
  const r = await api('/api/admin/tulevased');
  let html='<table><thead><tr><th>Töötaja</th><th>Ettevõte</th><th>Objekt</th><th>Kuupäev</th><th>Kellaaeg</th><th>Kirjeldus</th><th></th></tr></thead><tbody>';
  if(Array.isArray(r)) r.forEach(t=>{ html+=`<tr><td>${t.worker_nimi}</td><td>${t.ettevote_nimi}</td><td style="color:#666">${t.objekt_nimi||'—'}</td><td>${formatKp(t.kuupaev)}</td><td>${t.algus_kell||''}${t.lopp_kell?'–'+t.lopp_kell:''}</td><td style="color:#666">${t.kirjeldus||'—'}</td><td><button class="nupp punane" onclick="kustutaTulevaneToo(${t.id})">🗑</button></td></tr>`; });
  document.getElementById('tulevasteToodTabel').innerHTML=html+'</tbody></table>';
}

async function kustutaTulevaneToo(id) {
  if(!confirm('Kustutad?')) return;
  await api(`/api/admin/tulevased/${id}`, {method:'DELETE'});
  laadiTulevasteToodTabel();
}

function formatKp(str) {
  const d=new Date(str);
  return d.toLocaleDateString('et-EE',{day:'numeric',month:'short',year:'numeric'});
}

function naitaTeade(id,tyyp,tekst) {
  const el=document.getElementById(id);
  el.className='teade '+tyyp; el.textContent=tekst; el.style.display='block';
  setTimeout(()=>el.style.display='none',4000);
}

async function salvestaMuuTasu(kirjeId) {
  const input = document.getElementById(`muu-tasu-${kirjeId}`);
  const tunnitasu = input.value;
  if (!tunnitasu) return;
  const r = await api(`/api/admin/tookirjed/${kirjeId}/tunnitasu`, {
    method: 'PUT',
    body: JSON.stringify({ tunnitasu })
  });
  if (r.ok) {
    input.style.borderColor = '#4ade80';
    setTimeout(() => laadiKokkuvote(), 800);
  } else {
    input.style.borderColor = '#ef4444';
  }
}

async function välju() {
  localStorage.removeItem('adminToken');
  window.location='/admin-login';
}

init();
</script>
</body>
</html>

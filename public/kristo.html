<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Paigaldus — Projektid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d0f13; color: #e2e8f0; min-height: 100vh; }

    .topbar { background: #13161c; border-bottom: 0.5px solid rgba(255,255,255,0.07); padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 32px; height: 32px; background: #FFF200; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #002060; }
    .brand-name { font-size: 13px; font-weight: 700; color: #FFF200; }
    .brand-sub { font-size: 10px; color: #555; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .logout-btn { font-size: 11px; color: #444; background: none; border: 0.5px solid #2a2a2a; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
    .logout-btn:hover { border-color: #ef4444; color: #ef4444; }

    /* Breadcrumb */
    .breadcrumb { display: flex; align-items: center; gap: 6px; padding: 12px 20px; background: #13161c; border-bottom: 0.5px solid rgba(255,255,255,0.04); font-size: 12px; flex-wrap: wrap; }
    .bc-item { color: #555; cursor: pointer; }
    .bc-item:hover { color: #aaa; }
    .bc-item.ak { color: #e2e8f0; cursor: default; }
    .bc-sep { color: #333; }

    .leht { max-width: 600px; margin: 0 auto; padding: 20px 16px 40px; }

    /* Nimekiri */
    .nimekiri { display: flex; flex-direction: column; gap: 8px; }

    /* Kirjelduse kaart (tase 1) */
    .kirjeldus-kaart { background: #13161c; border: 0.5px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 16px 18px; cursor: pointer; display: flex; align-items: center; gap: 14px; transition: border-color 0.15s; }
    .kirjeldus-kaart:hover { border-color: rgba(255,242,0,0.3); }
    .kirjeldus-ikoon { width: 44px; height: 44px; background: rgba(255,242,0,0.08); border: 0.5px solid rgba(255,242,0,0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .kirjeldus-info { flex: 1; }
    .kirjeldus-nimi { font-size: 15px; font-weight: 600; color: #e2e8f0; margin-bottom: 4px; }
    .kirjeldus-meta { font-size: 11px; color: #505560; }
    .kirjeldus-nool { color: #333; font-size: 18px; }

    /* Poe kaart (tase 2) */
    .pood-kaart { background: #13161c; border: 0.5px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 14px 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: border-color 0.15s; }
    .pood-kaart:hover { border-color: rgba(255,242,0,0.3); }
    .pood-badge { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 4px; background: #FFF200; color: #002060; flex-shrink: 0; }
    .pood-nimi { font-size: 14px; font-weight: 600; color: #e2e8f0; flex: 1; }
    .pood-arv { background: rgba(255,242,0,0.08); border: 0.5px solid rgba(255,242,0,0.15); border-radius: 20px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: #FFF200; flex-shrink: 0; }
    .pood-nool { color: #333; font-size: 16px; }

    /* Piltide galerii (tase 3) */
    .galerii-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .galerii-pealkiri { font-size: 14px; font-weight: 600; color: #e2e8f0; }
    .zip-nupp { background: #FFF200; color: #002060; border: none; border-radius: 8px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none; }
    .galerii-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .galerii-pilt-wrap { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; cursor: pointer; }
    .galerii-pilt-wrap img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.2s; }
    .galerii-pilt-wrap:hover img { opacity: 0.8; }
    .galerii-kuupaev { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.7)); padding: 8px 5px 4px; font-size: 10px; color: rgba(255,255,255,0.8); font-weight: 500; }

    /* Suur pilt */
    .suur-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.97); z-index: 300; align-items: center; justify-content: center; }
    .suur-overlay.avatud { display: flex; }
    .suur-overlay img { max-width: 95vw; max-height: 90vh; object-fit: contain; border-radius: 6px; }
    .suur-sulge { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.1); border: none; border-radius: 50%; color: #fff; font-size: 20px; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .suur-nool { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); border: none; border-radius: 50%; color: #fff; font-size: 22px; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .suur-nool.vasak { left: 12px; }
    .suur-nool.parem { right: 12px; }
    .suur-info { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; font-size: 12px; color: rgba(255,255,255,0.5); }

    .tyhi { padding: 50px 20px; text-align: center; color: #3a3d45; font-size: 14px; }
    .laadimine { padding: 30px 20px; text-align: center; color: #3a3d45; font-size: 13px; }

    @media (min-width: 480px) { .galerii-grid { grid-template-columns: repeat(4, 1fr); } }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-logo">L</div>
      <div><div class="brand-name">LIDL PROJEKTID</div><div class="brand-sub">Royal Paigaldus</div></div>
    </div>
    <div class="topbar-right">
      <span style="font-size:13px;color:#bbb" id="workerNimi"></span>
      <button class="logout-btn" onclick="välju()">Välja</button>
    </div>
  </div>

  <!-- Breadcrumb -->
  <div class="breadcrumb" id="breadcrumb">
    <span class="bc-item ak">Kõik projektid</span>
  </div>

  <!-- Suur pilt -->
  <div class="suur-overlay" id="suurOverlay">
    <button class="suur-sulge" onclick="sulgeSuur()">✕</button>
    <button class="suur-nool vasak" onclick="navigeeri(-1)">‹</button>
    <img id="suurImg" src="" alt="">
    <button class="suur-nool parem" onclick="navigeeri(1)">›</button>
    <div class="suur-info" id="suurInfo"></div>
  </div>

  <div class="leht">
    <div id="sisu"><div class="laadimine">Laadimine...</div></div>
  </div>

  <script>
    var KUUD_L = ['jaan','veeb','märts','apr','mai','juu','juul','aug','sept','okt','nov','dets'];
    var TOKEN = localStorage.getItem('workerToken') || '';
    var praegusedPildid = [], praeguneIndex = 0;
    var aktiivsKirjeldus = null, aktiivsObjektId = null, aktiivsObjektNimi = null;

    function api(url) {
      return fetch(url, { headers: { 'x-session-token': TOKEN, 'Content-Type': 'application/json' } }).then(function(r) { return r.json(); });
    }

    function formatKp(str) {
      var s = str ? String(str).split('T')[0] : '';
      var parts = s.split('-');
      if (parts.length < 3) return s;
      return parseInt(parts[2]) + '. ' + KUUD_L[parseInt(parts[1])-1];
    }

    async function init() {
      if (!TOKEN) { window.location = '/'; return; }
      var s = await api('/api/auth/sessioon');
      if (!s.sisselogitud || s.isAdmin) { window.location = '/'; return; }
      if (s.workerId !== 17) { window.location = '/tootaja'; return; }
      document.getElementById('workerNimi').textContent = s.nimi;
      laadiKirjeldused();
    }

    // ── TASE 1: Kirjeldused ──────────────────────────────────
    async function laadiKirjeldused() {
      history.pushState(null, '', '/kristo');
      aktiivsKirjeldus = null; aktiivsObjektId = null;
      uuendaBreadcrumb();
      document.getElementById('sisu').innerHTML = '<div class="laadimine">Laadimine...</div>';
      var r = await api('/api/kristo/kirjeldused');
      if (!r.ok || !r.kirjeldused || !r.kirjeldused.length) {
        document.getElementById('sisu').innerHTML = '<div class="tyhi">📷 Pilte pole veel lisatud</div>';
        return;
      }
      document.getElementById('sisu').innerHTML = '<div class="nimekiri">' +
        r.kirjeldused.map(function(k) {
          return '<div class="kirjeldus-kaart" onclick="laadiPoed(\'' + k.kirjeldus.replace(/'/g,"\\'") + '\')">'
            + '<div class="kirjeldus-ikoon">🔧</div>'
            + '<div class="kirjeldus-info">'
            + '<div class="kirjeldus-nimi">' + k.kirjeldus + '</div>'
            + '<div class="kirjeldus-meta">📷 ' + k.piltide_arv + ' pilti · ' + k.poodide_arv + ' poodi · viimane: ' + formatKp(k.viimane_kuupaev) + '</div>'
            + '</div>'
            + '<div class="kirjeldus-nool">›</div>'
            + '</div>';
        }).join('') + '</div>';
    }

    // ── TASE 2: Poed ─────────────────────────────────────────
    async function laadiPoed(kirjeldus) {
      history.pushState({ tase: 'poed', kirjeldus: kirjeldus }, '', '/kristo');
      aktiivsKirjeldus = kirjeldus; aktiivsObjektId = null;
      uuendaBreadcrumb();
      document.getElementById('sisu').innerHTML = '<div class="laadimine">Laadimine...</div>';
      var r = await api('/api/kristo/poed?kirjeldus=' + encodeURIComponent(kirjeldus));
      if (!r.ok || !r.poed || !r.poed.length) {
        document.getElementById('sisu').innerHTML = '<div class="tyhi">Poode ei leitud</div>';
        return;
      }
      document.getElementById('sisu').innerHTML = '<div class="nimekiri">' +
        r.poed.map(function(p) {
          return '<div class="pood-kaart" onclick="laadiPildid(' + p.objekt_id + ', \'' + p.objekt_nimi.replace(/'/g,"\\'") + '\')">'
            + '<span class="pood-badge">LIDL</span>'
            + '<span class="pood-nimi">' + p.objekt_nimi + '</span>'
            + '<span class="pood-arv">📷 ' + p.piltide_arv + '</span>'
            + '<span class="pood-nool">›</span>'
            + '</div>';
        }).join('') + '</div>';
    }

    // ── TASE 3: Pildid ───────────────────────────────────────
    async function laadiPildid(objektId, objektNimi) {
      history.pushState({ tase: 'pildid', kirjeldus: aktiivsKirjeldus, objektId: objektId, objektNimi: objektNimi }, '', '/kristo');
      aktiivsObjektId = objektId; aktiivsObjektNimi = objektNimi;
      uuendaBreadcrumb();
      document.getElementById('sisu').innerHTML = '<div class="laadimine">Laadimine...</div>';
      var r = await api('/api/kristo/pildid/' + objektId + '?kirjeldus=' + encodeURIComponent(aktiivsKirjeldus));
      praegusedPildid = (r.ok && r.pildid) ? r.pildid : [];

      if (!praegusedPildid.length) {
        document.getElementById('sisu').innerHTML = '<div class="tyhi">Pilte pole</div>';
        return;
      }

      var zipUrl = '/api/pildid/admin/zip/' + objektId + '?_token=' + TOKEN;
      document.getElementById('sisu').innerHTML =
        '<div class="galerii-header">'
        + '<div class="galerii-pealkiri">' + objektNimi + '</div>'
        + '<a class="zip-nupp" href="' + zipUrl + '" target="_blank">⬇ ZIP</a>'
        + '</div>'
        + '<div class="galerii-grid">'
        + praegusedPildid.map(function(p, i) {
          return '<div class="galerii-pilt-wrap" onclick="avaSuur(' + i + ')">'
            + '<img src="' + p.url + '" loading="lazy" alt="">'
            + '<div class="galerii-kuupaev">' + formatKp(p.kuupaev) + '</div>'
            + '</div>';
        }).join('')
        + '</div>';
    }

    // ── BREADCRUMB ───────────────────────────────────────────
    function uuendaBreadcrumb() {
      var bc = document.getElementById('breadcrumb');
      var tagasiHtml = '';
      if (aktiivsKirjeldus && !aktiivsObjektId) {
        tagasiHtml = '<button onclick="laadiKirjeldused()" style="background:#1e2128;border:0.5px solid #252830;border-radius:6px;color:#aaa;font-size:12px;padding:5px 10px;cursor:pointer;margin-right:8px">← Tagasi</button>';
      } else if (aktiivsObjektId) {
        tagasiHtml = '<button onclick="laadiPoed(aktiivsKirjeldus)" style="background:#1e2128;border:0.5px solid #252830;border-radius:6px;color:#aaa;font-size:12px;padding:5px 10px;cursor:pointer;margin-right:8px">← Tagasi</button>';
      }
      var html = tagasiHtml + '<span class="bc-item' + (!aktiivsKirjeldus ? ' ak' : '') + '" onclick="laadiKirjeldused()">Kõik projektid</span>';
      if (aktiivsKirjeldus) {
        html += '<span class="bc-sep">›</span>';
        html += '<span class="bc-item' + (!aktiivsObjektId ? ' ak' : '') + '" onclick="laadiPoed(\'' + aktiivsKirjeldus.replace(/'/g,"\\'") + '\')">' + aktiivsKirjeldus + '</span>';
      }
      if (aktiivsObjektId) {
        html += '<span class="bc-sep">›</span>';
        html += '<span class="bc-item ak">' + aktiivsObjektNimi + '</span>';
      }
      bc.innerHTML = html;
    }

    // ── SUUR PILT ────────────────────────────────────────────
    function avaSuur(index) {
      praeguneIndex = index;
      uuendaSuur();
      document.getElementById('suurOverlay').classList.add('avatud');
    }

    function sulgeSuur() { document.getElementById('suurOverlay').classList.remove('avatud'); }

    function navigeeri(suund) {
      praeguneIndex = (praeguneIndex + suund + praegusedPildid.length) % praegusedPildid.length;
      uuendaSuur();
    }

    function uuendaSuur() {
      var p = praegusedPildid[praeguneIndex];
      if (!p) return;
      document.getElementById('suurImg').src = p.url;
      document.getElementById('suurInfo').textContent = formatKp(p.kuupaev) + ' · ' + (praeguneIndex+1) + '/' + praegusedPildid.length;
    }

    document.addEventListener('keydown', function(e) {
      if (!document.getElementById('suurOverlay').classList.contains('avatud')) return;
      if (e.key === 'ArrowLeft') navigeeri(-1);
      if (e.key === 'ArrowRight') navigeeri(1);
      if (e.key === 'Escape') sulgeSuur();
    });
    document.getElementById('suurOverlay').addEventListener('click', function(e) { if (e.target === this) sulgeSuur(); });

    window.addEventListener('popstate', function(e) {
      if (e.state && e.state.tase === 'pildid') {
        aktiivsKirjeldus = e.state.kirjeldus;
        laadiPoed(e.state.kirjeldus);
      } else if (e.state && e.state.tase === 'poed') {
        laadiKirjeldused();
      } else {
        laadiKirjeldused();
      }
    });

    function välju() { localStorage.removeItem('workerToken'); window.location = '/'; }

    init();
  </script>
</body>
</html>
